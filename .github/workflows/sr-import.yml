name: Service Report Import

on:
  schedule:
    - cron: '0 22 * * *'    # 07:00 KST daily — after the GAS night run and drive-index (06:30)
  workflow_dispatch:
    inputs:
      since:
        description: 'YYYY-MM-DD (빈칸 = 최근 30일, 전체 백필 = 2023-01-01)'
        required: false
        default: ''
      dry_run:
        description: '1 = Supabase 쓰기 없이 결과만 로그'
        required: false
        default: '1'

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: sr-import
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run importer
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SINCE: ${{ github.event.inputs.since }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=""
          if [ -n "$SINCE" ]; then ARGS="$ARGS --since $SINCE"; fi
          if [ "$DRY_RUN" = "1" ]; then ARGS="$ARGS --dry-run"; fi
          python scripts/sr_import.py $ARGS

      - name: Notify on failure
        if: failure()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WF_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/notify_failure.py
