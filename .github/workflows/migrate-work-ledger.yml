name: Migrate Work Ledger

# 업무관리대장 시트 전체 → repairs/work_actions 일회성 이관 (scripts/migrate_work_ledger.py).
# 수동 실행 전용. 기본은 dry_run=1 (쓰기 없이 건수만). sql/027 이 먼저 적용돼 있어야 한다.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '1 = 쓰기 없이 건수만 로그 (기본), 0 = 실제 이관'
        default: '1'

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: work-ledger-sync     # 예전 sync 와 동시에 돌지 않게 같은 그룹
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Migrate work ledger
        working-directory: scripts   # sync_work_ledger 를 같은 폴더에서 import
        env:
          DRIVE_SA_JSON: ${{ secrets.DRIVE_SA_JSON }}
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "0" ]; then
            python migrate_work_ledger.py
          else
            python migrate_work_ledger.py --dry-run
          fi

      - name: Notify on failure
        if: failure()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WF_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/notify_failure.py
