<script>
const DATA = [{"id": "26-29", "seq": 29, "issue_date": "2026-08-04", "posted": "2026-08-03", "board_no": 681, "url": "https://www.imokorea.org/board/board.asp?B_ID=Inter_Maritime&ty=view&page=1&bandstart=1&findtype=&findstr=&idx=5734&ii=681", "pdf": "(26-29호) IMO소식 및 국제해사동향.F.pdf", "pages": 8, "file": "2026/2026-08/IMO소식_26-29호_20260804.html", "items": [{"section": "IMO 소식", "title": "IMO, 해상연료 공급망 추적체계 전문가 워크숍 개최", "source": "IMO Media Centre, '26.7.24.", "category": "탈탄소", "relevance": "중", "brief": "7.15 Chain of Custody(물리적 분리·질량균형·Book&Claim) 워크숍. IMO LCA/SFCS 지침 개발에 반영.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "IMO는 MEPC 84의 요청에 따라 7월 15일 IMO 본부에서 대면·온라인 병행 방식으로 지속가능 해상연료 인증체계 마련을 위한 공급망 추적(Chain of Custody) 모델 전문가 워크숍을 개최함"}, {"d": 1, "t": "이번 워크숍은 공급망 추적 모델(물리적 분리, 질량균형, Book and Claim)에 대한 이해를 높이고 IMO 생애주기평가(LCA) 체계에 적용하는 방안을 논의하기 위해 마련됨"}, {"d": 0, "t": "IMO는 연료 공급망 전 과정의 추적성과 투명성 확보를 지속가능 해상연료 인증지침(SFCS, Sustainable Fuel Certification Scheme)의 핵심 원칙으로 제시함"}, {"d": 1, "t": "IMO LCA 체계는 지속가능 해상연료 인증체계 지침(SFCS) 개발을 포함하고 있으며, 연료의 Well-to-Tank(WtT) 온실가스 배출량 산정 시 공급망 추적체계를 반영해 연료의 지속가능성 특성을 검증하고 투명성을 확보하여 이중 계산을 방지하도록 규정하고 있음"}, {"d": 0, "t": "전문가들은 타 산업의 공급망 추적 운영 경험을 IMO 지침 개발에 활용할 필요성을 강조함"}, {"d": 1, "t": "참석 전문가들은 특히 질량균형(Mass Balance) 방식의 활용 경험과 제도 간 정합성 확보의 중요성을 공유했으며, 이번 워크숍에서 논의된 정보와 의견은 IMO LCA 지침과 지속가능 해상연료 인증체계 지침(SFCS)의 추가 개발에 활용될 예정이라고 설명함"}]}]}, {"section": "IMO 소식", "title": "제12차 IMO 협약이행 전문위원회(III 12) 주요 논의 결과", "source": "", "category": "PSC", "relevance": "상", "brief": "7.20~24 III 12: PSC 절차서에 28개 협약 개정 반영, HSSC 검사지침 개정안 MSC 112 승인 요청(도선사 승강장치 반영), ISM Code 이행지침 전면개정 CG(~'28), CI Code 개정 CG.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "2026년 7월 20일부터 24일까지 IMO 본부에서 제12차 IMO 협약이행 전문위원회(III 12)가 개최되었으며, 의제 목록과 주요 논의사항 및 결과는 아래와 같음"}, {"d": 0, "t": "의제: 1 의제의 채택 / 2 다른 IMO 회의의 결정사항 / 3 항만수용시설 부족에 관한 보고서의 검토 및 분석 / 4 MSI 보고서 분석에 따른 교훈 및 안전 문제 / 5 CI Code 및 이행 지침 검토 / 6 PSC 활동과 절차의 조화로운 시행 / 7 PSC 신입직 교육훈련 매뉴얼 개발 / 8 정보 분석을 통해 확인된 IMO 규정 이행 관련 문제 / 9 통합감사요약보고서 분석 / 10 HSSC 최신 검사 지침 / 11 III Code 관련 규정의 의무사항에 대한 개략적인 목록 / 12 ISM Code 이행 지침의 전면 개정 / 13 IMO의 안전, 보안 및 환경관련 협약 조항의 통일 해석 / 14 UN 과의 협력 - 소형어선 점검 지침 및 체크리스트 초안 검토 / 15 격년회의 및 차기회의 잠정의제 / 16 '27년 차기 의장 및 부의장 선출 / 17 기타사항 / 18 결과 보고"}, {"d": 0, "t": "〈의제 4. 해양사고 조사보고서 분석에 따른 교훈 및 안전 문제〉 전문위원회는 IMO 홈페이지에 해양사고 조사보고서 분석 결과의 공개를 결정하고, 고압식 실린더의 위험성을 알리기 위한 회람문서를 발행함. 또한 사고 분석 결과 및 예방 교훈의 가시성 향상과 접근성 제고를 위해, 주요 SNS(X, LinkedIn 등)로 공개 채널을 확대하기로 결정함"}, {"d": 1, "t": "향후 SNS 특성을 반영한 콘텐츠 형식 논의를 위한 회기간 실무작업반(CG) 개설 예정임"}, {"d": 0, "t": "〈의제 5. CI Code 및 이행 지침 검토〉 전문위원회는 해양사고 조사 규정(CI code) 개정을 위해 회기중 작업반에 이어 회기간 실무작업반(CG)을 개설하고 지속 논의를 결정함(우리나라, 호주 등 11개국 공동 제출 문서)"}, {"d": 1, "t": "* 중대 해양사고의 경우, 발생일로부터 12개월 이내 최종 조사보고서 미발행 시 예비보고서 발행 의무 및 매년 중간성명서(최종 조사보고서 발행 전까지) 발행 의무 신설 등"}, {"d": 0, "t": "〈의제 6. 항만국통제(PSC) 활동과 절차의 조화로운 시행〉 전문위원회는 선박의 기계설비 및 유지보수 점검에 대한 항만국통제관(PSCO) 지침서 개발 제안 관련, 추가 검토 필요성이 제기됨에 따라 CG를 개설하여 지속 논의하기로 결정함"}, {"d": 1, "t": "* 점검 절차 항목의 높은 기술적 구체성을 고려하여 지침보다 교육훈련 매뉴얼로 활용하는 것이 적합"}, {"d": 1, "t": "IMO PSC 절차서에 최근 국제협약 제·개정 사항(선박 검사 및 증서 조화규정(HSSC, Harmonized System of Survey and Certification)에 따른 검사지침(A.1207(34)), 밀폐공간 출입에 관한 개정 권고안(MSC.581(110)) 등 28개 협약)을 반영하기로 결정함"}, {"d": 0, "t": "〈의제 7. 신규 항만국통제관(PSCO) 교육훈련 매뉴얼 개발〉 중국이 제8차 III('22.7.)에서 제출한 '신규 PSCO 교육훈련 매뉴얼' 승인 계획이 결정되었으며, 지역별 항만국통제 협의체(PSC MoU)와 중국이 협력하여 제13차 III에 개정안 제출 예정임"}, {"d": 0, "t": "〈의제 9. 통합감사요약보고서 분석〉 전문위원회는 통합감사요약보고서('11~'24) 분석 결과에 대해 차기 위원회(MSC 112, MEPC 85) 검토 승인 및 이사회(C 139) 보고를 요청함"}, {"d": 1, "t": "* SOLAS·MARPOL·STCW 등 IMSAS(IMO Member States Audit Scheme) 주요 국제협약의 반복 지적사항은 각 회원국의 이행 집행체계 미흡이며, 특히 협약의 국내 법제화 지연이 근본 원인으로 도출됨"}, {"d": 1, "t": "IMSAS 반복 지적사항에 대한 교육 프로그램 마련 및 기술지원 필요성 검토를 TC 77에 회부할 예정"}, {"d": 1, "t": "우리나라가 제안한 결함 분류법의 대조표 마련, 회원국감사 1차·2차 주기 분석 방법론 개선(ITCP 새 테마 접근방식, 1차 주기 분석 데이터와 연속성 유지 등)을 사무국에 요청"}, {"d": 0, "t": "〈의제 10. 선박검사 및 증서 조화규정에 따른 검사지침 개정〉 선박검사 및 증서 조화규정(HSSC) 검사지침 개정안을 MSC 112에 승인 요청함"}, {"d": 1, "t": "'원격검사 체크리스트'(가능/조건부/불가로 가능여부 분류·판단) 신설은 CG에서 추가 검토"}, {"d": 1, "t": "'검사지침'에 도선사 승강장치 성능기준 개정사항(현장 통신수단 구비, 선원 친숙화 교육 등) 반영"}, {"d": 0, "t": "〈의제 12. ISM Code 이행 지침의 전면개정〉 ISM Code 이행지침 개정안의 주요 문구 및 개정범위에 대해 회기중 작업반에서 추가 검토 필요성이 제기됨에 따라 CG를 개설하여 지속 논의(~'28년)하기로 결정함"}, {"d": 0, "t": "〈의제 14. UN과 협력, 소형어선 점검 지침 및 체크리스트 초안 검토〉 12m 미만 소형어선 점검 지침을 확정하고 MSC 112에 승인 요청함"}, {"d": 1, "t": "* 케이프타운 협정(24미터 이상 어선 대상) 미적용 소형어선의 안전강화를 위해 UN FAO(유엔식량농업기구)와 IMO가 공동 개발한 자발적 점검 지침(권고사항)"}]}]}, {"section": "IMO 소식", "title": "IMO 공지", "source": "", "category": "IMO 공지", "relevance": "하", "brief": "회의·사무국 공지 및 회원국 통보문(CL) 회람.", "groups": [{"label": "", "bullets": []}, {"label": "회의 및 사무국 공지", "bullets": [{"d": 0, "t": "(사무국) 제5차 IMO GHG 연구 조정위원회 구성 안내 (CL.5247, '26.7.24.)"}, {"d": 1, "t": "IMO 사무총장은 MEPC 84 결정에 따라 제5차 IMO GHG 연구 수행을 총괄할 조정위원회(Steering Committee) 구성을 완료하고 회원국 명단을 회람함"}, {"d": 1, "t": "조정위원회는 배출량 모델링 전문가 추천 절차를 거쳐 대한민국을 포함한 아르헨티나, 캐나다, 칠레, 중국, 덴마크, 이집트, 핀란드, 네덜란드, 노르웨이, 사우디아라비아, 싱가포르, 남아프리카공화국, 튀르키예, UAE 및 영국 등 16개 회원국으로 구성됨"}, {"d": 1, "t": "MEPC 부의장인 싱가포르 Hanqiang Tan이 조정위원회 업무를 총괄하며, 동 조정위원회의 첫 회의는 '26.9월 원격회의 방식으로 개최될 예정임"}]}, {"label": "기타 공지", "bullets": [{"d": 0, "t": "(카자흐스탄) 흑해 민간선박 공격 관련 입장 통보 (CL.5249, '26.7.22.)"}, {"d": 1, "t": "카자흐스탄 정부가 흑해에서 카스피 송유관 컨소시엄(CPC)의 원유 수송에 종사하던 민간 선박에 대한 무인기(UAV) 공격을 규탄하는 공식 입장을 IMO에 제출하고 회원국 대상 회람을 요청함"}, {"d": 1, "t": "당국은 해당 공격이 국제무역과 에너지 공급망의 안정성을 훼손하는 행위라고 주장하며, 공격의 즉각 중단과 항행의 자유 및 국제법 준수, 국제 운송 물류 에너지 수송망의 안전 보장을 촉구함"}, {"d": 1, "t": "* Caspian Pipeline Consortium: 카자흐스탄산 원유를 흑해 연안 터미널까지 수송하는 국제 송유관 운영 컨소시엄"}]}]}, {"section": "국제해사동향", "title": "eLoran, GNSS 교란 대응 대안으로 제시", "source": "The Maritime Executive, '26.7.22.", "category": "항해·안전", "relevance": "중", "brief": "중동 해역 GNSS 재밍·스푸핑 빈발(MSC ANTONIA 좌초 등). eLoran(100kHz, ~10m 정확도) 보완항법 제안, IMO 성능기준 미비 지적.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "최근 GNSS 교란이 빈발하는 해역에서 eLoran을 상용의 해운 보완 항법체계로 활용할 필요성을 제기함"}, {"d": 1, "t": "Overlook Systems Technologies의 수석 시스템 엔지니어 Victor Tasiemski는 최근 페르시아만, 호르무즈 해협, 홍해 및 오만만에서 GNSS 재밍과 스푸핑이 지속적으로 발생하면서 상선의 위치·항법·시각(PNT) 기능이 영향을 받고 있다고 설명함"}, {"d": 1, "t": "또한 2025년 홍해에서 발생한 MSC ANTONIA호 좌초와 2025년 오만만에서 발생한 FRONT EAGLE호와 ADALYNN호 충돌 사례를 GNSS 교란과 관련된 사례로 소개함"}, {"d": 1, "t": "JMIC도 2025년 11월부터 2026년 4월까지 해당 해역의 전자기 간섭(EMI)과 해상사고를 지속적으로 모니터링하고 있다고 설명함"}, {"d": 1, "t": "* Enhanced Loran: 지상 송신국의 저주파 신호를 이용해 위치·항법·시각(PNT) 정보를 제공하는 항법체계로, GNSS 장애 발생 시 대체 또는 보완 수단으로 활용되는 기술임 / ** Joint Maritime Information Center: 중동 해역의 상선 대상 위협과 해상보안 정보를 수집·분석·공유하는 다국적 해양정보공유센터로, 연합해군사령부 등 국제 해양안보 협력체계와 연계해 운영됨"}, {"d": 0, "t": "IMO의 성능기준과 관련해서는 eLoran을 PNT 센서로 인정하고 있으나, 최신 운항환경을 반영한 성능기준은 아직 마련되지 않았다고 지적함"}, {"d": 1, "t": "현재 IMO의 GNSS 성능기준은 재밍과 스푸핑이 일반화되기 이전에 제정된 기준이며, eLoran 수신기에 대한 최신 성능기준도 마련되지 않았다고 설명함"}, {"d": 1, "t": "이에 따라 GNSS와 eLoran 수신기 모두에 대해 전파교란 환경을 반영한 새로운 성능기준 개발이 필요하다고 주장함"}, {"d": 0, "t": "국가별 차원에서는 영국, 사우디아라비아 등의 eLoran 인프라가 상용 해운의 보완 항법체계 구축에 활용될 수 있다고 설명함"}, {"d": 1, "t": "영국은 Chain Odyssey와 Urgent Compass 사업을 추진하고 IMO NCSR 13에 관련 정보를 제출했다고 소개함"}, {"d": 1, "t": "사우디아라비아는 4개의 eLoran 송신소를 운영하며 페르시아만, 홍해 및 오만만을 포괄하는 신호 제공 기반을 구축했다고 소개함"}, {"d": 0, "t": "기술적 측면에서는 eLoran이 기존 기술과 상용 장비를 활용해 단기간 내 상용 해운에 적용 가능한 보완 항법체계로 평가됨"}, {"d": 1, "t": "eLoran은 약 10m 이하의 위치 정확도를 제공하고 100kHz 저주파 신호를 이용해 GNSS보다 재밍과 스푸핑에 대한 저항성이 높은 특성을 갖는다고 설명함"}, {"d": 1, "t": "또한 상용 수신기가 이미 공급되고 있어 정부, 산업계 및 국제표준기구 간 협력을 통해 수개월 내 해운 분야에 상용으로 적용할 수 있다고 주장함"}]}]}, {"section": "국제해사동향", "title": "영국 CCS 사업, 해저 임대계약 체결", "source": "Offshore Energy, '26.7.27.", "category": "에너지", "relevance": "하", "brief": "Liverpool Bay CCS, 기존 석유가스 인프라 재활용 영국 최초 CCS. 1단계 연 450만톤→2030년 이후 1,000만톤, 2028년 주입 개시.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "영국 리버풀베이 CCS(Liverpool Bay CCS) 사업이 기존 석유·가스 인프라를 재활용하는 영국 최초의 탄소포집·저장(CCS) 사업으로 해저 임대계약을 체결함"}, {"d": 1, "t": "리버풀베이 CCS는 영국 해저 관리기관인 크라운 에스테이트(The Crown Estate)와 CO₂ 수송·저장 사업을 위한 해저 임대계약을 체결했으며, 기존 인프라를 재활용하는 영국 최초의 CCS 사업으로 추진됨"}, {"d": 1, "t": "* 영국 왕실 소유의 해저와 해상 부지를 관리하며 해상풍력, CCS 등 해양 개발사업의 임대계약을 담당하는 공공기관"}, {"d": 0, "t": "리버풀베이 CCS 사업은 기존 해양 인프라를 활용해 잉글랜드 북서부와 북웨일스 산업단지의 CO₂를 해상 저장소로 수송·저장할 계획임"}, {"d": 1, "t": "HyNet 클러스터의 핵심 기반시설로 운영되며, 잉글랜드 북서부와 북웨일스의 CO₂ 포집시설에서 회수된 CO₂를 신규 및 기존 인프라를 통해 고갈된 해상 천연가스 저류층에 영구 저장할 예정임"}, {"d": 1, "t": "또한 기존 파이프라인 75마일 이상, 해양구조물 3기 및 육상 처리시설을 재활용하고, 산업시설과 수송망을 연결하기 위해 신규 파이프라인 21마일을 추가 건설할 계획임"}, {"d": 1, "t": "* 영국 잉글랜드 북서부와 북웨일스를 대상으로 산업부문의 CCS와 저탄소 수소 생산을 통합 추진하는 탄소포집·활용·저장(CCUS) 산업클러스터임"}, {"d": 0, "t": "사업 1단계는 연간 450만 톤의 CO₂ 저장능력을 확보하고 2030년 이후 연간 1,000만 톤까지 확대를 목표로 하며 최초 CO₂ 주입은 HyNet 클러스터 일정에 맞춰 2028년 시작될 예정임"}, {"d": 1, "t": "사업 운영기간 동안 총 1억900만 톤의 CO₂를 저장할 것으로 예상되며, 건설 과정에서 약 2,000개의 일자리를 창출하고 약 20억 파운드 규모의 공급망 투자를 유도할 것으로 전망됨"}, {"d": 0, "t": "HyNet 클러스터는 2021년 영국 정부의 Track-1 CCUS 클러스터로 선정된 이후 사업 추진 절차를 단계적으로 진행하고 있음"}, {"d": 1, "t": "리버풀베이 CCS 사업은 2024년 8월 크라운 에스테이트로부터 임대계약 예정통지를 받은 뒤 2025년 4월 금융종결(Financial Close)을 완료했으며, 현재 건설 단계가 진행 중임"}, {"d": 1, "t": "또한 Saipem은 CO₂ 압축설비 EPC, Rosetti Marino는 저장 플랫폼 4기의 EPC, Corinth Pipeworks는 강관 공급, JDR Cable Systems는 약 100km 규모의 33kV 해저케이블 공급을 각각 수행할 예정임"}]}]}]}, {"id": "26-30", "seq": 30, "issue_date": "2026-08-11", "posted": "2026-08-10", "board_no": 682, "url": "https://www.imokorea.org/board/board.asp?B_ID=Inter_Maritime&ty=view&page=1&bandstart=1&findtype=&findstr=&idx=5735&ii=682", "pdf": "(26-30호) IMO소식 및 국제해사동향.F.pdf", "pages": 7, "file": "2026/2026-08/IMO소식_26-30호_20260811.html", "items": [{"section": "IMO 소식", "title": "IMO, 회원국 감사제도 1차 감사주기 완료", "source": "IMO Media Centre, '26.7.29.", "category": "IMO 제도", "relevance": "하", "brief": "IMSAS 1차 주기 168개국(94%) 완료. 2027.7월부터 개정 IMSAS·상시모니터링(ICMM) 기반 2차 주기 시행.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "IMO는 2016년 의무화된 회원국 감사제도(IMSAS)에 따라 168개 회원국에 대한 첫 번째 글로벌 감사를 완료했다고 발표함"}, {"d": 1, "t": "이번 감사는 회원국의 IMO 협약 이행 및 집행 상태를 평가하기 위해 실시됐으며, 전체 IMO 회원국의 약 94%가 감사를 받아 글로벌 해사 거버넌스에 대한 가장 광범위한 공동 평가 가운데 하나를 구성했다고 설명함"}, {"d": 1, "t": "* IMO Member State Audit Scheme: 회원국이 IMO 협약과 의무를 효과적으로 이행·집행하고 있는지를 평가하기 위해 시행되는 IMO의 의무 감사제도로, 2016년부터 모든 회원국을 대상으로 의무 적용되고 있음"}, {"d": 0, "t": "1차 감사 결과는 회원국의 협약 이행 취약 분야를 파악하고 기술협력 지원 방향을 설정하는 근거로 활용됨"}, {"d": 1, "t": "감사 결과, 시정조치계획(CAP)과 통합감사보고서(CASR) 분석을 통해 반복적으로 나타나는 문제와 근본 원인이 확인됐으며, IMO는 이를 바탕으로 회원국의 제도적 공백 해소와 시정조치 이행을 지원하는 맞춤형 기술협력을 추진할 계획이라고 설명함"}, {"d": 1, "t": "또한 IMSAS 결과는 IMO 역량개발전략(Capacity-Development Strategy)에 따른 주제별 기술협력사업 수립에도 활용될 예정임"}, {"d": 0, "t": "IMO는 2027년부터 위험기반·데이터 기반 접근을 강화한 제2차 감사주기를 시행할 예정임"}, {"d": 1, "t": "제2차 감사는 2027년 7월 개정된 IMSAS 체계와 절차에 따라 시작되며, 새로운 지속 모니터링 메커니즘(ICMM)을 도입해 상시 모니터링, 감사 우선순위 설정 및 감사 결과와 역량개발·기술협력 간 연계를 강화할 계획이라고 설명함"}, {"d": 1, "t": "* IMSAS Continuous Monitoring Mechanism: 제2차 IMSAS 감사주기부터 도입되는 상시 모니터링 체계로, 위험기반·데이터 기반 접근을 통해 감사 우선순위 설정과 기술협력 연계를 지원하는 제도임"}, {"d": 0, "t": "IMO는 회원국과 정부 지명 감사원의 참여가 제도운영의 핵심이라고 평가하며 감사원 후보 추천을 지속 요청함"}, {"d": 1, "t": "IMO는 첫 번째 감사주기 완료가 회원국의 IMO 협약 이행에 대한 지속적인 의지를 보여주는 사례라고 평가했으며, 특히 여성과 청년 전문가를 포함한 자격을 갖춘 감사원 후보를 지속적으로 추천해 줄 것을 회원국에 요청함"}]}]}, {"section": "IMO 소식", "title": "IMO 공지", "source": "", "category": "IMO 공지", "relevance": "하", "brief": "회의·사무국 공지 및 회원국 통보문(CL) 회람.", "groups": [{"label": "", "bullets": []}, {"label": "회의 및 사무국 공지", "bullets": [{"d": 0, "t": "(사무국) 제112차 해사안전위원회(MSC 112) 개최 안내 (CL.5240, '26.7.20.)"}, {"d": 1, "t": "제112차 해사안전위원회(MSC 112)가 '26.12.14.~18. 영국 런던 IMO 본부에서 하이브리드 방식으로 개최될 예정이며, SOLAS 비당사국도 강제협약 개정안 채택 심의에 참여하도록 초청함"}, {"d": 1, "t": "주요 의제로 SOLAS 협약, IGC Code, IGF Code 및 검사용 접근수단 기술규정 개정안 채택, 자율운항선박(MASS), 대체연료·신기술 선박 안전규제, 해사보안, 해적행위, 전문위원회 보고서 검토 등이 포함되며, MASS, 대체연료 안전규제, GBS, LSA Code 및 강제협약 개정 관련 작업반 구성이 검토될 예정임"}, {"d": 1, "t": "* Goal-Based Standards: 선박의 설계·건조 시 충족해야 할 목표기반 안전기준 / ** Life-Saving Appliances Code: 선박 구명설비의 성능 및 설치기준을 규정한 국제기준"}, {"d": 0, "t": "(사무국) 제13차 선박시스템·설비 전문위원회(SSE 13) 개최 안내 (CL.5229, '26.7.22.)"}, {"d": 1, "t": "제13차 선박시스템·설비 전문위원회(SSE 13)가 '27.3.15.~19. 영국 런던 IMO 본부에서 하이브리드 방식으로 개최될 예정임"}, {"d": 1, "t": "주요 의제로 SOLAS 제II-2장 및 LSA Code 개정, 대체연료·신기술 선박의 GHG 안전규제 개발, 신에너지 차량 운반선 화재위험 저감, 컨테이너선 화재 대응기준, 불소계 소화약제 사용 제한 및 LSA Code 점수복 성능기준 개정 등이 포함되며, 구명설비·화재방호·GHG 안전 분야 작업반 구성이 검토될 예정임"}, {"d": 0, "t": "(사무국) 제33차 ICAO/IMO 항공·해상 수색구조 공동작업반 개최 안내 (CL.5241, '26.7.27.)"}, {"d": 1, "t": "제33차 ICAO/IMO 항공·해상 수색구조 공동작업반(JWG 33) 회의가 '26.11.9.~13. 스웨덴 말뫼에서 영어 단일언어 대면 방식으로 개최될 예정이며, IMO와 ICAO 회원국의 수색·구조 전문가가 참석할 예정임"}, {"d": 1, "t": "주요 의제로 IAMSAR Manual 개정, 해상·항공 SAR 계획 및 절차 조화, 대량구조(Mass Rescue Operations), LRIT·GMDSS·GADSS 운영, RCC/RSC 운영기준, SAR 통신체계, 인력 교육훈련 및 국제 기술협력 등이 논의될 예정임"}, {"d": 1, "t": "* IAMSAR Manual: IMO·ICAO 공동 「국제 항공·해상 수색구조 매뉴얼」 / ** Global Aeronautical Distress and Safety System: 항공기 조난 추적 및 구조 지원을 위한 글로벌 항공안전통신체계 / *** Rescue Coordination Centre / Rescue Sub-Centre: 수색·구조조정센터 / 지역 수색·구조조정센터"}]}, {"label": "기타 공지", "bullets": [{"d": 0, "t": "(우크라이나) 흑해 러시아 항만 입출항 선박 관련 입장 통보 (CL.5252, '26.7.29.)"}, {"d": 1, "t": "우크라이나 정부가 러시아 항만을 오가는 외국 선박에 대한 위험과 관련한 외교부 성명을 IMO에 제출하고 회원국 등에 회람을 요청함"}, {"d": 1, "t": "당국은 러시아가 흑해 민간 화물선과 우크라이나 항만 기반시설을 공격하고 있으며, 러시아의 흑해 배타적경제수역 항행위험 경고가 러시아 항만 입출항 선박을 겨냥한 추가 도발을 시사할 수 있다고 주장함"}, {"d": 1, "t": "해운회사들이 흑해 러시아 항만 운항을 일시 중단할 것을 촉구하는 한편, 우크라이나는 유엔헌장 제51조에 따른 자위권을 행사하여 항만과 해상교통로를 보호할 것이라고 밝힘"}]}]}, {"section": "국제해사동향", "title": "ABS, 암모니아 연료 안전관리 통합 접근법 제시", "source": "The Maritime Executive, '25.7.31.", "category": "대체연료·안전", "relevance": "하", "brief": "ABS: STCW 개정·재교육, HAZID/HAZOP+CFD+에이전트 기반 확률 위험분석을 결합한 통합 안전관리 제안.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "미국선급협회(ABS)는 암모니아 연료의 안전한 도입을 위해 위험성 평가부터 비상대응까지 포괄하는 통합 안전관리체계의 필요성을 제시함"}, {"d": 1, "t": "ABS는 암모니아가 탄소를 배출하지 않는 연소 특성과 확장 가능성을 바탕으로 탄소중립 달성을 위한 유력한 연료로 평가받고 있으나, 독성·가연성·부식성과 같은 안전 문제를 해결하는 것이 상용화의 핵심 과제라고 설명함"}, {"d": 0, "t": "선원 교육과 국제기준 측면에서는 암모니아의 특성을 반영한 STCW 개정과 전문 교육체계 마련이 필요하다고 설명함"}, {"d": 1, "t": "현재 STCW 협약의 대체연료 교육기준이 LNG 운용 경험을 기반으로 마련돼 있어 암모니아의 독성, 재료 적합성 및 비상대응 절차를 충분히 반영하지 못한다고 설명함"}, {"d": 1, "t": "또한 기존 선원 역량만으로는 암모니아 연료의 고유 위험에 대응하기 어려워 포괄적인 재교육이 필요하다고 강조함"}, {"d": 0, "t": "기술적 측면에서는 HAZID·HAZOP과 CFD 시뮬레이션을 연계한 위험성 평가가 암모니아 안전관리의 핵심 수단으로 제시됨"}, {"d": 1, "t": "HAZID와 HAZOP을 통해 벙커링부터 기관실 비상상황까지 잠재 위험을 식별하고, CFD(전산유체역학) 시뮬레이션으로 암모니아 누출 확산과 증기구름 거동을 분석해 안전설계와 비상대응체계 수립에 활용할 수 있다고 설명함"}, {"d": 1, "t": "또한 실제 훈련은 비용과 안전성 한계가 있는 만큼 시뮬레이션 기술이 이를 효과적으로 보완할 수 있다고 평가함"}, {"d": 1, "t": "* Hazard Identification: 설계·운영 과정에서 발생 가능한 위험요인을 체계적으로 식별하는 위험성 평가기법 / ** Hazard and Operability Study: 설계 의도에서 벗어나는 운전 상태를 분석해 잠재적 위험과 운전성 문제를 평가하는 체계적 위험성 분석기법 / *** Computational Fluid Dynamics: 유체의 흐름과 가스 확산 등을 수치적으로 해석하는 전산유체역학 기법으로, 암모니아 누출 확산 및 비상상황 시뮬레이션에 활용"}, {"d": 0, "t": "ABS는 CFD와 에이전트 기반 위험분석을 결합한 통합 안전관리 접근법이 암모니아 연료의 안전성을 높일 수 있다고 설명함"}, {"d": 1, "t": "CFD 분석 결과와 HAZID·HAZOP 결과, 사람의 행동 특성을 결합한 에이전트 기반 확률론적 위험분석을 통해 다양한 누출 시나리오와 대피 과정을 모의할 수 있다고 설명함"}, {"d": 1, "t": "또한 환경 변화, 자원 가용성, 대응시간 등을 반영한 동적 위험평가를 통해 위험지역 식별, 대피절차 검증 및 비상대응 협력체계 개선이 가능하다고 소개함"}]}]}, {"section": "국제해사동향", "title": "컨테이너선 리튬이온 배터리 운송 규제 공백 지적", "source": "Lloyd's List, '26.7.31.", "category": "컨테이너 안전", "relevance": "상", "brief": "IMDG SP188 면제로 대량 리튬배터리 미신고 문제(노트북 4,200대=전기차 3~4대분). X-Press Godavari 사례. SP936 유사 중량기준 신고 의무화 제안 → 9월 CCC 12 논의.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "다수 회원국과 해운업계는 현행 IMDG Code 특별규정(SP188)의 규제 공백을 해소하기 위한 공동제안서를 IMO 화물 및 컨테이너 운송 전문위원회(CCC)에 제출함"}, {"d": 1, "t": "일정 용량 이하의 리튬이온 배터리는 시험 및 포장요건을 충족할 경우 운송인에 대한 위험물 신고가 면제되는 현행 SP188 규정의 개선 필요성을 제기함"}, {"d": 1, "t": "* Special Provision 188: IMDG Code 특별규정으로, 일정 와트시(Wh) 이하의 리튬이온 배터리가 시험 및 포장요건을 충족할 경우 위험물 신고 의무를 면제하는 규정"}, {"d": 0, "t": "현행 SP188 규정은 대량의 리튬이온 배터리가 적재되더라도 운송인에게 신고되지 않아 화재위험을 사전에 관리하기 어렵다는 지적이 제기됨"}, {"d": 1, "t": "99Wh 배터리가 장착된 노트북 4,200대를 적재한 40피트 컨테이너를 사례로 제시하며, 개별 제품은 SP188 적용 대상이지만 컨테이너 전체 배터리 용량은 전기차 3~4대 수준에 해당함에도 위험물 신고 대상이 아니라고 설명함"}, {"d": 1, "t": "이에 선사는 화재위험 평가, 적재계획 수립 및 비상대응 준비에 필요한 정보를 확보하기 어렵다고 설명함"}, {"d": 0, "t": "또한 X-Press Godavari호 화재를 SP188 규제 공백이 실제 사고로 이어질 수 있는 사례로 제시함"}, {"d": 1, "t": "2020년 벵골만에서 발생한 X-Press Godavari호 화재는 7톤 이상의 리튬이온 배터리가 적재됐음에도 SP188 적용으로 신고되지 않아 선원들이 약 90분간 화재 원인을 파악하지 못하였다고 설명함"}, {"d": 1, "t": "또한 Wan Hai 503호와 Maersk Frankfurt호 화재 사례도 언급하며 리튬이온 배터리 화재의 위험성을 강조함"}, {"d": 0, "t": "해당 제안서는 SP936과 유사한 중량 기준을 적용해 일정 중량 이상의 SP188 적용 리튬이온 배터리 화물도 위험물 신고 대상에 포함하는 방안을 제안하였으며, 이는 2026년 9월 제12차 CCC 회의에서 논의될 예정임"}, {"d": 1, "t": "* Special Provision 936: IMDG Code 특별규정으로, 일정 중량을 초과하는 리튬 배터리 화물에 대해 운송인에게 추가 정보를 제공하도록 하는 중량 기반 정보 제공을 규정"}]}]}]}, {"id": "26-31", "seq": 31, "issue_date": "2026-08-18", "posted": "2026-08-26", "board_no": 683, "url": "https://www.imokorea.org/board/board.asp?B_ID=Inter_Maritime&ty=view&page=1&bandstart=1&findtype=&findstr=&idx=5743&ii=683", "pdf": "(26-31호) IMO소식 및 국제해사동향.F.pdf", "pages": 7, "file": "2026/2026-08/IMO소식_26-31호_20260818.html", "items": [{"section": "IMO 소식", "title": "IMO, 항만국통제 데이터 공유체계 확대", "source": "IMO Media Centre, '26.8.4.", "category": "PSC", "relevance": "중", "brief": "7.21 흑해·카리브해 MoU와 데이터 교환협정 체결(총 8개 MoU). GISIS PSC 모듈·통합 DB(ODB)로 거의 실시간 검사정보 공유 추진.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "IMO는 7월 21일 전 세계 항만국통제(PSC) 검사정보 교환을 강화하기 위해 흑해 및 카리브해 PSC 양해각서(MoU)와 개정 데이터 교환협정을 체결함"}, {"d": 1, "t": "런던 IMO 본부에서 아르세니오 도밍게스 IMO 사무총장과 Onur Turhan 흑해 MoU 사무장, Jodi Munn Barrow 카리브해 MoU 사무장이 협정에 서명했으며, 이 협정에 따라 PSC 검사정보 교환 확대와 IMO 글로벌통합해운정보시스템(GISIS) 내 PSC 모듈의 지속적인 개발을 지원할 예정임"}, {"d": 0, "t": "이번 협정으로 IMO와 개정 데이터 교환협정을 체결한 지역 PSC는 총 8개로 확대됐으며, 추가 협정 체결을 위한 논의도 진행 중임"}, {"d": 1, "t": "IMO는 앞서 Abuja, Indian Ocean, Tokyo, Mediterranean, Paris 및 Riyadh MoU와 유사한 협정을 체결했으며, 현재 Viña del Mar Agreement 및 미국 해안경비대(USCG)와도 협의를 지속하고 있음"}, {"d": 0, "t": "개정된 협정을 통해 전 세계 PSC 검사자료를 보다 포괄적이고 일관되게 공유하기 위한 PSC 통합 데이터베이스(ODB) 구축 기반을 강화할 예정임"}, {"d": 1, "t": "IMO가 주도하는 ODB 사업은 지역 PSC 체제 간 검사정보를 거의 실시간으로 공유하고 검증된 검사자료의 투명성·일관성·데이터 무결성을 높이는 한편, 회원국의 중복 보고를 줄이고 위험기반 검사계획 수립과 IMO 협약의 효과적인 이행을 지원하는 것을 목표로 함"}, {"d": 1, "t": "* PSC Overarching Database(ODB): 지역별 PSC 검사정보를 통합해 거의 실시간으로 공유하고 위험기반 검사계획 등을 지원하기 위해 IMO가 개발 중인 통합 데이터베이스"}, {"d": 0, "t": "IMO는 확대된 데이터 공유를 통해 지역별 PSC 활동의 조화를 높이고 회원국의 국제 해사기준 이행에 대한 모니터링을 강화할 계획임"}, {"d": 1, "t": "PSC 체제는 자국 항만에 입항하는 외국적 선박이 국제적으로 합의된 안전·보안·환경기준을 준수하는지 검사하는 데 있음. IMO는 이번 협정으로 PSC 활동의 투명성과 조화를 높여 보다 안전하고 보안이 강화된 친환경 해운에 기여할 것으로 기대함"}]}]}, {"section": "IMO 소식", "title": "IMO 공지", "source": "", "category": "IMO 공지", "relevance": "하", "brief": "회의·사무국 공지 및 회원국 통보문(CL) 회람.", "groups": [{"label": "", "bullets": []}, {"label": "회의 및 사무국 공지", "bullets": [{"d": 0, "t": "(사무국) 제114차 법률위원회(LEG 114) 개최 안내 (CL.5212, '26.7.29.)"}, {"d": 1, "t": "제114차 법률위원회(LEG 114)가 '27.2.8.~12. 영국 런던 IMO 본부에서 대면회의를 기본으로 하이브리드 방식을 병행하여 개최될 예정이며, 참가자는 OMRS 등록과 별도의 신임장 제출 절차를 거쳐야 함"}, {"d": 1, "t": "주요 의제는 HNS 의정서 발효 촉진, 선원의 공정한 대우, 흑해 아조프해 상황, 선박의 사기등록 방지, 해적·무장강도, MASS 관련 법적 검토, 대체연료 기술의 책임체계 및 해사보안 위협 등임"}, {"d": 0, "t": "(사무국) 해상 단일창구(MSW) 이행 활용 실태조사 안내 (CL.5243, '26.7.30.)"}, {"d": 1, "t": "IMO 사무국은 제50차 간소화위원회(FAL 50) 결정에 따라 '26년 말까지 회원국 등의 해상 단일창구(MSW) 이행 활용 수준을 파악하기 위한 설문조사를 실시하며, '28년 후속조사를 통해 이행 추이와 해사 이해관계자의 행정부담 변화를 평가할 예정임"}, {"d": 1, "t": "설문은 해사당국, 항만당국, 세관, 선사, 대리점, 포워더, 터미널 운영자 등 MSW의 구축·운영·사용 경험이 있는 공공·민간 이해관계자를 대상으로 '26.10.31.까지 진행되며, 결과는 국가·이해관계자별 공통 과제와 우수사례 등을 분석하여 FAL 51에 제출될 예정임"}, {"d": 1, "t": "* Maritime Single Window: 선박 입출항에 필요한 정보를 하나의 전자창구를 통해 제출·처리할 수 있도록 하는 시스템"}]}, {"label": "기타 공지", "bullets": [{"d": 0, "t": "(우크라이나) 이란의 통보문 관련 입장 통보 (CL.5253, '26.8.7.)"}, {"d": 1, "t": "우크라이나 정부가 CL.5251로 회람된 이란 정부의 통보에 대한 입장을 IMO에 제출하고, 자국의 모든 군사행동은 러시아의 침략에 대응한 유엔헌장 제51조상 자위권 행사 범위에서 러시아의 군사행동 지원을 차단하기 위한 것이라고 주장함"}, {"d": 1, "t": "우크라이나는 이란이 러시아의 우크라이나 공격에 사용되는 무기 지원을 중단해야 하며, '26.7.12. GFS GALAXY호 및 '26.7.14. Mombasa호가 이란군의 공격으로 피해를 입었다고 언급하고 이란 측 통보문의 공격 관련 주장과 법적 규정에 동의하지 않는다는 입장을 밝힘"}]}]}, {"section": "국제해사동향", "title": "IMarEST, 탄소가격 없는 IMO 대안도 해운비용 상승 전망", "source": "Lloyd's List, '26.8.10.", "category": "탈탄소", "relevance": "상", "brief": "IMarEST 분석: NZF 4개 대안 모두 2050년까지 비용집약도 70~80% 상승. 현행 NZF가 평균 감축비용 최저, 투발루안(RU $300) 감축효과 최대, 라이베리아안은 가격변동성 확대.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "영국 해양공학·해양기술학회(IMarEST)의 연구에 따르면, 의무적 탄소가격제를 제외한 IMO 온실가스 규제안으로도 2050년까지 해운비용이 70~80% 증가할 수 있는 것으로 나타남"}, {"d": 1, "t": "연구는 현재 IMO 해양환경보호위원회(MEPC)에서 검토 중인 4개 안을 IMO 종합영향평가 방법론에 따라 비교했으며, 일본이 최근 제출한 다섯 번째 방안은 연구 제출시점 이후 제안돼 분석에서 제외됨"}, {"d": 1, "t": "* Institute of Marine Engineering, Science and Technology: 해양공학·해양과학·해양기술 분야의 전문가를 대표하는 영국 기반 전문기관"}, {"d": 1, "t": "** ① 현행 Net-Zero Framework(NZF), ② 브라질의 '초기 완화·후기 강화' 방안, ③ 투발루의 'NZF as levy' 방안, ④ 탄소가격을 제외한 라이베리아 방안 등"}, {"d": 0, "t": "분석 결과 투발루안은 온실가스 감축효과가 가장 크지만 비용도 가장 높았으며, 현행 NZF는 4개 방안 가운데 평균 탄소감축 비용이 가장 낮은 것으로 나타남"}, {"d": 1, "t": "투발루안은 Tier 1 Remedial Unit(RU) 가격을 현행 NZF의 tCO₂e당 100달러에서 300달러로 높여 2030년대 연간 최대 1,000억 달러의 수입을 창출할 수 있는 반면, 현행 NZF는 연간 약 120억 달러로 추산됨"}, {"d": 1, "t": "다만 현행 NZF의 비용 우위는 2038년 이전 바이오연료 가격이 크게 상승하지 않는다는 조건을 전제로 함"}, {"d": 0, "t": "탄소가격과 Net-Zero Fund를 모두 제외한 라이베리아안도 바이오연료 가격과 Surplus Unit(SU) 시장 여건에 따라 장기적으로 유사한 수준의 비용 상승이 발생할 수 있다고 분석됨"}, {"d": 1, "t": "본 연구는 정책안과 관계없이 2050년까지 비용집약도가 약 70~80% 증가할 수 있으며, 라이베리아안은 RU의 고정가격이 없어 SU 가격의 상한이 형성되지 않는 만큼 바이오연료가 부족할 경우 선주들이 SU에 더욱 의존하면서 가격 변동성이 크게 확대될 수 있다고 설명함"}, {"d": 0, "t": "라이베리아안은 연료의 탄소함량이 아닌 가격·가용성·확장성을 기준으로 감축목표 경로를 설정해 향후 비용과 감축수준의 예측이 상대적으로 어려운 것으로 평가됨"}, {"d": 1, "t": "가장 저렴한 적격 연료가 화석 LNG일 경우 GFI 목표가 완화돼 2050년 운송비용 상승률이 5~30%에 그칠 수 있을 것으로 예상함"}, {"d": 1, "t": "또한 의무적 금전적 제재 대신 규정을 준수하지 못한 선박의 적합증서를 취소하도록 해 SU 공급 부족 시 선박의 비용 부담이 커질 수 있다고 분석함"}, {"d": 0, "t": "또한 높은 탄소가격과 초기 재분배를 결합하는 방안이 친환경 e-fuel 투자를 촉진할 수 있다고 제시함. 참고로 IMO는 오는 9월 회기간 작업반에서 각 규제 대안을 논의할 예정임"}, {"d": 1, "t": "본 연구에서는 미국과 사우디아라비아 등 산유국이 제기한 각 규제안의 세계무역 비용 관련 주장에 이의를 제기하면서 초기 재분배를 수반한 높은 탄소가격을 지지함"}]}]}, {"section": "국제해사동향", "title": "한국, 첫 북극항로 컨테이너 시범운항 추진", "source": "Lloyd's List, '26.8.10.", "category": "항로·물류", "relevance": "중", "brief": "Panstar Acro(2,758TEU, ex-HMM Mombasa) 8.22 부산 출항→약 18일 후 Felixstowe. 정부 실증사업, KR 극지선박 인증. 운임 FEU당 약 $9,000.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "대한민국은 홍해 사태 등 기존 해상물류 경로의 위험에 대응하기 위한 대안으로 정부 지원 아래 첫 북극항로 컨테이너선 시범운항을 추진함"}, {"d": 1, "t": "부산 소재 Panstar Group의 2,758TEU급 Panstar Acro호는 8월 22일 부산을 출항해 러시아 북극 연안을 거쳐 약 18일 후 영국 Felixstowe에 도착한 뒤 Rotterdam, Hamburg, Gdansk를 순차 기항할 예정이며, 자동차 부품·합성수지·K-뷰티 제품 등을 운송할 계획임"}, {"d": 1, "t": "일본 화물은 도쿄, 요코하마, 나고야, 오사카, 고베에서 피더선으로 집하해 부산에서 합적할 예정임"}, {"d": 0, "t": "이번 시범운항은 북극항로의 상업성과 운항 안전성을 검증하기 위한 정부 실증사업으로, Panstar가 지난 5월 입찰을 통해 사업자로 선정됨"}, {"d": 1, "t": "정부는 8~9월의 제한된 북극항로 운항 가능기간에 통항할 수 있는 3,000TEU급 선박과 극지선박 인증을 사업 요건으로 제시하였음"}, {"d": 1, "t": "Panstar는 사업 일정에 맞추기 위해 기존 HMM Mombasa호였던 Panstar Acro호를 인수해 북극 운항을 위한 개조와 한국선급의 극지선박 인증을 추진 중이며, 약 20명의 승무원 중 최소 1명은 극지항해 경험이 있는 사관으로 구성할 예정임"}, {"d": 0, "t": "북극항로는 아시아-유럽 간 운송기간을 단축할 수 있는 대안으로 주목받고 있으며, 중국 Sea Legend Shipping도 올해 북극항로 정기운항을 확대하고 있음"}, {"d": 1, "t": "북극항로 운송기간은 약 20일로 수에즈운하 경유 약 40일, 희망봉 우회 최대 50일보다 짧으며, 중국 Sea Legend는 지난해 시범운항 이후 올해 8~10월 7척을 투입해 8회의 고정 운항을 계획하고 있음"}, {"d": 1, "t": "다만 운임은 FEU당 약 9,000달러(한화 약 13백만원)로 벙커링 일반 해상운임의 약 2배 수준임"}, {"d": 0, "t": "Panstar는 북극항로 개발을 민간기업만의 사업이 아닌 국가 차원의 과제로 보고 부산을 북극항로 거점으로 육성할 수 있다는 입장을 제시함"}, {"d": 1, "t": "김현겸 Panstar Group 회장은 호르무즈 해협과 홍해·수에즈운하의 상황 악화가 해운뿐만 아니라 제조업 국가 물류망·에너지 안보에도 영향을 줄 수 있다며 수출 중심의 산업을 가진 한국의 경우 대체경로 확보가 시급하다고 시사함"}, {"d": 1, "t": "또한 부산·울산·경남의 조선·항만·해운 역량을 활용해 부산이 선박 정비, 친환경 연료 공급, 해운금융 및 해사법률 서비스를 제공하는 북극항로 허브가 될 수 있다고 설명함"}, {"d": 0, "t": "다만 북극항로는 러시아 연안을 따라 운항하며 러시아의 쇄빙선·도선·항만 지원이 필요해 우크라이나 전쟁과 국제제재에 따른 지정학적 문제가 남아 있음"}, {"d": 1, "t": "이와 함께 현재 북극항로 투입선박은 남방항로의 2만TEU 이상 대형 컨테이너선보다 훨씬 작아 계절적으로 제한된 틈새항로에 머물고 있다고 평가함"}]}]}]}, {"id": "26-32", "seq": 32, "issue_date": "2026-08-24", "posted": "2026-08-26", "board_no": 684, "url": "https://www.imokorea.org/board/board.asp?B_ID=Inter_Maritime&ty=view&page=1&bandstart=1&findtype=&findstr=&idx=5744&ii=684", "pdf": "(26-32호) IMO소식 및 국제해사동향.F.pdf", "pages": 5, "file": "2026/2026-08/IMO소식_26-32호_20260824.html", "items": [{"section": "IMO 소식", "title": "IMO, 카리브해 선원 대상 대체연료 교육역량 강화", "source": "IMO Media Centre, '26.8.14.", "category": "대체연료·안전", "relevance": "하", "brief": "8.3~7 트리니다드토바고 세미나. MSC 111 승인 메탄올(STCW.7/Circ.26)·암모니아(Circ.27) 선원교육 임시지침 반영.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "IMO는 대체연료 및 신기술 사용 선박의 안전운항에 필요한 선원 교육역량 강화를 위해 8월 3~7일 트리니다드토바고 포트오브스페인에서 카리브해 지역 세미나를 개최함"}, {"d": 1, "t": "MTCC Caribbean과 트리니다드토바고 대학교(UTT)가 주최한 이번 세미나에는 정책담당자, 해사교육·훈련기관 및 업계 관계자 등이 참여해 암모니아·메탄올 수소의 특성, 위험요소, 취급·벙커링 및 비상대응 등에 대한 교육과 실습을 진행함"}, {"d": 0, "t": "IMO는 메탄올·암모니아 연료 선박의 선원교육 임시지침을 실제 역량기반 교육과정에 반영할 수 있도록 해사 교육자와 훈련교관의 전문성 강화를 지원함"}, {"d": 1, "t": "참가자들은 시나리오 기반 훈련과 마이크로 티칭(micro-teaching)을 수행하고, Yara TRINGEN Complex를 방문해 개인보호장비(PPE) 사용과 암모니아 비상대응을 실습하는 한편 Proman으로부터 메탄올 생산·선박연료 활용 사례를 공유받음"}, {"d": 1, "t": "* 2026년 5월 MSC 111에서 승인된 메틸·에틸알코올 연료 선박(STCW.7/Circ.26) 및 암모니아 연료 선박(STCW.7/Circ.27)의 선원교육에 관한 임시지침"}, {"d": 0, "t": "IMO는 세계해사대학교(WMU)와 공동으로 추진 중인 대체연료·신기술 선박 선원교육 프로젝트를 통해 회원국의 해사 에너지 전환 대응역량 강화를 지속 지원할 계획임"}]}]}, {"section": "IMO 소식", "title": "IMO 공지", "source": "", "category": "IMO 공지", "relevance": "하", "brief": "회의·사무국 공지 및 회원국 통보문(CL) 회람.", "groups": [{"label": "", "bullets": []}, {"label": "회의 및 사무국 공지", "bullets": [{"d": 0, "t": "(사무국) 암모니아 해상연료 기술세미나 프로그램 안내 (CL.5189/Add.1, '26.8.12.)"}, {"d": 1, "t": "사무국이 '26.9.17. IMO 본부에서 Future Fuels and Technologies Project 주관으로 개최되는 암모니아 해상연료 기술세미나의 세부 프로그램을 확정 회람함"}, {"d": 1, "t": "세미나는 암모니아 생산·공급 및 벙커링 인프라, 암모니아 추진 선박 엔진 기술과 인증, 운항 환경 안전 등 3개 세션으로 구성되며, 한국선급(KR)은 암모니아 연료 선박에서 발생하는 암모니아 유출수 처리 관련 규제 및 기술적 고려사항을 발표할 예정임"}]}, {"label": "기타 공지", "bullets": [{"d": 0, "t": "(러시아) 우크라이나의 자국 컨테이너선 공격 관련 입장 통보 (CL.5258, '26.8.18.)"}, {"d": 1, "t": "러시아 정부는 '26.8.1. 밤 흑해 노보로시스크에서 약 130해리 떨어진 해상에서 인도발 노보로시스크행 러시아 국적 컨테이너선 YANINA호가 우크라이나군의 무인수상정(USV) 2척의 공격을 받아 치명적인 손상을 입고 침몰했다고 주장하는 문서를 IMO에 제출하고 회원국 대상 회람을 요청함"}, {"d": 1, "t": "러시아는 동 선박이 FESCO 소속으로 냉동식품·건설자재 등 민간 화물만을 운송하고 있었다고 주장함. 이와 함께 사고 이후 이집트 국적 선장이 지휘한 DELPHINUS호와 러시아 흑해함대 해군항공대의 구조로 선원 17명 전원이 구조되었다고 알림"}, {"d": 1, "t": "당국은 IMO와 회원국에 민간선박에 대한 무력공격이 국제항행 안전을 저해하는 행위라는 점을 고려해 적절한 법적 평가를 내려줄 것을 촉구함"}]}]}, {"section": "국제해사동향", "title": "FuelEU 풀링 활성화, 친환경 연료 투자유인 약화 우려", "source": "Lloyd's List, '26.8.14.", "category": "탈탄소", "relevance": "상", "brief": "FuelEU 첫해 90% 이상 풀링으로 준수, 잉여 크레딧 가격 하락(~200유로/tCO₂e 이하). 2030년 6%·2035년 14.5% 강화 시 크레딧 소진·바이오연료 부족 전망.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "FuelEU Maritime 시행 첫해에 선박의 90% 이상이 풀링(pooling)을 통해 규제 의무를 충족한 가운데, 규제준수 자문업계는 저탄소 LNG 선박의 잉여 크레딧 공급으로 가격이 낮게 형성되면서 친환경 연료 생산투자를 촉진하기 어려울 수 있다고 지적함"}, {"d": 1, "t": "Maersk Mc-Kinney Moller Center for Zero-Carbon Shipping에 따르면 잉여 크레딧 가격은 2025년 CO₂ 환산톤당 약 200유로 수준에서 최근 더 하락했으며, 첫해 선박의 2%는 차입(borrowing), 7%는 연료 전환 또는 벌금 납부 방식으로 규제를 준수함"}, {"d": 1, "t": "* 2025년 1월부터 시행된 EU 기항 선박이 사용하는 에너지의 온실가스 집약도 단계적 감축을 위한 EU 규제"}, {"d": 1, "t": "** FuelEU Maritime 목표를 초과 달성한 선박의 잉여 규제준수 실적을 다른 선박과 합산하여 하나의 풀 단위로 규제 의무를 충족할 수 있도록 하는 유연성 제도"}, {"d": 0, "t": "규제준수 자문업계는 풀링이 선박의 FuelEU 의무 이행에는 효과적으로 작동하고 있으나, 낮은 크레딧 가격이 향후 e-메탄올 등 친환경 연료 생산 확대에 필요한 투자 유인을 충분히 제공하지 못할 수 있다고 지적함"}, {"d": 1, "t": "톤당 1,300달러 수준의 e-메탄올 생산투자를 뒷받침하려면 FuelEU Maritime 규제준수 가격이 현재의 약 2배 수준이어야 하며, e-연료 생산시설 건설을 위해 통상 10~15년의 장기 구매계약(offtake agreement)을 필요로 해 현재 가격 수준에서는 신규 생산능력 확보가 어려울 수 있다는 의견이 제기됨"}, {"d": 1, "t": "* 생산시설 건설에 앞서 향후 생산될 연료를 일정 기간 구매하기로 체결하는 계약으로, 본 기사에서는 e-연료 생산시설에 통상 10~15년의 계약이 필요하다고 설명함"}, {"d": 0, "t": "FuelEU Maritime의 온실가스 집약도 감축목표가 2030년부터 강화될 경우 현재 시장에 공급되는 잉여 크레딧이 줄어들면서 바이오연료 및 e-연료 확보가 어려워질 수 있다는 전망도 제기됨"}, {"d": 1, "t": "FuelEU Maritime은 선박연료의 온실가스 집약도를 2029년까지 2%, 2030년부터 6%, 2035년부터 14.5%, 2050년까지 80% 감축하도록 하고 있어, 2031년경부터 바이오연료 수요가 급증하고 2035년에는 현재와 같은 풀링 시장이 사라질 수 있다고 전망함"}, {"d": 1, "t": "특히 항공·도로 부문과 해운이 동시에 바이오연료를 필요로 할 경우 공급이 선박 수요를 충족하기 어려울 수 있으며, 이후 e-연료 수요가 증가하더라도 앞선 투자 부족으로 충분한 생산능력이 확보되지 않을 가능성이 제기됨"}, {"d": 0, "t": "현재 풀링을 통한 규제준수가 원활하게 이뤄지고 있는 것과 별개로, 향후 강화되는 FuelEU Maritime 목표에 대비한 친환경 연료 조달 및 생산투자가 필요하다는 자문업계의 우려가 제시됨"}, {"d": 1, "t": "해운 배출규제 자문사인 Hecla Emissions Management는 현 단계에서 상당한 잉여 크레딧이 존재하는 만큼 향후 바이오연료 규제준수를 위해 보다 발전된 조달·위험관리 전략이 필요하다고 설명했으며, 공급 부족 시 지속가능하지 않은 바이오연료가 친환경 연료로 판매되는 부정행위 가능성도 제기됨"}, {"d": 1, "t": "다만 일부 e-연료 프로젝트는 이미 해운 분야의 장기 구매계약을 확보하고 있으며, e-연료 생산업체들은 FuelEU Maritime이 사업 추진의 주요 사항 중 하나라고 평가하고 있음"}]}]}, {"section": "국제해사동향", "title": "BV, 드론·AI 활용 선박검사 확대", "source": "Lloyd's List, '26.7.17.", "category": "디지털·검사", "relevance": "중", "brief": "BV 드론+LiDAR+AI 검사 확대. 밀폐공간 진입 60~70% 감소, AGS 3D로 검사기간 42%·비용 50% 절감. SMARTship 검증계약 300건 초과.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "프랑스 선급 Bureau Veritas(BV)는 기존 선박검사의 안전성과 효율성을 높이기 위해 드론과 인공지능(AI)을 활용한 새로운 검사방식을 확대하고 있음"}, {"d": 1, "t": "기존에는 검사원이 선박 평형수 탱크, 화물창 등 위험한 밀폐공간에 직접 진입해 검사했으나, BV는 고해상도 카메라와 LiDAR 센서를 장착한 드론으로 검사하고 AI 분석 후 검사원이 최종 검증하는 방식을 적용함"}, {"d": 0, "t": "BV는 드론 기반 검사를 통해 검사원의 위험구역 진입을 줄이는 동시에 검사 준비와 선박 운항 중단에 필요한 시간·비용도 절감할 수 있다고 설명함"}, {"d": 1, "t": "해당 방식은 밀폐공간에 사람이 직접 진입하는 횟수를 60~70% 줄이고, 로프 등을 이용한 접근 필요성도 낮출 수 있음"}, {"d": 1, "t": "또한 검사자료를 신속하고 표준화된 형태로 확보해 선박 정비계획을 조기에 수립하고, 검사에 따른 운항중단 기간을 줄일 수 있다고 설명함"}, {"d": 0, "t": "BV는 드론 검사자료를 3차원 선박모델과 결합해 부식·균열 등 선체 상태를 지속적으로 확인·관리하는 디지털 검사기술도 적용하고 있음"}, {"d": 1, "t": "'AGS 3D'는 AI가 드론 영상과 LiDAR 자료에서 구조적 이상을 찾아내고 이를 3차원 모델에 표시해 검사 시기별 선체 상태를 비교·추적할 수 있도록 함"}, {"d": 1, "t": "초기 적용 결과 기존 로프 비계 방식보다 검사 소요기간은 42%, 검사비용은 50%, 현장 자원인력은 90% 감소한 것으로 나타남"}, {"d": 1, "t": "* Augmented Surveyor 3D: 드론으로 수집한 검사자료를 AI로 분석하고 3차원 선박모델에 표시해 선체 상태를 비교·관리하는 BV의 디지털 검사기술"}, {"d": 0, "t": "BV는 선박검사뿐 아니라 실제 운항에 사용되는 디지털 시스템과 데이터의 신뢰성을 확인하는 검증서비스도 운영하고 있음"}, {"d": 1, "t": "'SMARTship'은 기관 유지보수, 선체 상태, 에너지효율 및 항해지원 등에 활용되는 디지털 시스템을 검증하는 서비스로, 관련 계약은 최근 2년간 3배 증가해 300건을 넘어섬"}]}]}]}, {"id": "26-33", "seq": 33, "issue_date": "2026-09-01", "posted": "2026-09-01", "board_no": 685, "url": "https://www.imokorea.org/board/board.asp?B_ID=Inter_Maritime&ty=view&page=1&bandstart=1&findtype=&findstr=&idx=5745&ii=685", "pdf": "(26-33호) IMO소식 및 국제해사동향.F.pdf", "pages": 4, "file": "2026/2026-09/IMO소식_26-33호_20260901.html", "items": [{"section": "IMO 소식", "title": "IMO, 아덴만 해적행위 재확산에 긴급 대응 촉구", "source": "IMO Media Centre, '26.8.24.", "category": "해사보안", "relevance": "중", "brief": "8.20 SEAMULL호 추가 피랍, 현재 6척·90명 이상 억류. 기국·연안국에 BMP 및 IMO 지침 이행 강조.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "국제해사기구(IMO)는 최근 아덴만에서 해적사건이 증가하는 가운데 8월 20일 SEAMULL호가 추가 피랍되면서, 현재 6척의 선박과 90명 이상의 선원이 해적 및 무장강도에 억류돼 있다고 밝힘"}, {"d": 1, "t": "아르세니오 도밍게스 IMO 사무총장은 억류 선원들이 식량·식수·의료지원 등 필수 서비스가 제한된 상황에서 지속적인 불확실성과 위협에 노출돼 있다며, 모든 선원의 즉각적이고 조건 없는 석방을 촉구함"}, {"d": 0, "t": "IMO 사무총장은 아덴만 및 인근 해역의 해적행위 재확산에 대한 국제사회의 긴급한 대응과 선박 및 선원의 보안 강화를 요청함"}, {"d": 1, "t": "특히 기국과 연안국에 선박이 보안위협에 충분히 대비하고 선원이 피랍 수 있는 위험에 노출되지 않도록 조치할 것을 요청했으며, 업계 모범관리지침 및 관련 IMO 지침의 이행을 강조함"}, {"d": 0, "t": "IMO는 연안국이 주도하는 역내 해적 대응을 지원하는 한편, 상선과 선원 보호를 위한 국제 해군 간 협력이 지속돼야 한다고 강조함"}, {"d": 1, "t": "IMO는 지부티 행동규약(Djibouti Code of Conduct)과 제다 개정서(Jeddah Amendment)를 통한 역내 대응을 계속 지원하고, UN 체계와 각국 정부 및 이해관계자들과 해사보안 강화 방안을 협의할 계획이라고 밝힘"}]}]}, {"section": "IMO 소식", "title": "IMO 공지", "source": "", "category": "IMO 공지", "relevance": "하", "brief": "회의·사무국 공지 및 회원국 통보문(CL) 회람.", "groups": [{"label": "", "bullets": []}, {"label": "기타 공지", "bullets": [{"d": 0, "t": "(키르기스스탄) 자국 국기 무단 사용 관련 통보 (CL.5259, '26.8.18.)"}, {"d": 1, "t": "키르기스스탄 정부는 국내외 개인 법인에 자국 국기를 사용하는 선박의 등록·운항 권한을 부여한 사실이 없으며, 관계 당국의 공식 승인 없는 선박 등록·운항 및 국기 게양은 무단 사용에 해당한다고 IMO에 통보함"}, {"d": 1, "t": "키르기스스탄은 자국 국기의 불법 사용 방지를 위해 동 사실을 회원국 등에 회람해 줄 것을 요청하고, Maritime Register LLC의 자국 내 법인 등록 및 대표자 권한을 확인하는 관련 자료를 함께 제출함"}, {"d": 0, "t": "(우크라이나) 러시아의 흑해 상선·항만 공격 관련 입장 통보 (CL.5260, '26.8.19.)"}, {"d": 1, "t": "우크라이나 정부는 '26.7월~8월 초 러시아가 우크라이나 항만을 입출항하는 선박 52척을 공격했으며, 이 중 라이베리아·마셜제도·파나마·싱가포르 등 외국 국적 상선 39척과 수색·구조선 2척이 포함됐다고 주장함"}, {"d": 1, "t": "우크라이나는 동 공격으로 선원 항만근로자 사상 및 선박 피해가 발생했으며, '22.2.24. 이후 항만시설 1,090개소와 상선 262척이 손상 또는 일부 파괴되고 민간인 329명이 사상했다고 주장함"}, {"d": 1, "t": "우크라이나는 러시아의 공격이 임시 해상회랑(Temporary Maritime Corridor) 운영과 흑해 항행안전 및 국제 식량공급을 위협한다고 주장하며, 회원국에 러시아의 국제해사법 위반에 대한 책임 추궁과 IMO 의사결정기구 선출 방지를 요청함"}]}]}, {"section": "국제해사동향", "title": "영국, 가스 공급 안정 위해 FSRU 도입 재검토", "source": "TradeWinds, '26.8.24.", "category": "에너지", "relevance": "하", "brief": "영국 정부, 2030~2050 가스 수급 안정 위해 FSRU·전략 저장시설 도입 검토(민간주도 vs 정부직접 모델 추가 검토).", "groups": [{"label": "", "bullets": [{"d": 0, "t": "영국 정부는 천연가스 저장능력과 공급 안정성을 강화하기 위한 방안으로 부유식 LNG 저장·재기화설비(FSRU) 도입과 전략적 가스저장시설 확충을 검토하고 있음"}, {"d": 1, "t": "영국 에너지안보·넷제로부는 중간 검토결과를 알리면서 영국 가스 공급망에 추가 공급능력을 확보하는 방안으로 FSRU와 전략적 가스저장시설을 검토했다고 밝힘"}, {"d": 1, "t": "정부는 두 방안 모두 향후 25년 동안 수십억 파운드 규모의 비용이 발생할 가능성이 있다며, 민간이 관련 자산을 시장에 도입하도록 정부가 지원할지 또는 정부가 직접 사업을 추진할 필요가 있는지를 검토 중이라고 설명함"}, {"d": 1, "t": "* FSRU(Floating Storage and Regasification Unit): LNG를 선박 형태의 설비에 저장한 후, 다시 기체 상태의 천연가스로 변환해 육상 가스망으로 공급하는 시설"}, {"d": 0, "t": "영국은 FSRU가 가스 공급경로를 다양화하고 비상상황에서 추가적인 공급 유연성을 제공해 가스 시스템의 회복력을 높일 수 있다고 평가함"}, {"d": 1, "t": "다만 정부 협의에 참여한 응답자들은 FSRU의 효과가 설치 위치와 영국 가스망(National Transmission System)과의 연결성, 실제 운영모델 등에 따라 크게 달라질 수 있다고 지적함"}, {"d": 1, "t": "이에 따라 정부는 FSRU 또는 전략적 가스저장시설을 어떤 방식으로 도입할지와 관련해, 정부 인센티브를 통한 민간 주도 방식과 정부 직접 추진 방식 가운데 적절한 사업모델을 추가 검토할 예정임"}, {"d": 0, "t": "영국은 과거에도 FSRU 도입을 추진한 바 있으며, 최근에도 민간기업을 중심으로 스코틀랜드 지역의 FSRU 터미널 개발계획이 제시된 바 있음"}, {"d": 1, "t": "2009년 당시 Höegh LNG는 영국 서부 Barrow-in-Furness 인근 Morecambe Bay에 FSRU를 설치하는 'Port Meridian' 프로젝트의 인허가를 추진했으나, 이후 사업권이 매각되면서 실제 사업으로 이어지지는 못함"}, {"d": 1, "t": "2024년에는 미국 상장기업 Crown LNG가 스코틀랜드 Grangemouth 인근 Firth of Forth에 FSRU 터미널을 설치하는 계획을 추진한다고 밝힌 바 있어, 영국 내 부유식 LNG 수입설비 도입 논의가 반복적으로 제기돼 왔음"}, {"d": 0, "t": "이번 검토는 북해 가스 생산 감소와 낮은 국내 저장능력 속에서 2030~2050년 영국의 중장기 천연가스 수급 안정성을 점검하기 위한 정부 협의절차의 일환으로 진행됨"}, {"d": 1, "t": "영국 정부는 2025년 11월 26일부터 2026년 2월 18일까지 가스 공급안보에 관한 의견수렴을 진행했으며, 인프라 운영자·업계 전문가·기관 및 일반 국민 등으로부터 총 115건의 의견을 접수해 향후 가스 수요·공급 시나리오를 검토함"}, {"d": 1, "t": "영국은 북해 가스 매장량 감소로 2004년부터 천연가스 순수입국으로 전환했으며, 다른 국가들과 비교해 가스 저장능력이 상대적으로 부족한 것으로 알려져 있음"}]}]}]}, {"id": "26-34", "seq": 34, "issue_date": "2026-09-07", "posted": "2026-09-07", "board_no": 686, "url": "https://www.imokorea.org/board/board.asp?B_ID=Inter_Maritime&ty=view&page=1&bandstart=1&findtype=&findstr=&idx=5747&ii=686", "pdf": "(26-34호) IMO소식 및 국제해사동향.F.pdf", "pages": 6, "file": "2026/2026-09/IMO소식_26-34호_20260907.html", "items": [{"section": "IMO 소식", "title": "IMO 사무총장, 호르무즈 해협 항행 자유 회복 위한 협력 촉구", "source": "IMO Media Centre, '26.8.28.", "category": "해사보안", "relevance": "중", "brief": "호르무즈 사태 6개월 경과, 공격 70건·선원 19명 사망, 최대 400척·6,000명 미출항. IMO 이사회 결의(7월) 상기하며 회원국·업계 협력 촉구.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "2월 28일 중동 분쟁 발생 이후 6개월이 지났음에도 호르무즈 해협 상황이 해결되지 않고 있으며, 항행의 자유를 회복하기 위한 회원국과 해운업계의 실질적인 해결책 마련과 협력을 촉구"}, {"d": 1, "t": "IMO가 현재까지 확인한 국제해운 대상 공격은 최소 70건이며 이로 인해 선원 19명이 사망했으며, 일부 선박은 페르시아만을 빠져나왔으나 최대 400척의 선박과 약 6,000명의 선원이 안전하게 출항하지 못한 채 높은 위험과 불확실성에 놓여 있다고 밝힘"}, {"d": 0, "t": "호르무즈 해협 사태로 연료, 비료 등 주요 물자의 공급망이 차질을 빚으면서 단기·장기적으로 전 세계 지역사회와 경제에 심각한 영향을 미치고 있다고 지적"}, {"d": 1, "t": "특히 이번 사태가 선박과 선원에 국한되지 않고 연료·비료 및 기타 상품의 핵심 공급망을 교란하고 있으며, 호르무즈 해협의 원활한 항행을 회복할 필요성을 강조"}, {"d": 0, "t": "지난 7월 IMO 이사회가 주요 해상교통로 보호 관련 결의서를 채택한 점을 상기하며, 호르무즈 해협의 방해받지 않는 항행을 회복하기 위한 정치적 의지와 협력이 필요하다고 강조"}, {"d": 1, "t": "해당 결의서는 국제항행에 이용되는 해협의 통항권이 위협·방해·거부·저해되거나 정지돼서는 안 된다는 점을 재확인하고, 호르무즈 해협에서 제한 없는 항행을 지속가능한 방식으로 회복할 것을 촉구"}, {"d": 0, "t": "회원국과 해운업계가 IMO 및 UN 체계와 협력해 호르무즈 해협의 항행 자유를 회복할 수 있는 실질적인 방안을 마련할 것을 요청"}, {"d": 1, "t": "아울러 흑해에서 홍해와 아덴만에 이르기까지 전 세계적으로 해사안보 상황이 악화되고 있으며, 이러한 상황이 수천 명의 선원에게 심각한 영향을 미치고 있다고 밝힘"}]}]}, {"section": "국제해사동향", "title": "ISWG-GHG 22, IMO 넷제로 프레임워크 주요 쟁점 논의", "source": "Lloyd's List, '26.8.28.", "category": "탈탄소", "relevance": "상", "brief": "9.1~4 ISWG-GHG 22에서 MEPC 85(11월) 앞두고 NZF 5개 대안(호주·투발루·브라질=탄소가격 유지 / 라이베리아·일본=탄소가격 제외) 입장 점검. 일본안 절충 가능성, 미국 반대·중국 입장이 변수.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "2026년 9월 1일~4일 개최되는 IMO 온실가스감축 회기간작업반(ISWG-GHG 22)에서는 11월 말 개최되는 제85차 해양환경보호위원회(MEPC 85)를 앞두고, 탄소가격제 유지 여부를 포함한 주요 온실가스 감축정책에 대한 입장과 합의 가능성을 점검할 예정"}, {"d": 1, "t": "이번 회의는 5개 넷제로 프레임워크(NZF) 정책안을 직접 협상하기보다 배출량 모니터링·보고, 온실가스 감축규제, 규제준수 방식 등 5개 주요 주제를 논의하며, 이를 통해 탄소가격제와 IMO 넷제로 기금 등 핵심 정책요소에 대한 회원국들의 입장이 드러날 것으로 예상"}, {"d": 0, "t": "현재 검토되는 5개 정책안은 탄소가격제 유지 여부를 중심으로 나뉘며, 호주·투발루·브라질 안은 기존 NZF의 기본 구조를 유지하는 반면 라이베리아·일본 안은 탄소가격제를 포함하지 않음"}, {"d": 1, "t": "라이베리아 안은 넷제로 목표와 탄소가격제 기금을 제외하고 대체연료의 가격과 가용성을 엄격히 고려하는 방안이며, 일본 안도 탄소가격제와 넷제로 기금을 제외하고 친환경 목표를 완화하는 내용을 담고 있음"}, {"d": 1, "t": "특히 일본 안이 분열된 회원국 간 절충안으로 부상할 수 있는지에 주목하며, EU 등 주요 그룹의 일본 안 지지 여부와 기존 NZF 지지국들이 넷제로 기금 등 핵심 요소를 어느 수준까지 고수할지가 주요 관전 포인트라고 설명"}, {"d": 0, "t": "기존 NZF에 대해서는 호주·캐나다·남아프리카공화국·영국과 EU 27개국이 지지 입장을 보이는 가운데, 미국의 반대와 중국의 입장이 향후 논의의 향방을 미칠 주요 변수로 거론됨"}, {"d": 1, "t": "미국은 NZF 찬성국을 대상으로 한 제재 및 비자 제한 위협을 유지하고 있어 일부 국가의 지지를 어렵게 하는 요인으로 지목됐으나, 직전 회의에서는 다수 회원국이 IMO의 「2023 온실가스 감축전략」을 지지한 것으로 나타남"}, {"d": 1, "t": "기존에 유보적이었던 그리스와 키프로스도 EU 공동 협상입장에 참여했으며, 중국은 NZF 형태의 규제에 제한적인 지지를 시사하는 세부 기술수정안을 제출해 향후 입장이 주목되고 있음"}, {"d": 0, "t": "ISWG-GHG 22에서 큰 정치적 합의가 도출되기보다는 각 정책요소에 대한 회원국의 입장을 확인하면서 MEPC 85의 NZF 논의를 위한 공통분모를 모색할 것으로 전망"}, {"d": 1, "t": "관계자들은 MEPC 85까지 추가 논의의회가 남아 있어 이번 기술회의에서 직접적인 정치적 충돌은 크지 않을 것으로 예상했으나, 개별 대안을 직접 다루지 않더라도 탄소가격제와 넷제로 기금 등 핵심 요소에 대한 지지 수준에 따라 향후 협상의 방향이 보다 구체화될 수 있다고 설명"}, {"d": 1, "t": "세계해운협의회(WSC)는 연료 인증 등 글로벌 규제체계의 기술적 요소에서 올해 진전이 있었며, 이번 회의에서도 회원국들이 공통분모의 실행 가능한 방안을 중심으로 논의를 이어갈 필요가 있다고 밝힘"}]}]}, {"section": "국제해사동향", "title": "브라질, 싱가포르의 10번째 녹색·디지털 해운항로 파트너로 참여", "source": "TradeWinds, '26.8.29.", "category": "탈탄소", "relevance": "하", "brief": "8.28 싱가포르-브라질 GDSC MOU. 브라질 재생에너지 기반 대체연료 공급망 개발, 바이오메탄·Mass Balance 인정 협력.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "싱가포르와 브라질은 8월 28일 녹색·디지털 해운항로(Green and Digital Shipping Corridor) 구축을 위한 양해각서(MOU)를 체결하고, 대체 선박연료 공급망 등 해운 탈탄소·디지털화를 위한 협력을 추진하기로 함"}, {"d": 1, "t": "제프리 시우(Jeffrey Siow) 싱가포르 교통부 장관과 토미 프랑카(Tome Franca) 브라질 항만·공항부 장관이 협약에 서명했으며, 이번 협력으로 브라질은 싱가포르의 10번째 녹색 디지털 해운항로 파트너가 됨"}, {"d": 1, "t": "싱가포르는 2026년 초까지 로테르담, 로스앤젤레스·롱비치, 일본, 호주, 중국, 인도, 한국 등과 9개의 녹색 디지털 해운항로를 구축한 바 있음"}, {"d": 1, "t": "* Green and Digital Shipping Corridor: 국가 항만 간 협력을 통해 대체연료 사용과 관련 공급망, 디지털 기술 등을 공동으로 시험 개발하는 협력체계로, 해운 탈탄소 디지털화와 국제운송 효율성 향상을 목적으로 함"}, {"d": 0, "t": "양국은 브라질의 재생에너지 자원 생산능력과 세계 최대 벙커링항이자 주요 해사혁신 거점인 싱가포르의 강점을 결합해 대체 선박연료 공급망을 개발할 계획"}, {"d": 1, "t": "싱가포르 해사항만청(MPA)은 브라질의 재생에너지 자원을 활용해 온실가스 배출이 제로 또는 제로에 가까운 선박연료를 생산할 수 있으며, 이번 협력을 통해 이러한 연료의 생산·공급에 필요한 공급망 구축을 지원할 계획이라고 밝힘"}, {"d": 1, "t": "싱가포르는 국제규제의 불확실성이 해소되기를 기다리기보다 국제 파트너와 대체연료 인프라 구축을 지속한다는 입장으로, 바이오메탄 활용과 싱가포르에서 벙커링 질량수지(Mass Balance) 방식으로 관리되는 연료의 국제사회 인정에도 이러한 협력체계를 활용하는 방안을 검토하고 있음"}, {"d": 1, "t": "* Mass Balance: 물리적으로 혼합된 연료의 공급·사용 과정에서 지속가능한 연료의 투입량과 그에 따른 환경적 속성을 장부상 추적 관리하는 방식"}, {"d": 0, "t": "싱가포르와 브라질은 대체연료뿐만 아니라 항만·해운 운영의 효율성을 높이기 위한 디지털 정보교환과 새로운 해사기술의 연구·개발 및 도입도 공동 추진할 예정"}, {"d": 1, "t": "양국은 항만과 해운 운영 개선을 위한 디지털 정보교환 방안을 모색하고, 업계와 함께 새로운 해사기술 솔루션의 연구·개발 및 실제 적용을 추진하기로 함"}, {"d": 0, "t": "이번 협력은 싱가포르와 브라질 간 기존 해사분야 협력관계를 기반으로 체결됐으며, 양국의 조선·해양산업 분야에서도 장기간의 사업관계가 이어지고 있음"}, {"d": 1, "t": "협약 전날 싱가포르 Tuas 조선소에서 브라질 Petrobras의 FPSO 2척 명명식이 개최됐다고 소개했으며, 싱가포르 해양플랜트 기업 Seatrium은 1999년부터 브라질에서 사업을 수행해 약 20억 싱가포르 달러(15억7천만 달러)를 투자하고 현지 인력 약 1만 2,000~1만 3,000명을 고용하고 있다고 밝힘"}, {"d": 1, "t": "* FPSO(Floating Production Storage and Offloading): 해상에서 원유·가스를 생산 처리한 뒤 저장하고 운반선에 하역하는 부유식 생산·저장·하역설비"}]}]}]}, {"id": "26-35", "seq": 35, "issue_date": "2026-09-14", "posted": "2026-09-14", "board_no": 687, "idx": 5749, "url": "https://www.imokorea.org/board/board.asp?B_ID=Inter_Maritime&ty=view&page=1&bandstart=1&findtype=&findstr=&idx=5749&ii=687", "pdf": "(26-35호) IMO소식 및 국제해사동향.r1.pdf", "pages": 6, "file": "2026/2026-09/IMO소식_26-35호_20260914.html", "items": [{"section": "IMO 소식", "title": "IMO, IAEA 해상 원자력 기술 ATLAS 이니셔티브 참여", "source": "IMO Media Centre, '26.9.3.", "category": "IMO 제도", "relevance": "중", "brief": "IMO, IAEA가 8.26~27 워싱턴 D.C. 고위급 포럼에서 출범한 해상 원자력 기술 국제협력 이니셔티브 ATLAS에 참여.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "IMO는 해상 원자력 기술의 안전·보안 및 안전조치 강화를 위한 국제협력 확대를 위해 국제원자력기구(IAEA)가 출범한 ATLAS 이니셔티브에 참여하기로 함"}, {"d": 1, "t": "IAEA는 '26.8.26.~27. 미국 워싱턴 D.C.에서 고위급 포럼을 개최해 안전·보안 및 안전조치가 확보된 해상 원자력 기술의 활용을 위한 국제협력 이니셔티브인 ATLAS를 출범함"}, {"d": 1, "t": "* International Atomic Energy Agency: 원자력의 평화적 이용을 촉진하고 원자력 안전 및 안전조치 분야를 수행하는 국제기구"}, {"d": 1, "t": "* Atomic Technologies Licensed for Applications at Sea: 첨단 해상 원자력 기술에 대한 국제적 관심 증가와 함께 안전·보안 및 안전조치 분야 원자력 기술의 해상 활용을 위한 국제협력 이니셔티브"}, {"d": 0, "t": "IMO는 원자력 추진선박 등 해상 원자력 기술 도입에 필요한 법률·규제·안전·보안조치 및 책임체계를 논의했으며, 원자력 안전·보안·안전조치 분야에서 IAEA와의 상호보완적 역할을 강조함"}, {"d": 0, "t": "ATLAS는 정부·규제기관·국제기구·산업계 등 이해관계자가 해상 원자력 기술의 제도적 기반을 논의할 수 있는 체계적인 협의 플랫폼을 제공할 것으로 기대됨"}, {"d": 0, "t": "IMO는 ATLAS 참여를 통해 IAEA 및 회원국과의 협업을 지속하고, 해상 원자력 기술이 국제기준에 따라 높은 수준의 안전·보안 및 환경보호를 유지할 수 있도록 지원할 방침임"}]}]}, {"section": "IMO 소식", "title": "IMO 공지", "source": "", "category": "IMO 공지", "relevance": "하", "brief": "회원국 공지 회람(가봉 국제선박등록부 연락처 정정).", "groups": [{"label": "", "bullets": []}, {"label": "회원국 공지", "bullets": [{"d": 0, "t": "(가봉) 국제선박등록부 연락처 정정 통보 (CL.5242/Add.1, '26.9.1.)"}, {"d": 1, "t": "가봉 정부는 국제선박등록부 관리가 해운총국(Direction Générale de la Marine Marchande)과 리브르빌 선박등록사무소(Bureau d'Immatriculation des Navires)에서 수행되고 있음을 재확인하고, 기존 통보문에 기재된 해운총국 이메일 주소에 오류가 있었다고 IMO에 통보함"}, {"d": 1, "t": "가봉은 해운총국 선박등록사무소의 수정된 이메일 및 전화번호를 IMO에 제출하고, 해당 연락처 정보를 정정해 줄 것을 요청함"}]}]}, {"section": "국제해사동향", "title": "이중연료선 확대에도 친환경 연료 가격 격차 여전", "source": "Seatrade Maritime News, '26.9.8.", "category": "대체연료·안전", "relevance": "상", "brief": "이중연료선 발주 확대에도 친환경 연료 고가·불확실한 수요로 실사용 확대 한계. 대체연료 장기·단기 계약 격차, 화주 수요 결집 필요성 지적.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "최근 글로벌 해양환경위원회(GMEC)에서 해운업계 전문가들은 이중연료선 발주가 확대되고 있으나, 높은 친환경 연료 가격과 불확실한 장기 수요로 실제 사용 확대에는 한계가 있다고 지적함"}, {"d": 1, "t": "영국 선급협회(LR)는 최근 이중연료선 발주가 크게 늘면서 연료를 사용할 선박은 확보되고 있으나, 해당 선박들이 인도 직후부터 지속가능한 연료를 사용할 것이라는 보장은 없다고 설명함"}, {"d": 1, "t": "기존에는 대체연료를 사용할 선박이 모두 부족했다면, 현재는 상대적으로 대체연료의 생산·사용에 따른 비용과 위험을 누가 부담할지가 주요 과제로 전환됐다고 평가함"}, {"d": 1, "t": "* Global Maritime Environmental Congress: 독일 함부르크에서 격년으로 개최되는 국제해운업계 기간 중 열리는 해양환경 전문 콘퍼런스로서 해당 업계의 친환경 연료 전환 관련 논의 등을 진행함"}, {"d": 1, "t": "** 영국에 본사를 둔 국제 선급기관으로, 선박·해양설비의 기술기준 제정, 검사·인증 등을 수행함"}, {"d": 0, "t": "대체연료 공급 확대를 위해서는 연료 생산자가 요구하는 장기 구매계약과 선사가 통상 체결하는 단기 공급계약 간 격차를 해소할 필요가 있는 것으로 지적됨"}, {"d": 1, "t": "Hapag-Lloyd는 화주가 장기적이고 예측 가능한 수요 신호를 제공하지 않으면 선사가 위험을 전적으로 부담하면서 대체연료 공급계약을 체결하기 어렵다고 설명함. 이와 함께 내년부터 15년간 메탄올을 공급받는 계약을 체결했으나, 이는 회사 전체 연료 사용량에서 차지하는 비중이 상대적으로 작은데도 상당한 재무적 위험을 수반한다고 밝힘"}, {"d": 0, "t": "화주의 친환경 해운 수요를 결집하는 방식이 대체연료 시장 형성에 기여하고 있으나, 비용 부담과 경영으로 인해 자발적 수요 확대에는 한계가 있는 것으로 나타남"}, {"d": 1, "t": "ZEMBA는 온실가스 저감을 해운서비스를 원하는 화주의 수요를 모아 선사의 대체연료 사용을 지원하고 있으나, 화주들은 공급당 배출 감축 시 해운보다 항공·육상 운송을 우선하는 경우가 많다고 설명함"}]}]}, {"section": "국제해사동향", "title": "영국·미국, 원자력 추진 컨테이너선 운항을 위한 'Pink Corridor' 추진", "source": "TradeWinds, '26.9.3.", "category": "대체연료·안전", "relevance": "중", "brief": "LR·Maersk·Felixstowe항·Charleston항, 영-미 'Pink Corridor' 프로젝트로 원자력 추진 컨테이너선 상업운항 규제·보안·운영체계 검토(개념 검토 단계).", "groups": [{"label": "", "bullets": [{"d": 0, "t": "영국 선급협회(LR), Maersk, 영국 Felixstowe항 및 미국 Charleston항은 향후 원자력 추진 컨테이너선의 상업운항에 필요한 규제·보안·운영체계를 검토하기 위해 영국-미국 간 'Pink Corridor' 프로젝트를 출범함"}, {"d": 1, "t": "동 프로젝트를 통해 Felixstowe-Charleston 간 가상 항로를 대상으로 항만 접근, 보안, 보험, 비상대응 등 원자력 추진선의 상용운항 요건을 검토할 예정으로, 현재 선박 건조·배치 계획은 없는 개념 검토임"}, {"d": 0, "t": "Pink Corridor는 미·영 정부의 'Technology Prosperity Deal'의 일환으로 추진되며, 양국 간 민간 해상 원자력 기술의 적용과 원자력 추진 해운항로 구축 가능성을 검토하는 데 목적을 두고 있음"}, {"d": 1, "t": "* 미국과 영국 정부가 민간 해상 원자력 기술 적용 및 양국 간 원자력 추진 해운항로 개발 가능성 등을 검토하는 기술협력체계임"}, {"d": 0, "t": "원자력 추진은 최근 녹색수소 기반 탈탄소화에 대한 기대가 약화되면서 관심이 확대됐으며, 첨단 원자로는 연료 재공급이나 감속운항 필요성이 적으면서 거의 무배출에 가까운 추진력을 제공할 수 있는 것으로 주장이 제기되고 있음"}, {"d": 1, "t": "다만 소형모듈원자로(SMR) 기술은 아직 초기 단계로 여러 원자로 설계 가운데 표준화된 방식이 확립되지 않았으며, 첨단 SMR도 아직 상업운전 단계에 진입하지 못함"}, {"d": 0, "t": "원자력 추진선의 상용화를 위해서는 원자로 기술뿐만 아니라 규제, 책임체계, 사회적 수용성 및 항만 준비태세 등 실제 운항을 위한 제도적·운영적 정책을 해결해야 한다고 지적됨"}, {"d": 1, "t": "LR의 원자력기술 담당 Jez Sims 이사는 현재 논의가 원자력 추진 상선의 기술적 건조 가능성에서 글로벌 해운체계 내 실제 취항·운영 가능성으로 이동하고 있다고 설명함"}, {"d": 1, "t": "특히 원자력 추진선박 안전에 필요한 체계 구축이 필요하며, IMO의 원자력 선박 규정 검토와 IAEA의 최근 ATLAS 프로젝트 출범도 관련 논의가 진전되고 있음을 보여준다고 언급함"}, {"d": 0, "t": "Felixstowe항과 Charleston항은 원자력 추진선 수용에 필요한 보안절차, 비상대응 및 규제준수 요건을 검토하는 역할을 수행함"}, {"d": 1, "t": "LR은 두 항만을 연결하는 실제 항로를 가정함으로써 관련 문제를 현실적인 운항환경에서 검증할 수 있다고 설명했으며, 향후 원자력 추진 상선이 운항하려면 이를 수용할 의사와 역량을 갖춘 항만이 필요하다고 지적함"}, {"d": 1, "t": "특히 Felixstowe항은 영국 최대·최다 이용 컨테이너항으로서 프로젝트 초기 단계에 실무적 정보를 제공할 예정임"}, {"d": 0, "t": "동 프로젝트의 초기 단계에서는 원자력 추진 해운을 위한 인프라·거버넌스 운영환경을 검토하고, 그 결과를 토대로 향후 공학적 요건과 법·규제체계 등에 대한 추가 검토 가능성을 모색할 예정임"}, {"d": 1, "t": "LR은 2024년 영국 원자력 스타트업 Core Power와 컨테이너선 첨단 원자력 추진에 필요한 규제체계를 평가했으며, 이후 Maersk가 참여해 안전·규제 운영상 영향을 검토해 왔음"}, {"d": 1, "t": "Pink Corridor는 이러한 선박 단위 검토를 인프라와 운항환경으로 확대하는 단계로, 초기 결과는 향후 공학적 요건, 법률 개정, 규제 정합성 및 안전조치 체계 등을 다루는 2단계 작업의 참고사항으로 활용될 수 있음"}]}]}]}];

DATA.sort((a,b)=> b.seq-a.seq);
document.getElementById('lastchk').textContent = '2026-09-16';
document.getElementById('latest').textContent = '제' + DATA[0].id + '호 (' + DATA[0].issue_date + ')';
const cats = [...new Set(DATA.flatMap(i=>i.items.map(x=>x.category)))];
const catSel = document.getElementById('cat'); cats.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;catSel.appendChild(o);});
const mons = [...new Set(DATA.map(i=>i.issue_date.slice(0,7)))];
const monSel = document.getElementById('mon'); mons.forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent=m;monSel.appendChild(o);});
function bullets(gs){ let h=''; for(const g of gs){ if(g.label) h+=`<div class='grp'>[${esc(g.label)}]</div>`; h+='<ul>'; for(const b of g.bullets){ const cls=b.t.startsWith('*')?'note':'d'+b.d; h+=`<li class='${cls}'>${esc(b.t)}</li>`; } h+='</ul>'; } return h; }
function itemHtml(it, n){ const cc=CAT[it.category]||'#64748b'; const rc=REL[it.relevance];
 return `<div class='card item' id='${it.uid}' data-cat='${esc(it.category)}' data-rel='${it.relevance}' data-text='${esc((it.title+' '+it.brief+' '+it.groups.map(g=>g.bullets.map(b=>b.t).join(' ')).join(' ')).toLowerCase())}'>
 <div class='card-header itemhead' onclick='this.nextElementSibling.classList.toggle("hidden");this.querySelector(".arrow").textContent=this.nextElementSibling.classList.contains("hidden")?"▼ 본문":"▲ 접기"'><span class='num'>${n}</span>${esc(it.title)}<span class='arrow'>▼ 본문</span></div>
 <div class='card-body hidden'><div class='src'><span class='tag' style='background:${cc}'>${esc(it.category)}</span><span class='tag' style='background:${rc}'>관련도 ${it.relevance}</span>${it.source?' 출처: '+esc(it.source):''} &nbsp;|&nbsp; ${esc(it.section)}</div>
 ${it.brief?`<div class='brief'><strong>요약</strong> — ${esc(it.brief)}</div>`:''}${bullets(it.groups)}</div></div>`; }
const list=document.getElementById('list'); const ov=document.getElementById('ovbody');
for(const iss of DATA){
 iss.items.forEach((it,i)=>it.uid='it-'+iss.id.replace(/[^0-9a-zA-Z]/g,'')+'-'+(i+1));
 const d=document.createElement('details'); d.className='issue'; d.dataset.mon=iss.issue_date.slice(0,7); d.open = iss===DATA[0];
 d.innerHTML=`<summary><span class='num'>${iss.id}호</span>${iss.issue_date} <span class='meta'>· 게시 ${iss.posted} · ${iss.items.length}개 항목 · <a href='${iss.url}' target='_blank' onclick='event.stopPropagation()'>원문</a> · <a href='${iss.file}' target='_blank' onclick='event.stopPropagation()'>호별 문서</a></span><span class='arrow'>펼치기/접기</span></summary><div class='inner'>${iss.items.map((it,i)=>itemHtml(it,i+1)).join('')}</div>`;
 list.appendChild(d);
 iss.items.forEach(it=>{ const tr=document.createElement('tr'); tr.dataset.cat=it.category; tr.dataset.rel=it.relevance; tr.dataset.mon=iss.issue_date.slice(0,7); tr.dataset.text=(it.title+' '+it.brief).toLowerCase(); tr.dataset.target=it.uid; tr.onclick=()=>gotoItem(it.uid);
  tr.innerHTML=`<td>${iss.id}</td><td>${iss.issue_date}</td><td>${esc(it.title)}</td><td><span class='tag' style='background:${CAT[it.category]||'#64748b'}'>${esc(it.category)}</span></td><td style='color:${REL[it.relevance]};font-weight:700'>${it.relevance}</td>`; ov.appendChild(tr); });
}
function apply(){ const q=document.getElementById('q').value.trim().toLowerCase(); const c=catSel.value; const r=document.getElementById('rel').value; const m=monSel.value; let n=0;
 document.querySelectorAll('.item').forEach(el=>{ const ok=(!q||el.dataset.text.includes(q))&&(!c||el.dataset.cat===c)&&(!r||el.dataset.rel===r); el.classList.toggle('hidden',!ok); if(ok)n++; });
 document.querySelectorAll('.issue').forEach(el=>{ const vis=[...el.querySelectorAll('.item')].some(x=>!x.classList.contains('hidden')); const mok=!m||el.dataset.mon===m; el.classList.toggle('hidden',!(vis&&mok)); if(q||c||r) el.open=true; });
 document.querySelectorAll('#ovbody tr').forEach(tr=>{ const ok=(!q||tr.dataset.text.includes(q))&&(!c||tr.dataset.cat===c)&&(!r||tr.dataset.rel===r)&&(!m||tr.dataset.mon===m); tr.classList.toggle('hidden',!ok); });
 document.getElementById('cnt').textContent = n+'개 항목'; }
['q','cat','rel','mon'].forEach(id=>document.getElementById(id).addEventListener('input',apply)); apply();
function toggleOv(force){ const w=document.getElementById('ovbody-wrap'); const open = force===undefined ? w.classList.contains('hidden') : force; w.classList.toggle('hidden',!open); document.getElementById('ovarrow').textContent=open?'▲ 접기':'▼ 펼치기'; }
function gotoItem(uid){ const el=document.getElementById(uid); if(!el) return; el.classList.remove('hidden'); const det=el.closest('details'); det.classList.remove('hidden'); det.open=true;
 const body=el.querySelector('.card-body'); body.classList.remove('hidden'); el.querySelector('.itemhead .arrow').textContent='▲ 접기';
 el.scrollIntoView({behavior:'smooth',block:'start'}); el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'),1500); }
let allOpen=false; document.getElementById('expand').addEventListener('click',()=>{ allOpen=!allOpen; document.querySelectorAll('.issue').forEach(d=>d.open=allOpen); document.querySelectorAll('.item .card-body').forEach(b=>b.classList.toggle('hidden',!allOpen)); document.querySelectorAll('.itemhead .arrow').forEach(a=>a.textContent=allOpen?'▲ 접기':'▼ 본문'); document.getElementById('expand').textContent=allOpen?'모두 접기':'모두 펼치기'; });
</script></body></html>
