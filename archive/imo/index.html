t": "서방은 G7 가격 상한을 초과하는 러시아산 원유에 보험 제공을 금지했으며, 국제 P&I 클럽 그룹(IG)*의 보험에 가입한 러시아산 원유 운송 비중은 2024년 기준 3분의 1 미만으로 감소해 러시아의 최대 원유 수입국인 중국도 대체 선박과 보험 확보에 나서야 했음"}, {"d": 2, "t": "또한 올해 3월 중동사태로 걸프 지역의 해상운송이 차질을 빚자 서방 보험사들이 보험 인수규모를 축소하고 재보험사들이 신중한 입장을 취하면서 전쟁위험 보험료가 급등한 것으로 나타남"}, {"d": 2, "t": "* P&I(Protection and Indemnity Insurance): 선박 운항 과정에서 발생하는 인명피해, 오염사고 및 제3자 배상책임 등을 보장하는 선주책임상호보험"}, {"d": 1, "t": "중국은 서방 보험시장에 대한 대안으로 홍콩의 전쟁위험 보험체계를 확대하고 상하이를 재보험 중심지로 육성하고 있으나, 해외 재보험** 의존도가 여전히 높은 상황임"}, {"d": 2, "t": "2025년 홍콩 보험사 5사가 참여해 설립한 '홍콩 해상전쟁위험 보험풀'***은 중국 관련 선박이 중동 걸프 지대에서 공격받을 가능성이 상대적으로 낮다는 판단을 바탕으로 기존보다 저렴한 보험을 제공하고 있음"}, {"d": 2, "t": "다만 홍콩의 해상보험 전문가들은 재보험을 계속 런던에 의존할 경우 독립적인 보험체계 구축에 한계가 있다며, 정부 지원과 민관 공동운영을 기반으로 대규모 손실에 대비할 수 있는 전쟁위험 상호보험체계 마련을 제안함"}, {"d": 2, "t": "** 재보험(Reinsurance): 보험사가 인수한 위험의 일부를 다른 보험사에 이전해 대규모 손실에 대비하는 보험제도"}, {"d": 2, "t": "*** 전쟁위험보험풀(War Risks Insurance Pool): 전쟁·무력충돌 등으로 발생하는 선박 피해 위험을 여러 보험사가 공동으로 인수·분담하는 체계"}, {"d": 1, "t": "중국 국가금융감독관리총국에 따르면 2024년 중국의 재보험 침투율****은 4.6%로 세계 평균 12.5%에 크게 못 미쳐, 국제적 위험을 자체적으로 인수할 수 있는 역량이 제한적인 것으로 나타남"}, {"d": 2, "t": "**** 재보험 침투율(Reinsurance Penetration): 전체 보험시장 대비 재보험 활용 수준을 나타내는 지표로, 중국과 세계 평균 재보험시장 활용 정도를 비교하는 데 사용됨"}, {"d": 1, "t": "중국 연구진은 독자적인 해상보험체계를 구축하는 데 상당한 시간이 필요한 만큼, 기존 국제보험시장에 대한 참여를 확대해 서방의 영향력을 점진적으로 낮추는 방안을 제시함"}, {"d": 2, "t": "상하이 발전개혁연구원 연구진은 중국이 러시아와 유사한 별도의 보험체계를 구축하거나, 기존 서방 중심 시장에서 영향력을 확대하는 두 가지 방안 중 하나를 선택해야 한다고 설명함"}, {"d": 2, "t": "연구진은 독립적인 보험시장 구축보다 기존 국제보험체계에 깊이 참여해 국가 간 상호의존도를 높이는 방식이 향후 금융시장 분리에 따른 비용을 증가시킬 수 있다고 분석했음"}, {"d": 2, "t": "이와 함께 궁극적으로 보험 인수능력뿐만 아니라 글로벌 무역을 뒷받침하는 주요 금융체계에 대한 영향력 확보가 중요하다고 강조함"}]}]}]}, {"id": "26-40", "seq": 40, "issue_date": "2026-10-30", "posted": "2026-11-04", "board_no": 692, "url": "https://www.imokorea.org/board/board.asp?B_ID=Inter_Maritime&ty=view&page=1&bandstart=1&findtype=&findstr=&idx=6758&ii=692", "pdf": "(26-40호) IMO소식 및 국제해사동향.F.pdf", "pages": 5, "file": "2026/2026-10/IMO소식_26-40호_20261030.html", "items": [{"section": "IMO 소식", "title": "REMPEC, 창립 50주년 맞아 지중해 해양환경 보호 협력 강조", "source": "IMO Media Centre, '26.10.6.", "category": "기타", "relevance": "하", "brief": "지중해 해양오염비상대응센터(REMPEC) 창립 50주년, 몰타 해사장관회의와 연계해 '26.10.6. 기념행사 개최. 지난 50년간 20개국 해양오염 비상대응체계 구축 지원, 5,000명 이상 교육.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "지중해 해양오염 긴급대응센터(REMPEC)는 창립 50주년을 맞아 역내 해양환경 보호를 위한 협력 성과를 공유하고 향후 환경문제 대응 필요성을 강조함"}, {"d": 1, "t": "REMPEC는 '26.10.6. 몰타 해사장관회의(Malta Maritime Summit)와 연계해 '우리의 지중해, 우리의 책임(Our Mediterranean – Our Responsibility)'을 주제로 기념행사를 개최함. 행사에는 지중해 연안국들이 참석해 지난 50년간의 협력 성과와 역내 환경문제를 논의함"}, {"d": 1, "t": "* Regional Marine Pollution Emergency Response Centre for the Mediterranean Sea: 19개국 지중해 연안국의 해양오염 대응 역량 강화를 위해 설립된 UN 산하 기구로, 오염 대응 협력과 교육훈련 등을 지원함"}, {"d": 0, "t": "REMPEC는 지난 50년간 지중해 20개국의 해양오염 비상대응체계 구축을 지원하고 5,000명 이상의 대응인력을 교육함"}, {"d": 1, "t": "지중해 지원청(Mediterranean Assistance Unit)을 통해 연중무휴 24시간 전문가 지원을 제공하고, 정부 관계자와 자원봉사자 대상으로 오염사고 대비 교육을 실시함. 아울러 선박 기인 오염 방지를 위한 각국의 법률 강화와 해운 관련 역내 활동을 지원함"}, {"d": 0, "t": "IMO 사무총장은 기념행사에 참석해 지중해가 20개국 지역의 공동체 경제 생태계를 연결하는 중요한 해역임을 언급하며 지중해 해양환경 보호를 위한 지속적인 역내 협력과 공동 대비의 중요성을 강조함"}]}]}, {"section": "IMO 소식", "title": "IMO 공지", "source": "", "category": "IMO 공지", "relevance": "하", "brief": "ACT-BIOFOULING 참여국 모집(CL.5231)·2026 국제해사상 후보 추천(CL.5283)·WMU 석사과정 장학 추천(CL.5297), IMO 시상식 개최 안내(CL.5292), IMSAS 1주기 감사결과 공개(CL.5299)·MSW 실태조사 기한연장(CL.5243), 우크라이나·멕시코 항행제한 통보(CL.5304·5305), 런던협약·의정서 과학그룹 회의(LC/SG 50) 개최안내(CL.5298) 등 제26-40~43호 사무국·기타 공지.", "groups": [{"label": "", "bullets": []}, {"label": "회의 및 사무국 공지", "bullets": [{"d": 0, "t": "(사무국) IMO ACT-BIOFOULING 사업 참여 희망국 모집 안내 (CL.5231, '26.10.12.)"}, {"d": 1, "t": "IMO는 선박 생물부착 관리 역량 강화를 위한 ACT-BIOFOULING* 사업을 추진하며, 4차권역사업에 참여할 주도협력국(LPO) 8개국과 협력국(PO) 8개국을 모집함. 동 사업은 UNDP가 이행하고 IMO가 집행하며, '23년 생물부착 지침 이행을 통한 침입 수생해충 확산 방지와 해운 온실가스 배출 저감을 목표로 함"}, {"d": 1, "t": "주도협력국에는 국가 정책 규제 개발, 선박 수중청소 관리, 침입종 감시프로그램, 협력국에는 자국 현황 교육 훈련과 기술지원 제공이 기대됨. 참여국은 '26.11.7.까지 참여의사를 밝혀야 함"}, {"d": 1, "t": "* Accelerating Collaboration and Transformation through Biofouling Management"}, {"d": 0, "t": "(사무국) IMO 2026 국제해사상 후보자 추천 안내 (CL.5283, '26.10.1.)"}, {"d": 1, "t": "IMO는 해사 분야에서 IMO의 활동과 목표 달성에 크게 기여한 개인 또는 비정부기구 단체를 대상으로 2026 국제해사상(International Maritime Prize) 후보자를 모집하며, '27.3.31.까지 추천서를 제출하도록 요청함"}, {"d": 1, "t": "후보자는 정부, 유엔 산하기구, IMO 협력 정부간기구 및 비정부기구가 각 1명씩 추천할 수 있으며, 여성 후보자 추천을 장려함. 수상자는 심사위원단의 심사와 IMO 이사회 승인을 거쳐 선정되며, '27.7월 제138차 이사회(C 139)에서 결정될 예정임"}, {"d": 0, "t": "(사무국) 세계해사대학교(WMU) 2027-2028 석사과정 후보자 추천 안내 (CL.5297, '26.10.23.)"}, {"d": 1, "t": "IMO는 스웨덴 말뫼 소재 세계해사대학교(WMU)의 해사학 석사과정(MSc in Maritime Affairs)을 '27.9.13.~'28.10.28. 운영하며, 회원국 정부가 추천한 적격 후보자에게 IMO 제한 장학금 일부를 제공하고 안내함"}, {"d": 1, "t": "해당 과정은 해사 분야 실무경력자를 대상으로 14개월간 영어로 진행되며, 관련 학사학위 또는 선장·기관장 최고등급 자격증과 충분한 실무경력 및 영어 능력을 요구함. 장학금 신청자는 '27.1.31.까지 WMU에 지원해야 함"}]}]}, {"section": "국제해사동향", "title": "노르웨이, IMO 넷제로 프레임워크 협상 교착 해소를 위한 절충안 제시", "source": "Lloyd's List, '26.10.15.", "category": "탈탄소", "relevance": "상", "brief": "노르웨이, IMO NZF 협상 교착 해소 위해 탄소가격제 자발적 이행 허용 절충안 제시(RU1 톤당 $100을 SU로 충당 허용). 미국·사우디 반발 가능성, EU 다수국 지지 전망이나 탄소가격 폐지 시 단일연료기준 전환 우려.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "노르웨이는 IMO 넷제로 프레임워크(NZF)를 둘러싼 장기간 대립을 해소하기 위해 탄소가격제의 자발적 이행을 허용하는 절충안을 제시하였으며, 각국의 수용 여부가 향후 협상의 주요 변수로 전망됨"}, {"d": 1, "t": "기존 NZF를 대체하기 위해 제출된 여러 제안은 탄소가격제 의무화를 둘러싸고 미국 등 19개국의 온실가스 감축초과를 지지하는 국가 간 입장 차이로 협의 가능성이 낮은 상황임"}, {"d": 1, "t": "Lloyd's List는 탄소배출에 비용을 부과하면서도, 해운비용 상승을 억제해야 하는 어려움 속에서, 노르웨이안이 기존 NZF의 핵심 구조를 유지하는 절충방안으로 주목받고 있다고 평가함"}, {"d": 0, "t": "노르웨이안은 선박이 온실가스 감축목표를 달성하지 못할 경우 초과단위(SU)를 활용해 1단계 보충유닛(RU)*을 이행하거나, 별도의 금전적 납부방식을 선택할 수 있도록 하는 내용을 담고 있음"}, {"d": 1, "t": "기존 NZF에서는 선주가 선박운영 효율을 통해 감축목표를 충족하거나, RU 구매비용을 납부, 또는 친환경 연료 사용으로 생성된 SU를 제출하는 방식으로 규제를 준수할 수 있음"}, {"d": 1, "t": "노르웨이안은 본래 100달러의 RU1 의무를 SU로 충당하도록 허용함으로써 기존 법적 성격의 납부방식을 엄격하게 변경하는 것으로, 미국은 이를 사실상의 탄소배출권 거래로 간주해 반발할 수 있으며 사우디아라비아도 반대할 가능성이 높다고 분석됨"}, {"d": 1, "t": "* Surplus Unit: 선박이 온실가스 배출기준보다 낮은 감축실적을 달성한 경우 발생하는 단위. 다른 선박의 규제준수에 활용할 수 있음"}, {"d": 1, "t": "* Remedial Unit: 선박이 온실가스 배출기준을 넘지 못한 경우 부족분을 보전하기 위해 구매하는 단위, 기존 NZF에서는 RU1과 RU2 2가지 단계로 각각 톤당 100달러/380달러로 설정됨"}, {"d": 0, "t": "또한 온실가스 감축을 위한 기술적 기준과 경제적 규제수단이 함께 작동해야 한다는 점에서 기존 NZF의 기본 구조를 크게 변경하기 어렵다고 평가함"}, {"d": 1, "t": "기술적 강화기준 없이 탄소가격제만 도입하면 과도한 수요의 변동이 발생하고, 반대로 경제적 규제수단이 없으면 실질적인 이행강제수단이 부족하다고 설명함"}, {"d": 1, "t": "기존 NZF에서는 바이오연료 가격과 SU 가격이 상승하더라도 선주가 톤당 380달러의 2단계 보충유닛(RU2)을 구매할 수 있어 SU 가격의 상한이 형성되며, 노르웨이는 이러한 구조가 시장의 급격한 가격 상승을 방지하는 데 핵심이라고 주장함"}, {"d": 0, "t": "Lloyd's List는 노르웨이안이 EU 등 주요 회원국의 지지를 얻을 가능성이 있으나, 미국의 반대와 탄소가격제의 실효성 문제가 여전히 협상 타결의 걸림돌이라고 평가함"}, {"d": 1, "t": "온실가스 감축효과가 없는 라이베리아안에 채택 가능성이 낮은 반면, 일정 수준의 탈탄소화를 달성할 수 있는 절충안이 EU 다수 회원국의 지지를 얻을 가능성이 있다고 평가함"}, {"d": 1, "t": "다만 미국이 지난해 10월과 같은 강경 태도를 반복할지, 표결에 참여하지 않는 방식으로 완화된 입장을 채택할지가 관건이며, 탄소가격제가 완전히 자발적인 체제로 전환될 경우 향후 개정 과정에서 폐지될 가능성도 제기됨"}, {"d": 0, "t": "또한 탄소가격제의 자발적 전환이 단일 연료기준 중심의 규제체제로 이어질 수 있으나, 개발도상국 지원과 해운업계의 투자 예측가능성 유지에는 한계가 있다고 지적함"}, {"d": 1, "t": "탄소가격제가 사실상 폐지되면 엄격한 성격의 SU 거래로 규제준수가 가능한 단일 연료기준으로 변경될 가능성이 높으며, 이는 IMO 협상 교착을 해소하는 방안으로 받아들여질 수 있다고 설명함"}, {"d": 1, "t": "그러나 개발도상국이 운송비 상승에 따른 부담을 보전받을 재원 확보가 불확실해지고, 제도 구체화에 수년이 소요되는 데다 탄소가격이 대폭 경감될 가능성도 있어 해운업계의 장기 투자 판단에 불확실성을 초래할 수 있다고 평가함"}]}]}, {"section": "국제해사동향", "title": "HD현대·안두릴, 미 해군 대상 자율운항 선박 실증 성공", "source": "The Maritime Executive, '26.10.19.", "category": "기타", "relevance": "하", "brief": "HD현대·안두릴, '26.10월 美해군 대상 자율운항 선박 복합임무 해상실증 성공(샌디에고 인근, 3시간30분). VAOne+Lattice AI 결합, MASC 사업 등 한·미 자율운항 함정 개발협력 확대.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "HD현대와 미국 방산기술기업 안두릴(Anduril)은 10월 미국 캘리포니아주 샌디에고 인근 해역에서 미 해군을 대상으로 자율운항 선박의 복합 임무수행 능력을 검증하는 해상 실증시험을 실시함"}, {"d": 1, "t": "이번 시험은 양사가 2024년부터 추진해 온 자율운항 군사 선박 개발협력의 일환으로, 미 해군이 과거 운용했던 패트롤보트를 활용해 약 3시간 30분간 진행됨"}, {"d": 1, "t": "실증에는 미 해군과 한국 해군, 방위사업청 및 미국선급(ABS)이 참여했으며, 양사는 미국 해역에서 자율운항 선박 기술을 처음 실증했다고 밝힘"}, {"d": 0, "t": "양사는 HD한국조선해양의 자율운항 기술과 안두릴의 인공지능(AI) 기반 임무관리 시스템을 결합해 선박의 자율항해 임무 변경 등 다양한 운용능력을 시험함"}, {"d": 1, "t": "실증 선박에는 HD한국조선해양이 개발한 자율항해 플랫폼 'VAOne'과 안두릴의 AI 기반 소프트웨어 'Lattice'를 통합 적용해 선박의 항해와 임무수행을 제어하도록 구성함"}, {"d": 1, "t": "시험에는 자율통제, 임무 변경, 여러 선박 간 협력운항 및 시스템 고장에 따른 비상대응 능력을 검증했으며, 육상 통제소에서 모든 운항상황을 실시간으로 감시함"}, {"d": 0, "t": "HD현대와 한국조선해양은 이번 실증을 통해 무인선박이 실제 운용환경에서 발생할 수 있는 다양한 상황에 대응하고 복잡한 임무를 수행할 수 있음을 확인했다고 평가함"}, {"d": 1, "t": "양사는 2024년 한·미 동맹국을 위한 새로운 자율운항함정의 설계개발 협력을 발표했으며, 이후 미 해군의 MASC(무인수상정) 사업을 위한 자율운항 수상정 개발체계도 공개함"}, {"d": 0, "t": "HD현대와 안두릴은 이번 실증을 바탕으로 미 해군 자율운항 함정 개발협력을 이어가며, 울산 조선소에서 건조 중인 공동개발 선박의 추가 해상실증도 추진할 계획임"}, {"d": 1, "t": "양사는 현재 HD현대 울산 조선소에서 선박 1척을 공동 건조하고 있으며, 이르면 2026년 11월 미국 연안에서 해당 선박의 해상실험을 진행할 예정임"}, {"d": 1, "t": "HD현대는 미국 해군 및 방산 산업의 신뢰 참여를 확대하고 있으며, 안두릴도 이번 협력을 한국 방산시장 진출의 기회로 보고 있는 것으로 전해짐"}]}]}]}, {"id": "26-41", "seq": 41, "issue_date": "2026-11-02", "posted": "2026-11-04", "board_no": 693, "url": "https://www.imokorea.org/board/board.asp?B_ID=Inter_Maritime&ty=view&page=1&bandstart=1&findtype=&findstr=&idx=6759&ii=693", "pdf": "(26-41호) IMO소식 및 국제해사동향.F.pdf", "pages": 7, "file": "2026/2026-11/IMO소식_26-41호_20261102.html", "items": [{"section": "IMO 소식", "title": "인도, 선박 대체연료 공급거점 구축을 위한 단계별 추진방안 제시", "source": "IMO Media Centre, '26.10.6.", "category": "대체연료·안전", "relevance": "중", "brief": "인도 DGMA·MoPSW·IMO GreenVoyage2050 공동연구, 메탄올 중심 대체연료 벙커링 확대 권고. 문드라·JNPT·첸나이·투티코린 거점항만 제시, 2026~2047년 3단계 로드맵(안전가격 확보→공급모델 확대→다종연료 공급).", "groups": [{"label": "", "bullets": [{"d": 0, "t": "인도는 선박 대체연료 공급시장의 경쟁력 확보를 위해 연료별 수요·가격을 분석하고, 2047년까지 단계적으로 벙커링 기반시설을 확대하는 방안을 제시함"}, {"d": 1, "t": "인도 해사총국(DGMA)과 항만·해운·수로부(MoPSW)가 추진하고 IMO GreenVoyage2050 프로그램이 지원한 연구에서는 인도의 대체연료 공급 잠재력과 시장 경쟁력을 분석했으며, 연료가격, 항만 운영 효율성, 공급 신뢰성 등을 주요 경쟁요인으로 제시함"}, {"d": 0, "t": "본 연구에서는 인도가 기존 항만 이용 선박의 연료수요를 기반으로 초기 공급시장을 형성하고, 메탄올을 중심으로 대체연료 벙커링을 확대할 것을 권고함"}, {"d": 1, "t": "문드라(Mundra), 자와할랄네루항(JNPT), 첸나이(Chennai), 투티코린(Tuticorin) 등을 주요 거점항만으로 제시했으며, 단다얄항(Deendayal Kandla)에서 연료를 공급받아 문드라항에서 메탄올 벙커링 시범사업을 추진하는 방안을 제안함"}, {"d": 0, "t": "또한 인도의 대체연료 공급시장 개발을 2026-2047년 3단계로 구분하고, 초기 운영기반 구축부터 다종연료 공급체계로 확대하는 로드맵을 제시함"}, {"d": 1, "t": "1단계(2026-2030년)는 벙커링 안전가격 경쟁력 확보, 2단계(2030-2035년)는 공급모델 확대 및 암모니아 벙커링 준비, 3단계(2035-2047년)는 다양한 대체연료 공급과 녹색해운항로 참여를 목표로 함"}, {"d": 0, "t": "이번 연구결과는 인도가 수립 중인 국가 녹색해운정책(National Green Shipping Policy)의 정책적 근거와 실무 권고사항으로 활용될 예정임"}, {"d": 1, "t": "인도 해사총국장은 대체연료 전환이 해운 탈탄소화뿐 아니라 에너지 안보 강화, 화석연료 수입 의존도 축소 및 신규 산업기회 창출에도 기여할 수 있다고 설명함"}]}]}, {"section": "IMO 소식", "title": "IMO 공지", "source": "", "category": "IMO 공지", "relevance": "하", "brief": "ACT-BIOFOULING 참여국 모집(CL.5231)·2026 국제해사상 후보 추천(CL.5283)·WMU 석사과정 장학 추천(CL.5297), IMO 시상식 개최 안내(CL.5292), IMSAS 1주기 감사결과 공개(CL.5299)·MSW 실태조사 기한연장(CL.5243), 우크라이나·멕시코 항행제한 통보(CL.5304·5305), 런던협약·의정서 과학그룹 회의(LC/SG 50) 개최안내(CL.5298) 등 제26-40~43호 사무국·기타 공지.", "groups": [{"label": "", "bullets": []}, {"label": "사무국 공지", "bullets": [{"d": 0, "t": "(사무국) IMO 시상식 개최 안내 (CL.5292, '26.10.12.)"}, {"d": 1, "t": "IMO는 '26.7월 제137차 이사회에서 2025 국제해사상 수상자로 미국 정부가 추천한 Jeffrey G. Lantz를 선정하고, 2026 바다의 의인상 수상자로 노르웨이 해상구조협회 소속 구조선 RS 125 Det Norske Veritas의 일등항해사 겸 잠수사 Adrian Willyson Brask를 선정함"}, {"d": 1, "t": "바다의 의인상은 20개 회원국과 2개 비정부기구가 추천한 후보자 51명 중 선정됐으며, 필리핀과 미국이 추천한 구조 활동 유공자에게는 표창장이 수여될 예정임"}, {"d": 1, "t": "IMO는 '26.12.14. 제112차 해사안전위원회(MSC 112) 첫날 회의 종료 후 18:00(UTC) 런던 IMO 본부에서 시상식을 개최하며, 사무총장 주최 리셉션을 진행할 예정임. 참석자는 17:55까지 본회의장에 착석해야 하며, 행사는 온라인으로도 생중계됨"}]}]}, {"section": "국제해사동향", "title": "원자력 추진선, 경제성 확보 위해 탄소가격제 필요", "source": "Lloyd's List, '26.10.26.", "category": "탈탄소", "relevance": "중", "brief": "영국 UCL 에너지연구소, 원자력 추진 상선이 화석연료 선박과 경쟁하려면 원자로 건조비 절감+글로벌 탄소가격제 필요 분석. 컨테이너선 건조비 원자력이 기존·암모니아 대비 높음, IMO NZF 도입 시 SU 확보로 경제성 개선 가능.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "영국 유니버시티칼리지런던(UCL) 에너지연구소는 원자력 추진 상선이 기존 화석연료 선박과 경쟁하려면 원자로 건조비용 절감과 글로벌 탄소가격제 도입이 필요하다고 분석함"}, {"d": 1, "t": "UCL은 선박의 건조·운영·폐기까지 고려한 총소유비용(TCO)*을 분석한 결과, 원자력 경제성이 원자로 유형과 건조비, 자본조달 비용 및 바이오연료·암모니아 등 대체연료 가격에 따라 달라진다고 설명함"}, {"d": 1, "t": "* Total Cost of Ownership: 선박의 건조부터 운영·유지보수·폐기까지 전체 수명주기에 발생하는 비용"}, {"d": 0, "t": "UCL은 원자력 추진 컨테이너선의 높은 초기 건조비가 상용화의 주요 장애요인으로, 기존 연료 선박과 상당한 비용 격차가 발생한다고 분석함"}, {"d": 1, "t": "14,500~19,999TEU급 컨테이너선(14.85노트 기준)의 건조비는 원자력 추진선이 약 2억2,800만~5억8,230만 달러로, 기존 연료 추진선(1억1,960만 달러)과 암모니아 추진선(1억4,850만 달러)보다 높은 것으로 추정됨"}, {"d": 1, "t": "연구진은 소형모듈원자로(SMR)*의 반복 생산으로 비용을 낮출 가능성은 있으나, 아직 충분한 비용 절감이 입증되지 않았다고 설명함"}, {"d": 1, "t": "* Small Modular Reactor: 기존 대형 원자로보다 규모가 작고 모듈화 반복 생산을 고려해 설계되는 원자로"}, {"d": 0, "t": "또한 본 연구에서는 IMO 넷제로 프레임워크(NZF)가 도입될 경우 원자력 추진선이 무배출 운항에 따른 초과단위(SU)*를 확보해 경제성을 개선할 수 있다고 평가함"}, {"d": 1, "t": "다만 현재 IMO 회원국 간 정치적 대립으로 NZF가 원안대로 채택될 가능성은 낮으며, 연구진은 원자력 추진선이 경쟁력을 확보하려면 원자로 비용 절감과 효과적인 글로벌 온실가스 규제가 함께 필요하다고 강조함"}, {"d": 1, "t": "* Surplus Unit: 선박이 온실가스 배출기준보다 우수한 감축실적을 달성한 경우 발생하는 단위로, 다른 선박의 규제준수에 활용할 수 있음"}, {"d": 0, "t": "UCL 연구는 원자력 추진선의 고속운항이 반드시 비용 절감으로 이어지지는 않으며, 실제 상용화 비용에도 상당한 불확실성이 남아 있다고 지적함"}, {"d": 1, "t": "25노트 운항 시 연간 항해거리는 32% 증가하지만 필요한 설치 출력은 3배 이상 늘어나는 것으로 분석됐으며, 이는 고속운항이 선박 운용비용을 줄일 수 있다는 기존 연구와 상반되는 결과임"}, {"d": 1, "t": "또한 원자력 전용 보험, 원자로 유지보수 및 선체 통합비용이 분석에 포함되지 않아 실제 비용이 더 높을 수 있으며, 초기 상용화를 위해서는 국가 간 책임보험·규제체계에 관한 합의도 필요하다고 설명함"}]}]}, {"section": "국제해사동향", "title": "해운업계, 자율운항선박 확대에 따른 규제·보험체계 정비 추진", "source": "TradeWinds, '26.10.27.", "category": "기타", "relevance": "중", "brief": "선원 확보난·자율운항 기술 발전으로 무인·자율운항선박 도입 추진, 조선소·선급·보험업계 운용기준·위험관리체계 정비. Ocean Infinity ROC 35척 운영, 국제 P&I 그룹 공동보험체계 검토, IUMI는 해킹 위험 우려 제기.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "해운업계는 선원 확보의 어려움과 자율운항 기술 발전에 대응해 무인·자율운항선박 도입을 추진하고 있으며, 조선소·선급·보험업계도 관련 운용기준과 위험관리체계 마련에 나서고 있음"}, {"d": 1, "t": "대형 화물선의 완전 자율운항은 아직 실현까지 상당한 시간이 필요하지만, 해양조사·해상지원 등 일부 분야에서는 육상에서 선박을 원격으로 조종하는 기술이 실제 운항에 활용되고 있다고 설명함"}, {"d": 0, "t": "영국 해양로봇 전문기업 Ocean Infinity는 육상 원격운영센터(ROC)*를 통해 세계 각지의 선박을 제어하는 자율운항체계를 구축하고, 해양조사·감시 등으로 활용범위를 확대하고 있음"}, {"d": 1, "t": "동사는 영국 사우샘프턴의 원격운영센터에서 실시간 영상과 운항정보를 활용해 선박을 조종하며, 쿠웨이트 해안경비대의 감시·순찰용 14m급 원격조종선박 4척을 포함해 총 35척의 선박을 운영하고 있음"}, {"d": 1, "t": "* Remote Operating Centre: 육상에서 선박 위치 및 영상, 운항정보를 실시간으로 확인하고 원격으로 선박을 조종하는 시설"}, {"d": 0, "t": "국제 P&I 클럽 그룹(IG)*은 자율운항선박의 사고에 대비해 기존 선박과 동일한 공동보험체계를 적용하기로 하고, 원격조종자의 법적 지위와 사고 배상책임 등을 검토하고 있음"}, {"d": 1, "t": "IG는 2017년부터 관련 문제를 논의해 왔으며, 자율운항선박 사고로 오염피해, 항만시설 손상, 난파물 제거 등 제3자 배상책임이 1,000만 달러를 초과할 경우 12개 회원과 재보험사가 손실을 공동 분담할 수 있도록 함"}, {"d": 1, "t": "보험업계는 현재 자율운항선박 대부분이 소형이어서 대규모 사고 가능성은 낮지만, 향후 운항 규모 확대에 대비해 보험사고 및 보상 경험을 축적할 필요가 있다고 설명함"}, {"d": 1, "t": "* International Group of P&I Clubs: 선박의 오염사고, 인명피해 및 제3자 배상책임 등을 공동으로 보장하는 주요 선주책임상호보험조합"}, {"d": 0, "t": "IMO는 2026년 자율운항선박의 비강제 안전규범을 채택했으며, 노르웨이·일본·중국·한국 등에서도 관련 기술의 실증과 상업적 활용이 진행되고 있음"}, {"d": 1, "t": "대표적으로 노르웨이의 120TEU급 전기추진 컨테이너선 Yara Birkeland호는 2022년부터 약 11해리 구간에서 상업운항 중이나, 규제요건에 따라 일부 선원이 승선하고 있음"}, {"d": 1, "t": "IMO에 따르면 현재 국제무역에 투입된 자율운항선박은 없으며, 자율운항 수준은 선원이 승선한 자동화 선박부터 인간의 개입이 없는 완전자율운항선박까지 4단계로 구분됨"}, {"d": 0, "t": "해상보험업계는 자율운항선박이 인적요인 사고를 줄일 가능성이 있는 반면, 해킹 등 새로운 사이버 위험이 기존 선박 사고보다 큰 피해를 초래할 수 있다고 우려함"}, {"d": 1, "t": "선주책임보험사 Gard에 따르면 전체 P&I 보험금 청구의 약 절반이 인적요인과 관련돼 있으며, 지난 9월 로테르담에서 열린 국제해상보험연합(IUMI) 회의에서는 자율운항선박의 해킹 위험이 기존 유인선박의 사고위험을 넘어설 수 있다는 지적이 제기됨"}]}]}]}, {"id": "26-42", "seq": 42, "issue_date": "2026-11-06", "posted": "2026-11-05", "board_no": 694, "url": "https://www.imokorea.org/board/board.asp?B_ID=Inter_Maritime&ty=view&page=1&bandstart=1&findtype=&findstr=&idx=6760&ii=694", "pdf": "(26-42호) IMO소식 및 국제해사동향.F.pdf", "pages": 8, "file": "2026/2026-11/IMO소식_26-42호_20261106.html", "items": [{"section": "IMO 소식", "title": "부산 세계해사의 날 행사 병행행사, 국제해사규정 이행 강화 촉구", "source": "IMO Media Centre, '26.10.28.", "category": "IMO 제도", "relevance": "중", "brief": "IMO·해수부 공동 주최 2026 세계해사의 날 병행행사(부산, 10.26~27). MASS Code 채택·해사 디지털화 전략 승인 등 규제성과 소개, 제1주기 회원국감사 완료(168개국). 2027년 개최국은 필리핀.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "IMO와 대한민국 해양수산부는 10월 26~27일 부산에서 2026년 세계해사의 날 병행행사*를 공동 개최하고, 국제해사규정의 실효성 있는 이행을 위한 국가별 조치와 국제협력 강화를 논의함"}, {"d": 1, "t": "이번 행사는 '정책에서 실행으로: 해사분야의 우수성 강화(From Policy to Practice: Powering Maritime Excellence)'를 주제로 정부·국제기구·산업계·학계 관계자가 참석했으며, 해사분야의 디지털화·자동화·에너지 전환 및 지정학적 갈등에 대응하기 위한 협력방안을 논의함"}, {"d": 1, "t": "* World Maritime Day Parallel Event: IMO가 세계해사의 날을 기념해 회원국과 공동 개최하는 국제행사로, 해사분야의 주요 정책과 국제협력 과제를 논의"}, {"d": 0, "t": "남재헌 해양수산부 차관은 개회사를 통해 해사분야가 직면한 과제에 대한 국제사회의 공동 대응 필요성과 함께 IMO를 중심으로 한 국제적 연대와 협력을 강조함"}, {"d": 0, "t": "IMO 사무총장은 2026년 자율운항선박 안전규범 채택과 해사 디지털화 전략 승인 등 주요 규제성과를 소개하고, 국제해사규정 이행 과정에서 선원의 안전과 복지를 우선할 것을 강조함"}, {"d": 1, "t": "주요 성과로 비강제 자율운항선박 코드(MASS Code)*채택, IMO 해사 디지털화 전략의 총회 검토를 위한 승인, 대체연료 사용 선박의 안전지침 개발 등을 제시함"}, {"d": 1, "t": "또한 IMO는 2026년 첫 번째 전 세계 회원국 감사주기를 완료해 168개 회원국(전체의 94%)의 국제해사규정 이행현황을 소개했으며, 이를 통해 공통적인 이행상 미비점을 파악하고 기술지원의 우선순위를 설정할 수 있게 됐다고 설명함"}, {"d": 1, "t": "* Maritime Autonomous Surface Ships Code: 자율운항선박의 안전한 운항을 위한 IMO 규범으로, 2026년 비강제 코드로 채택됨"}, {"d": 0, "t": "한국·노르웨이·키프로스·인도 등 참가국은 국제해사규정의 채택뿐 아니라 이행역량 확보가 중요하다며, 정부·국제기구·산업계·학계의 협력 필요성을 강조함"}, {"d": 1, "t": "토론 세션 중 하나인 고위급 라운드 테이블에서는 각국의 규정 이행경험과 우수사례를 공유했으며, 효과적인 이행을 위해 국내 법제도, 전문인력, 기반시설, 산업계와의 긴밀한 협력이 필요하다고 설명함"}, {"d": 1, "t": "IMO 이사회 의장 빅토르 히메네스 페르난데스(Víctor Jiménez Fernández)는 지정학적 갈등이 주요 해상교통로와 선원 복지, 국제해운에 미치는 영향을 언급하며 IMO에서 마련한 국제규제체계를 구체적인 조치로 이행해야 한다고 강조함"}, {"d": 0, "t": "이번 행사는 정부·국제기구·산업계·학계의 논의를 통해 국제해사규정의 이행방안을 모색함. 참고로 2027년 세계해사의 날 병행행사는 필리핀에서 개최될 예정임"}, {"d": 1, "t": "이후 토론 세션은 정부의 국내 이행역량 강화, 국제기구 간 기술지원과 협력, 해운·조선업계의 규정 이행방안, 학계의 인재양성 및 역량강화 등을 중심으로 진행됐으며, 행사 종료 시 필리핀에 차기 개최국 깃발을 전달함"}]}]}, {"section": "IMO 소식", "title": "IMO 공지", "source": "", "category": "IMO 공지", "relevance": "하", "brief": "ACT-BIOFOULING 참여국 모집(CL.5231)·2026 국제해사상 후보 추천(CL.5283)·WMU 석사과정 장학 추천(CL.5297), IMO 시상식 개최 안내(CL.5292), IMSAS 1주기 감사결과 공개(CL.5299)·MSW 실태조사 기한연장(CL.5243), 우크라이나·멕시코 항행제한 통보(CL.5304·5305), 런던협약·의정서 과학그룹 회의(LC/SG 50) 개최안내(CL.5298) 등 제26-40~43호 사무국·기타 공지.", "groups": [{"label": "", "bullets": []}, {"label": "사무국 공지", "bullets": [{"d": 0, "t": "(사무국) IMO 회원국감사제도(IMSAS) 제1주기 감사결과 공개 안내 (CL.5299, '26.10.28.)"}, {"d": 1, "t": "IMO는 제137차 이사회 결정에 따라 '16~'26년 회원국감사제도(IMSAS) 제1주기 감사를 받은 회원국을 대상으로, IMO 협약이행 코드(III Code)의 효과적 이행 수준을 나타내는 감사결과의 자발적 공개를 요청함"}, {"d": 1, "t": "공개 대상은 최종 감사보고서에 따른 이행 수준과 후속조치 결과를 반영한 이행 수준으로, 회원국 동의서 제출 시, IMO 사무국이 이를 그래프로 작성해 홈페이지에 공개할 예정임. 제2주기 감사부터는 개정된 IMSAS 기본체계 및 절차에 따라 제한적인 감사정보 공개가 적용될 예정임"}, {"d": 0, "t": "(사무국) IMO 해사싱글윈도우(MSW) 시스템 이행·활용 실태조사 기한 연장 안내 (CL.5243, '26.10.28. 재발행)"}, {"d": 1, "t": "IMO는 제50차 간소화위원회(FAL 50) 결정에 따라 추진 중인 해사싱글윈도우(MSW) 시스템 이행·활용 실태조사 응답기한을 기존 일정에서 '26.11.30.까지 연장한다고 안내함"}, {"d": 1, "t": "이번 조사는 해사당국·항만당국·세관·선사·해운대리점 등 공공·민간 이해관계자를 대상으로 MSW 시스템의 운영 경험과 문제점 및 우수사례를 수집하며, 결과는 제51차 간소화위원회(FAL 51)에 보고할 예정임"}]}, {"label": "기타 공지", "bullets": [{"d": 0, "t": "(우크라이나) 러시아의 흑해 상선 공격 관련 입장 통보 (CL.5304, '26.11.2.)"}, {"d": 1, "t": "우크라이나 정부는 '26.10월 흑해에서 러시아의 상선 공격으로 선원 사망·실종·부상자가 발생했다고 주장하며, 특히 루마니아·불가리아 연안에서 발생한 일련의 공격이 국제항행 안전과 해상교역을 위협한다고 IMO에 통보함"}, {"d": 1, "t": "* 26.10.5.~23. 세인트키츠네비스·토고·팔라우·기니비사우·코모로·산마리노 국적 등 상선 7척 공격으로 사상자 발생"}, {"d": 1, "t": "또한, 러시아가 우크라이나 항만과 해상운송을 지속적으로 공격해 국제 식량공급과 운송·보험비용에 영향을 미치고 있다고 주장함"}, {"d": 1, "t": "우크라이나는 IMO와 회원국에 러시아의 상선·선원·인프라 공격 중단을 촉구하고, 선원 희생자에 대한 IMO 회의 차원의 추모, 흑해 항행위험 정보공유 및 선원 유가족 지원을 요청함"}, {"d": 1, "t": "아울러 IMO 주도로 항행의 자유와 상선·선원 보호를 위한 국제적 법적 구속력 있는 문서 개발을 제안함"}, {"d": 0, "t": "(멕시코) 프로그레소항 준설공사 관련 항행 제한 통보 (CL.5305, '26.10.20.)"}, {"d": 1, "t": "멕시코 정부는 유카탄주 프로그레소항(Port of Progreso)의 확장·현대화 사업 2단계 준설공사와 관련하여, 항로 좌현 측 부표(13-21번)와 항내 선회수역 부표(23-26번)의 최종 위치를 IMO에 통보함"}, {"d": 1, "t": "멕시코는 준설작업 기간 중 항행안전과 인명 보호를 위해 프로그레소항 내 허가받지 않은 선박의 항행을 제한하고, 해당 구역의 관광·레저 활동을 중단한다고 밝힘. 부표별 위치 좌표와 배치도는 회람문서 부속서에 수록함"}]}]}, {"section": "국제해사동향", "title": "해운업계, AI 활용 확대에도 관리체계 구축 미흡", "source": "SAFETY4SEA, '26.9.30.", "category": "디지털·검사", "relevance": "하", "brief": "Thetius·Marcura 공동보고서, 해사분야 AI 일상 사용 63%이나 조직 차원 AI 관리체계 성숙도는 8%에 불과. 공식 AI 정책 보유 조직 11%→35%(2025→2026)로 증가했으나 실준수율 25%.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "해사기술 연구기관 Thetius와 해운 디지털서비스 기업 Marcura는 해운업계에서 인공지능(AI)의 일상적 활용이 빠르게 확대되고 있으나, 이를 관리·감독하는 조직 차원의 체계는 여전히 미흡하다고 분석함"}, {"d": 1, "t": "양 기관이 발간한 「Earning Trust: AI in Maritime」 보고서는 선주·선박관리회사·기술기업 등 해사분야 종사자 600명을 대상으로 조사했으며, 응답자의 63%가 AI를 매일 사용하지만 소속 조직의 AI 활용·관리체계가 성숙한 수준이라고 평가한 비율은 8%에 불과함"}, {"d": 1, "t": "AI를 주 1회 이상 사용하는 비율은 80%에 달했으며, 응답자의 72%는 지난 1년간 업무에서 AI의 역할이 확대됐다고 답해 AI가 실험적 도구에서 실제 업무에 활용되는 기술로 전환되고 있는 것으로 나타남"}, {"d": 0, "t": "해운기업들은 계약서 작성과 문서검토 등 다양한 업무에 AI를 활용하고 있으나, 결과의 정확성을 확인하기 위한 추가적인 검증 부담도 발생하고 있음"}, {"d": 1, "t": "주요 활용 분야는 계약문구 작성, 문서검토, 이메일 관리 및 업무분석 등이며, 응답자의 55%가 AI가 생성한 결과를 검토·수정하는 데 매주 1시간 이상, 약 20%는 5시간 이상 사용하는 것으로 조사됨"}, {"d": 1, "t": "다만 이러한 검증시간을 고려하더라도 응답자의 85%는 AI 활용이 전체적인 업무시간을 절약하는 데 도움이 된다고 평가함"}, {"d": 0, "t": "해운업계의 AI 활용에 관한 공식 정책은 확대되고 있으나, 실제 현장에서 이를 준수하고 적절한 감독체계를 갖춘 기업은 제한적인 것으로 나타남"}, {"d": 1, "t": "공식 AI 활용정책을 보유한 조직의 비율은 2025년 11%에서 2026년 35%로 증가했으나, 직원들이 해당 정책을 실제 준수한다고 응답한 비율은 25%에 그쳤으며, 적절한 AI 관리체계가 이미 구축됐다는 응답은 15%에 불과함"}, {"d": 1, "t": "또한 응답자의 약 절반은 동료들이 회사의 공식 승인을 받지 않은 AI 도구를 사용하고 있다고 밝혔으며, 72%는 단순한 정보제공을 넘어 실제 업무를 수행하는 에이전트형 AI(Agentic AI)를 이미 활용하거나 시험 도입할 계획이라고 답함"}, {"d": 0, "t": "본 보고서는 AI에 대한 신뢰를 높이기 위해 결과 검증의 필요성과 함께 인간의 감독과 투명한 의사결정 체계를 강화해야 한다고 강조함"}, {"d": 1, "t": "또한 AI 오류의 영향이 커 반드시 사람이 확인해야 하는 '필수 검증'과 AI의 판단근거가 불확실하거나 신뢰가 부족해 발생하는 '잉여 검증'을 구분하고, 후자는 관리체계와 투명성 강화를 통해 줄일 수 있다고 설명함"}, {"d": 1, "t": "Marcura의 야나니 야그나무르티(Janani Yagnamurthy) 수석부사장은 해운업계의 계약서, 이메일, 시스템 등에 분산된 정보를 의사결정 과정에서 통합하고, AI가 판단근거를 제시하도록 하며 수정결과를 학습하도록 하는 것이 신뢰 확보에 중요하다고 설명함"}]}]}, {"section": "국제해사동향", "title": "환경단체, IMO 사무총장의 LNG 관련 발언 철회 요구", "source": "Lloyd's List, '26.10.30.", "category": "탈탄소", "relevance": "상", "brief": "환경단체, 도밍게스 IMO 사무총장의 LNG 전환연료 지지 발언 철회 요구(메탄슬립 문제). LNG 추진선 1,733척으로 메탄올·암모니아 추진선 압도, NZF 협상서 LNG 규제완화 여부가 쟁점.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "국제환경단체들은 아르세니오 도밍게스 IMO 사무총장이 LNG를 해운 탈탄소화의 전환연료로 지지하는 듯한 발언을 했다며, 해당 입장을 철회하고 IMO 사무국의 중립성을 유지할 것을 촉구함"}, {"d": 1, "t": "도밍게스 사무총장은 중국 상하이에서 열린 글로벌해사포럼(GMF) 행사에서 무배출 연료로의 전환이 단기간에 이뤄질 수 없다고 언급하며, 메탄슬립*을 줄인 신규 엔진과 바이오연료 활용을 고려해야 한다고 설명함"}, {"d": 1, "t": "이에 청정해운연합(Clean Shipping Coalition)과 유럽 교통환경연합(Transport & Environment) 등 13개 단체는 공개서한을 통해 연료별 규제 적용은 독립적이고 과학적인 지침을 바탕으로 회원국 간 협상에서 결정돼야 한다고 주장함"}, {"d": 1, "t": "* Methane Slip: LNG 추진기관에서 연료가 완전히 연소되지 않아 메탄이 대기 중으로 배출되는 현상"}, {"d": 0, "t": "환경단체들은 메탄 기반 연료가 실제 온실가스 감축기준을 충족하지 못할 경우, IMO 넷제로 프레임워크(NZF)*에서 혜택을 받아서는 안 된다고 주장함"}, {"d": 1, "t": "이들은 연료 생산·공급·사용의 전 과정에서 발생하는 온실가스 배출량에 메탄슬립과 상류부문 메탄 누출을 포함해야 하며, 현재의 과학적 근거로는 LNG가 NZF의 무배출·준무배출 기준을 충족하지 못한다고 지적함"}, {"d": 1, "t": "또한 화석연료 기반 LNG를 전환연료로 인정할 경우, 녹색수소 기반 합성연료(e-fuel) 등 비용은 높지만 배출량이 적은 대체연료에 대한 투자가 위축될 수 있다고 우려함"}, {"d": 1, "t": "* 국제해운의 온실가스 감축을 위해 연료의 배출기준과 경제적 규제수단을 결합한 IMO 규제체계안"}, {"d": 0, "t": "LNG 사용을 지지하는 측은 LNG가 기존 선박연료를 대체할 수 있는 경제적이고 공급 가능한 연료라고 주장하는 가운데, LNG 추진선은 대체연료 선박시장에서 가장 높은 비중을 차지하고 있음"}, {"d": 1, "t": "LNG 지지 측은 메탄슬립을 점진적으로 줄일 수 있고 향후 바이오 LNG 등 저배출 연료로 전환할 수 있다고 주장하며, DNV 선급에 따르면 현재 운항 중이거나 발주된 LNG 추진선은 1,733척으로 메탄올 추진선(464척)과 암모니아 추진선(54척)을 크게 상회함"}, {"d": 1, "t": "특히 2025년 10월 미국의 반대로 NZF 채택 표결이 무산된 이후 메탄올 추진선을 비롯한 이중연료 선박의 신규 발주가 감소하면서 LNG 추진선의 시장 우위가 더욱 확대된 것으로 나타남"}, {"d": 0, "t": "Lloyd's List는 LNG의 규제상 배출량 산정방식이 향후 NZF 협상의 주요 쟁점으로 남아 있으며, 미국 등 반대국과의 타협 과정에서 LNG에 대한 규제 완화 가능성이 제기되고 있다고 보도함"}, {"d": 1, "t": "현행 NZF안은 특정 연료에 별도의 불이익을 부과하지 않고 온실가스 배출집약도(GFI)*에 따라 비용을 부과하는 방식으로, LNG는 2034년경부터 톤당 380달러의 2단계 보완단위(RU2) 비용을 부담할 것으로 예상됨"}, {"d": 1, "t": "브라질 등 NZF 지지국들은 미국 등 반대국의 동의를 확보하기 위한 절충안으로 LNG에 대한 규제 완화를 제시했으며, IMO 대변인은 연료·기술에 관한 최종 결정은 회원국들이 IMO 규제절차를 통해 내릴 사안이라고 밝힘"}, {"d": 1, "t": "* Greenhouse Gas Fuel Intensity: 연료가 생산·공급·사용되는 전 과정에서 발생하는 온실가스 배출량을 에너지 사용량과 비교해 산정하는 지표임"}]}]}]}, {"id": "26-43", "seq": 43, "issue_date": "2026-11-16", "posted": "2026-11-16", "board_no": 695, "url": "https://www.imokorea.org/board/board.asp?B_ID=Inter_Maritime&ty=view&page=1&bandstart=1&findtype=&findstr=&idx=6761&ii=695", "pdf": "(26-43호) IMO소식 및 국제해사동향.F.pdf", "pages": 10, "file": "2026/2026-11/IMO소식_26-43호_20261116.html", "items": [{"section": "IMO 소식", "title": "중국 다롄해사대 위자자, 2027년 IMO 양성평등상 수상자 선정", "source": "IMO Media Centre, '26.11.04.", "category": "기타", "relevance": "하", "brief": "IMO 이사회(C 138), 중국 다롄해사대 위자자(항해사 겸 강사)를 2027년 IMO 양성평등상 수상자로 선정(중국 여성 최초 무제한 항해구역 항해사 자격 보유). 덴마크 DFDS 젬마 그리핀에게는 표창장 수여.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "IMO 이사회는 11월 2-6일 런던에서 개최된 제138차 회의(C 138)에서 중국이 추천한 다롄해사대학교(Dalian Maritime University)의 위자자(Yu Jiajie)를 2027년 IMO 양성평등상 수상자로 선정함"}, {"d": 1, "t": "위자자는 다롄해사대 항해대학의 일등항해사(Teaching Chief Mate) 겸 강사로, 지난 10년간 승선경력과 교육 연구 활동을 바탕으로 여성 해상인력의 진출과 전문성 향상에 기여한 공로를 인정받았음"}, {"d": 1, "t": "시상식은 2027년 5월 18일 세계 여성해사인의 날 기념행사와 함께 개최될 예정임"}, {"d": 1, "t": "* IMO Gender Equality Award: 해상부문 양성평등 증진과 여성 역량강화에 크게 기여한 개인을 선정해 수여하는 상임"}, {"d": 0, "t": "위자자는 중국 랴오닝 해사안전국 관할 최초로 무제한 항해구역 선박의 항해사 자격을 취득한 여성으로, 해상근무와 전문기술 분야에서 경력을 쌓아왔음"}, {"d": 1, "t": "50개월 이상의 승선경력을 통해 실습생에서 3등-2등 항해사를 거쳐 교육훈련 담당 일등항해사로 활동하고 있으며, 자기컴퍼스 조정사 자격을 취득하고 50회 이상의 자기컴퍼스 조정 보정 작업을 수행함"}, {"d": 0, "t": "위자자는 여성 해기사 양성을 위한 멘토링과 실습교육을 확대하고, 해사교육 개선 및 연구활동에도 기여한 것으로 평가됨"}, {"d": 1, "t": "여성 학생을 대상으로 100회 이상의 개별 진로상담을 실시하고, 실습선 Yu Kun호에서 총 3,000명의 교육생 중 여성 1,000명 이상을 지도했으며, 10건 이상의 교육개혁 사업과 전문교재 공동 집필, 30건 이상의 해사교육 연구과제에 참여함"}, {"d": 0, "t": "IMO 이사회는 덴마크가 추천한 DFDS의 글로벌 선원관리 부문 부사장 젬마 그리핀(Gemma Griffin)에게도 여성 해사인력의 역량강화에 기여한 공로로 표창장을 수여하기로 함"}, {"d": 1, "t": "그리핀은 교육·멘토링·승선경력 확보 및 고용기회 제공을 통해 여성의 해상 근무직 진출과 경력개발을 지원하고, 안전관리 과정에서 양성평등을 증진한 성과를 인정받음"}]}]}, {"section": "IMO 소식", "title": "제138차 이사회 주요 결과", "source": "", "category": "IMO 제도", "relevance": "중", "brief": "11.2~6 제138차 이사회(C 138) 개최, 16개 의제 논의. 의사규칙 개정 승인, 2026년 예산 관리 가능 판단 및 GISIS 현대화·e-Learning 재원 승인, 도밍게스 사무총장 임기 4년 연장('28~'31) 권고, 2021년 이사회 정원 확대 협약개정안 37개국 수락(발효 요건 80개국).", "groups": [{"label": "", "bullets": [{"d": 0, "t": "2026년 11월 2일부터 6일까지 IMO 본부에서 제138차 이사회(C 138)가 개최되었으며, 의제 목록과 주요 논의사항 및 결과는 아래와 같음"}, {"d": 1, "t": "의제 1 의제의 채택 / 의제 2 신임장에 대한 사무총장 보고 / 의제 3 의사규칙 / 의제 4 전략 및 계획 / 의제 5 자원 관리 / 의제 6 다중언어 강화 / 의제 7 GISIS 향상 / 의제 8 IMO 회원국 감사제도"}, {"d": 1, "t": "의제 9 1972년 런던협약 및 1996년 런던의정서 체약당사국회의 보고 / 의제 10 대외관계 / 의제 11 필수 해운항로 보호 / 의제 12 협약 현황 보고 / 의제 13 사무총장 계약 / 의제 14 외부감사인 임명 / 의제 15 차기 이사회 일정 및 차기(2027년) 이사회 잠정의제 / 의제 16 기타 의제"}]}, {"label": "의제 3: 의사규칙", "bullets": [{"d": 0, "t": "이사회는 작업반 검토를 거쳐 이사회 의사규칙 개정안을 승인함"}, {"d": 1, "t": "회의 중지·휴회, 토론 연기·종결 등 절차 동의* 규칙과 표결 중 행동 규칙을 신설하고, 의사진행발언** 설명문을 의사규칙 부속서에 수록함"}, {"d": 1, "t": "대표단 동행인원 제출 기한(개회일까지)은 현행을 유지하되, 회원국에 기한 준수를 촉구하기로 함"}, {"d": 1, "t": "* 회의 진행방식에 관한 제안으로, 표결로 결정함"}, {"d": 1, "t": "** 회의 진행이나 의사규칙 적용에 대해 의장의 판단을 구하는 발언으로, 의견이 즉시 결정함"}, {"d": 0, "t": "이사회와 총회의 의사규칙 간 정합성 확보를 위해 사무국에 총회 의사규칙 개정안 마련을 요청하였으며, 동 개정안은 제139차 이사회('27.7.) 검토를 거쳐 제35차 총회('27.11.)에서 채택 예정임"}]}, {"label": "의제 5: 자원 관리", "bullets": [{"d": 0, "t": "이사회는 2026년 지출이 승인 예산 범위 내에서 관리 가능하다는 사무총장의 판단에 주목하고, 본부자본기금 이월 및 퇴직급여기금 부족분 충당을 원칙적으로 승인함"}, {"d": 1, "t": "사무총장은 물가 상승과 업무 수요 증가로 2028-2029년 예산이 5% 이상 증가할 수 있다고 밝혔으며, 다수 회원국은 분담금 인상 최소화를 요청함"}, {"d": 0, "t": "이사회는 GISIS* 현대화 2단계 및 e-Learning 플랫폼 재원으로 기술협력기금 적립금 중 200만 파운드(약 36억 원) 사용을 승인하고, 추가 재원은 사무총장이 세부 비용과 함께 차기 이사회에 제안하도록 함"}, {"d": 1, "t": "* Global Integrated Shipping Information System: 회원국의 협약 이행 정보와 선박 이력 정보 등을 보고·조회하는 IMO 온라인 시스템"}, {"d": 0, "t": "재산공개 대상 확대 등을 담은 직원규정 개정안을 승인하고, 분담금 미납국에 조속한 납부를 촉구함"}]}, {"label": "의제 7: GISIS 향상", "bullets": [{"d": 0, "t": "이사회는 GISIS 현대화 사업 추진 현황에 주목하고, 사업의 성공적 완료를 위한 2단계 사업의 중요성을 재확인함"}]}, {"label": "의제 10: 대외관계", "bullets": [{"d": 0, "t": "우리나라는 부산에서 개최한 세계 해사의 날 병행행사(10.26.-27.)와 2026 한국해사주간(10.28.-29.)의 주요 결과를 보고하였으며, 이사회는 행사를 성공적으로 개최한 우리 정부에 사의를 표함. 2027년 병행행사는 필리핀에서 개최될 예정임"}]}, {"label": "의제 12: 협약 현황 보고", "bullets": [{"d": 0, "t": "IMO 회원국은 176개국, 준회원은 3개국으로 변동이 없으며, 이사회 정원 확대(40→52개국) 등을 골자로 한 2021년 IMO 협약 개정안(결의 A.1152(32))은 칠레의 추가 수락으로 37개국이 수락함. 발효를 위해서는 80개국 이상의 추가 수락이 필요함"}]}, {"label": "의제 13: 사무총장 계약", "bullets": [{"d": 0, "t": "이사회는 도밍게스 사무총장의 임기를 4년 연장('28.1.1.-'31.12.31.)하기로 결정하고, 협약 제22조에 따라 제35차 총회('27.11.)에 승인을 권고함"}]}]}, {"section": "IMO 소식", "title": "IMO 공지", "source": "", "category": "IMO 공지", "relevance": "하", "brief": "ACT-BIOFOULING 참여국 모집(CL.5231)·2026 국제해사상 후보 추천(CL.5283)·WMU 석사과정 장학 추천(CL.5297), IMO 시상식 개최 안내(CL.5292), IMSAS 1주기 감사결과 공개(CL.5299)·MSW 실태조사 기한연장(CL.5243), 우크라이나·멕시코 항행제한 통보(CL.5304·5305), 런던협약·의정서 과학그룹 회의(LC/SG 50) 개최안내(CL.5298) 등 제26-40~43호 사무국·기타 공지.", "groups": [{"label": "", "bullets": []}, {"label": "사무국 공지", "bullets": [{"d": 0, "t": "(사무국) 런던협약·의정서 과학그룹 회의(LC/SG 50) 개최 안내 (CL.5298, '26.10.27.)"}, {"d": 1, "t": "IMO는 제50차 런던협약 과학그룹 및 제21차 런던의정서 과학그룹 회의(LC/SG 50)를 '27.4.12.-16, 말레이시아에서 개최할 예정이며, 구체적인 개최 장소와 숙박·교통 정보는 추후 안내할 계획임. 회의는 영어로 진행되며, 참가자는 OMRIS를 통해 사전 등록해야 함"}, {"d": 1, "t": "주요 의제로 폐기물 평가 지침, 해양지구공학, 해저 지질구조 내 이산화탄소 저장, 해양환경 감시 평가, 해양오염 방지를 위한 연안관리, 방사성폐기물 및 기술협력 등을 논의할 예정임"}]}]}, {"section": "국제해사동향", "title": "선주들, IMO 넷제로 프레임워크의 단순한 규제 이행방식 선호", "source": "SAFETY4SEA, '26.11.10.", "category": "탈탄소", "relevance": "상", "brief": "글로벌해사포럼(GMF) 해운기업 15개사 조사, 선주 대다수가 NZF 이행방식으로 기존 보완유닛(RU) 등 단순한 금전납부 방식을 직접기여(DC)·자발적유닛(VU) 등 투자연계 대안보다 선호. 개발도상국 지원 축소·친환경연료 전환유인 약화 우려.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "글로벌해사포럼(GMF)의 Getting to Zero Coalition은 해운기업 15개사를 대상으로 한 조사에서 선주들이 IMO 넷제로 프레임워크(NZF)의 규제 이행방식으로 단순하고 실효성 있는 금전적 납부체계를 선호한다고 분석함"}, {"d": 1, "t": "이번 분석은 11월 23-27일 ISWG-GHG 23 및 11월 30일-12월 3일 MEPC 85를 앞두고 발표됐으며, 2025년 4월 MEPC 83에서 승인됐으나 같은 해 10월 채택이 연기된 NZF의 경제적 규제수단에 대한 대안을 검토함"}, {"d": 1, "t": "조사에는 컨테이너선·벌크선·유조선 선주를 중심으로 용선사, 연료 생산업체 및 기반시설 기업이 참여했으며, 15개사 모두 규제 미준수에 따른 금전적 부담이 충분한 수준을 유지하면서도 이행절차는 단순해야 한다는 입장을 보임"}, {"d": 1, "t": "* GMF가 주도하는 해운 탈탄소화 협력체로, 해운기업 및 관련 기관이 참여해 무배출 해운 전환을 추진함"}, {"d": 0, "t": "GMF는 기존 보완유닛(RU)* 방식과 새롭게 제안된 직접기여(DC)** 및 자발적 유닛(VU)*** 방식 등 3개 규제 이행방식을 비교하고, 대안들이 친환경 연료 전환 유인을 약화시킬 수 있다고 지적함"}, {"d": 1, "t": "기존 RU 방식은 선주가 규제준수를 위한 금액을 중앙관리기금에 납부해 친환경 연료와 공정한 전환을 지원하는 반면, DC 방식은 승인·감독을 전제로 선주가 선택한 사업에 납부금을 직접 투자하는 것을 허용함"}, {"d": 1, "t": "VU 방식은 납부금 일부를 투자로 인정해 향후 수익을 환수할 수 있도록 하는 구조로, GMF는 투자수익을 통해 납부금 일부를 회수할 경우 규제 미준수에 따른 실질적 부담이 줄어들어 무배출 연료 도입 유인이 약화될 수 있다고 분석함"}, {"d": 1, "t": "* Remedial Unit: NZF의 온실가스 배출기준을 충족하지 못한 선박이 부족분을 보완하기 위해 납부·구매하는 규제수단"}, {"d": 1, "t": "** Direct Contribution: 선주가 규제준수 납부금을 중앙기금에 납부하는 대신 승인된 사업에 직접 배분하는 방식"}, {"d": 1, "t": "*** Voluntary Unit: 규제준수 납부금 일부를 투자로 처리해 향후 투자수익을 얻을 수 있도록 하는 이행방식"}, {"d": 0, "t": "조사에 참여한 해운기업들은 VU를 통한 투자수익이 실제 운임 인하로 이어지기 어렵고, 오히려 규제준수 비용의 예측가능성을 낮출 수 있다고 평가함"}, {"d": 1, "t": "선주들은 일반적으로 3개월-1년을 기준으로 연료비와 운임을 결정하지만, VU 투자수익은 화주와 체결한 계약이 불확실성 요인을 반영하기 어렵다고 설명함"}, {"d": 1, "t": "이에 따라 규제준수 납부금은 기존체계 연료비에 포함해 고객에게 전가되는 반면, 향후 투자수익은 별도의 재무적 이익으로 처리될 가능성이 높아 운송비 절감 효과가 제한적일 것으로 분석됨"}, {"d": 0, "t": "GMF는 선주가 규제준수 납부금의 투자처를 직접 결정할 경우, 사업별 검토 부담이 증가해 중앙관리기금보다 규제 운영이 복잡해질 수 있다고 지적함"}, {"d": 1, "t": "조사 기업들은 IMO 중앙관리기금의 운영 효율성에도 우려를 제기했으나, 개별 기업이 투자사업을 선정하는 방식 역시 자금 오용을 방지하기 위한 사업 선정·투자수익·환경적 효과 등에 대한 별도 검증이 필요하다고 설명함"}, {"d": 1, "t": "특히 단일 기금을 감독하는 대신 다수 기업이 투자사업을 개별적으로 검토해야 하므로, 대안적 이행방식이 기존 체계보다 행정절차를 단순화할 수 있는지는 불확실하다고 평가함"}, {"d": 0, "t": "GMF는 선주 주도의 개별 투자가 대체연료 생산에 필요한 자금을 분산시키고, 개발도상국에 대한 지원을 축소해 공정한 에너지 전환을 저해할 수 있다고 우려함"}, {"d": 1, "t": "조사 기업들은 대체연료 생산 확대의 주요 과제가 단순한 투자재원 확보보다 장기 구매계약(Offtake Agreement)을 통한 안정적인 수요 확보에 있다고 설명했으며, 초기에는 소수 생산사업에 자금을 집중하는 것이 상업적 공급망 구축에 도움이 될 수 있다고 분석함"}, {"d": 1, "t": "또한 선주들이 자국 시장이나 기존 항로 안정 사업을 선호할 경우, 아시아-유럽 및 아시아-북미 등 주요 항로에 투자가 집중되고 금융비용이 투자여력이 높은 저소득국은 지원에서 소외될 수 있다고 지적함"}]}]}, {"section": "국제해사동향", "title": "EU 이사회, 메탄 배출 규제 적용 1년 연기 추진", "source": "European Council, '26.11.06.", "category": "탈탄소", "relevance": "중", "brief": "중동 분쟁發 에너지시장 혼란 고려, EU 이사회가 원유·가스·석탄 수입 관련 메탄 배출 MRV 의무(2027→2028) 및 배출상한기준 적용(2028.8→2029.8)을 1년씩 연기하는 EC 개정안에 합의. 유럽의회와 조기 합의 추진, 최종 입법 완료는 아님.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "EU 이사회는 11월 6일 중동 분쟁에 따른 에너지 시장 혼란과 공급망 부담을 고려해 원유·천연가스·석탄 수입 관련 메탄 배출 규제의 일부 적용을 1년 연기하는 유럽연합 집행위원회(EC)의 개정안에 합의함"}, {"d": 1, "t": "EC는 10월 14일 에너지 공급망의 가격에 대한 부담을 완화하기 위해 메탄 규정 일부 조정을 개정안으로 제안했으며, EU 정상회의는 이를 환영한 바 있음"}, {"d": 1, "t": "아일랜드 기후·에너지·환경부 장관 다라 오브라이언(Darra }
function apply(){ const q=document.getElementById('q').value.trim().toLowerCase(); const c=catSel.value; const r=document.getElementById('rel').value; const m=monSel.value; let n=0;
 document.querySelectorAll('.item').forEach(el=>{ const ok=(!q||el.dataset.text.includes(q))&&(!c||el.dataset.cat===c)&&(!r||el.dataset.rel===r); el.classList.toggle('hidden',!ok); if(ok)n++; });
 document.querySelectorAll('.issue').forEach(el=>{ const vis=[...el.querySelectorAll('.item')].some(x=>!x.classList.contains('hidden')); const mok=!m||el.dataset.mon===m; el.classList.toggle('hidden',!(vis&&mok)); if(q||c||r) el.open=true; });
 document.querySelectorAll('#ovbody tr').forEach(tr=>{ const ok=(!q||tr.dataset.text.includes(q))&&(!c||tr.dataset.cat===c)&&(!r||tr.dataset.rel===r)&&(!m||tr.dataset.mon===m); tr.classList.toggle('hidden',!ok); });
 document.getElementById('cnt').textContent = n+'개 항목'; }
['q','cat','rel','mon'].forEach(id=>document.getElementById(id).addEventListener('input',apply)); apply();
function toggleOv(force){ const w=document.getElementById('ovbody-wrap'); const open = force===undefined ? w.classList.contains('hidden') : force; w.classList.toggle('hidden',!open); document.getElementById('ovarrow').textContent=open?'▲ 접기':'▼ 펼치기'; }
function gotoItem(uid){ const el=document.getElementById(uid); if(!el) return; el.classList.remove('hidden'); const det=el.closest('details'); det.classList.remove('hidden'); det.open=true;
 const body=el.querySelector('.card-body'); body.classList.remove('hidden'); el.querySelector('.itemhead .arrow').textContent='▲ 접기';
 el.scrollIntoView({behavior:'smooth',block:'start'}); el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'),1500); }
let allOpen=false; document.getElementById('expand').addEventListener('click',()=>{ allOpen=!allOpen; document.querySelectorAll('.issue').forEach(d=>d.open=allOpen); document.querySelectorAll('.item .card-body').forEach(b=>b.classList.toggle('hidden',!allOpen)); document.querySelectorAll('.itemhead .arrow').forEach(a=>a.textContent=allOpen?'▲ 접기':'▼ 본문'); document.getElementById('expand').textContent=allOpen?'모두 접기':'모두 펼치기'; });
</script></body></html>
