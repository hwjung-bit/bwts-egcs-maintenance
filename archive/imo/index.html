<script>
const DATA = [{"id": "26-29", "seq": 29, "issue_date": "2026-08-04", "posted": "2026-08-03", "board_no": 681, "url": "https://www.imokorea.org/board/board.asp?B_ID=Inter_Maritime&ty=view&page=1&bandstart=1&findtype=&findstr=&idx=5734&ii=681", "pdf": "(26-29호) IMO소식 및 국제해사동향.F.pdf", "pages": 8, "file": "2026/2026-08/IMO소식_26-29호_20260804.html", "items": [{"section": "IMO 소식", "title": "IMO, 해상연료 공급망 추적체계 전문가 워크숍 개최", "source": "IMO Media Centre, '26.7.24.", "category": "탈탄소", "relevance": "중", "brief": "7.15 Chain of Custody(물리적 분리·질량균형·Book&Claim) 워크숍. IMO LCA/SFCS 지침 개발에 반영.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "IMO는 MEPC 84의 요청에 따라 7월 15일 IMO 본부에서 대면·온라인 병행 방식으로 지속가능 해상연료 인증체계 마련을 위한 공급망 추적(Chain of Custody) 모델 전문가 워크숍을 개최함"}, {"d": 1, "t": "이번 워크숍은 공급망 추적 모델(물리적 분리, 질량균형, Book and Claim)에 대한 이해를 높이고 IMO 생애주기평가(LCA) 체계에 적용하는 방안을 논의하기 위해 마련됨"}, {"d": 0, "t": "IMO는 연료 공급망 전 과정의 추적성과 투명성 확보를 지속가능 해상연료 인증지침(SFCS, Sustainable Fuel Certification Scheme)의 핵심 원칙으로 제시함"}, {"d": 1, "t": "IMO LCA 체계는 지속가능 해상연료 인증체계 지침(SFCS) 개발을 포함하고 있으며, 연료의 Well-to-Tank(WtT) 온실가스 배출량 산정 시 공급망 추적체계를 반영해 연료의 지속가능성 특성을 검증하고 투명성을 확보하여 이중 계산을 방지하도록 규정하고 있음"}, {"d": 0, "t": "전문가들은 타 산업의 공급망 추적 운영 경험을 IMO 지침 개발에 활용할 필요성을 강조함"}, {"d": 1, "t": "참석 전문가들은 특히 질량균형(Mass Balance) 방식의 활용 경험과 제도 간 정합성 확보의 중요성을 공유했으며, 이번 워크숍에서 논의된 정보와 의견은 IMO LCA 지침과 지속가능 해상연료 인증체계 지침(SFCS)의 추가 개발에 활용될 예정이라고 설명함"}]}]}, {"section": "IMO 소식", "title": "제12차 IMO 협약이행 전문위원회(III 12) 주요 논의 결과", "source": "", "category": "PSC", "relevance": "상", "brief": "7.20~24 III 12: PSC 절차서에 28개 협약 개정 반영, HSSC 검사지침 개정안 MSC 112 승인 요청(도선사 승강장치 반영), ISM Code 이행지침 전면개정 CG(~'28), CI Code 개정 CG.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "2026년 7월 20일부터 24일까지 IMO 본부에서 제12차 IMO 협약이행 전문위원회(III 12)가 개최되었으며, 의제 목록과 주요 논의사항 및 결과는 아래와 같음"}, {"d": 0, "t": "의제: 1 의제의 채택 / 2 다른 IMO 회의의 결정사항 / 3 항만수용시설 부족에 관한 보고서의 검토 및 분석 / 4 MSI 보고서 분석에 따른 교훈 및 안전 문제 / 5 CI Code 및 이행 지침 검토 / 6 PSC 활동과 절차의 조화로운 시행 / 7 PSC 신입직 교육훈련 매뉴얼 개발 / 8 정보 분석을 통해 확인된 IMO 규정 이행 관련 문제 / 9 통합감사요약보고서 분석 / 10 HSSC 최신 검사 지침 / 11 III Code 관련 규정의 의무사항에 대한 개략적인 목록 / 12 ISM Code 이행 지침의 전면 개정 / 13 IMO의 안전, 보안 및 환경관련 협약 조항의 통일 해석 / 14 UN 과의 협력 - 소형어선 점검 지침 및 체크리스트 초안 검토 / 15 격년회의 및 차기회의 잠정의제 / 16 '27년 차기 의장 및 부의장 선출 / 17 기타사항 / 18 결과 보고"}, {"d": 0, "t": "〈의제 4. 해양사고 조사보고서 분석에 따른 교훈 및 안전 문제〉 전문위원회는 IMO 홈페이지에 해양사고 조사보고서 분석 결과의 공개를 결정하고, 고압식 실린더의 위험성을 알리기 위한 회람문서를 발행함. 또한 사고 분석 결과 및 예방 교훈의 가시성 향상과 접근성 제고를 위해, 주요 SNS(X, LinkedIn 등)로 공개 채널을 확대하기로 결정함"}, {"d": 1, "t": "향후 SNS 특성을 반영한 콘텐츠 형식 논의를 위한 회기간 실무작업반(CG) 개설 예정임"}, {"d": 0, "t": "〈의제 5. CI Code 및 이행 지침 검토〉 전문위원회는 해양사고 조사 규정(CI code) 개정을 위해 회기중 작업반에 이어 회기간 실무작업반(CG)을 개설하고 지속 논의를 결정함(우리나라, 호주 등 11개국 공동 제출 문서)"}, {"d": 1, "t": "* 중대 해양사고의 경우, 발생일로부터 12개월 이내 최종 조사보고서 미발행 시 예비보고서 발행 의무 및 매년 중간성명서(최종 조사보고서 발행 전까지) 발행 의무 신설 등"}, {"d": 0, "t": "〈의제 6. 항만국통제(PSC) 활동과 절차의 조화로운 시행〉 전문위원회는 선박의 기계설비 및 유지보수 점검에 대한 항만국통제관(PSCO) 지침서 개발 제안 관련, 추가 검토 필요성이 제기됨에 따라 CG를 개설하여 지속 논의하기로 결정함"}, {"d": 1, "t": "* 점검 절차 항목의 높은 기술적 구체성을 고려하여 지침보다 교육훈련 매뉴얼로 활용하는 것이 적합"}, {"d": 1, "t": "IMO PSC 절차서에 최근 국제협약 제·개정 사항(선박 검사 및 증서 조화규정(HSSC, Harmonized System of Survey and Certification)에 따른 검사지침(A.1207(34)), 밀폐공간 출입에 관한 개정 권고안(MSC.581(110)) 등 28개 협약)을 반영하기로 결정함"}, {"d": 0, "t": "〈의제 7. 신규 항만국통제관(PSCO) 교육훈련 매뉴얼 개발〉 중국이 제8차 III('22.7.)에서 제출한 '신규 PSCO 교육훈련 매뉴얼' 승인 계획이 결정되었으며, 지역별 항만국통제 협의체(PSC MoU)와 중국이 협력하여 제13차 III에 개정안 제출 예정임"}, {"d": 0, "t": "〈의제 9. 통합감사요약보고서 분석〉 전문위원회는 통합감사요약보고서('11~'24) 분석 결과에 대해 차기 위원회(MSC 112, MEPC 85) 검토 승인 및 이사회(C 139) 보고를 요청함"}, {"d": 1, "t": "* SOLAS·MARPOL·STCW 등 IMSAS(IMO Member States Audit Scheme) 주요 국제협약의 반복 지적사항은 각 회원국의 이행 집행체계 미흡이며, 특히 협약의 국내 법제화 지연이 근본 원인으로 도출됨"}, {"d": 1, "t": "IMSAS 반복 지적사항에 대한 교육 프로그램 마련 및 기술지원 필요성 검토를 TC 77에 회부할 예정"}, {"d": 1, "t": "우리나라가 제안한 결함 분류법의 대조표 마련, 회원국감사 1차·2차 주기 분석 방법론 개선(ITCP 새 테마 접근방식, 1차 주기 분석 데이터와 연속성 유지 등)을 사무국에 요청"}, {"d": 0, "t": "〈의제 10. 선박검사 및 증서 조화규정에 따른 검사지침 개정〉 선박검사 및 증서 조화규정(HSSC) 검사지침 개정안을 MSC 112에 승인 요청함"}, {"d": 1, "t": "'원격검사 체크리스트'(가능/조건부/불가로 가능여부 분류·판단) 신설은 CG에서 추가 검토"}, {"d": 1, "t": "'검사지침'에 도선사 승강장치 성능기준 개정사항(현장 통신수단 구비, 선원 친숙화 교육 등) 반영"}, {"d": 0, "t": "〈의제 12. ISM Code 이행 지침의 전면개정〉 ISM Code 이행지침 개정안의 주요 문구 및 개정범위에 대해 회기중 작업반에서 추가 검토 필요성이 제기됨에 따라 CG를 개설하여 지속 논의(~'28년)하기로 결정함"}, {"d": 0, "t": "〈의제 14. UN과 협력, 소형어선 점검 지침 및 체크리스트 초안 검토〉 12m 미만 소형어선 점검 지침을 확정하고 MSC 112에 승인 요청함"}, {"d": 1, "t": "* 케이프타운 협정(24미터 이상 어선 대상) 미적용 소형어선의 안전강화를 위해 UN FAO(유엔식량농업기구)와 IMO가 공동 개발한 자발적 점검 지침(권고사항)"}]}]}, {"section": "IMO 소식", "title": "IMO 공지", "source": "", "category": "IMO 공지", "relevance": "하", "brief": "ACT-BIOFOULING 참여국 모집(CL.5231)·2026 국제해사상 후보 추천(CL.5283)·WMU 석사과정 장학 추천(CL.5297), IMO 시상식 개최 안내(CL.5292), IMSAS 1주기 감사결과 공개(CL.5299)·MSW 실태조사 기한연장(CL.5243), 우크라이나·멕시코 항행제한 통보(CL.5304·5305), 런던협약·의정서 과학그룹 회의(LC/SG 50) 개최안내(CL.5298) 등 제26-40~43호 사무국·기타 공지.", "groups": [{"label": "", "bullets": []}, {"label": "회의 및 사무국 공지", "bullets": [{"d": 0, "t": "(사무국) 제5차 IMO GHG 연구 조정위원회 구성 안내 (CL.5247, '26.7.24.)"}, {"d": 1, "t": "IMO 사무총장은 MEPC 84 결정에 따라 제5차 IMO GHG 연구 수행을 총괄할 조정위원회(Steering Committee) 구성을 완료하고 회원국 명단을 회람함"}, {"d": 1, "t": "조정위원회는 배출량 모델링 전문가 추천 절차를 거쳐 대한민국을 포함한 아르헨티나, 캐나다, 칠레, 중국, 덴마크, 이집트, 핀란드, 네덜란드, 노르웨이, 사우디아라비아, 싱가포르, 남아프리카공화국, 튀르키예, UAE 및 영국 등 16개 회원국으로 구성됨"}, {"d": 1, "t": "MEPC 부의장인 싱가포르 Hanqiang Tan이 조정위원회 업무를 총괄하며, 동 조정위원회의 첫 회의는 '26.9월 원격회의 방식으로 개최될 예정임"}]}, {"label": "기타 공지", "bullets": [{"d": 0, "t": "(카자흐스탄) 흑해 민간선박 공격 관련 입장 통보 (CL.5249, '26.7.22.)"}, {"d": 1, "t": "카자흐스탄 정부가 흑해에서 카스피 송유관 컨소시엄(CPC)의 원유 수송에 종사하던 민간 선박에 대한 무인기(UAV) 공격을 규탄하는 공식 입장을 IMO에 제출하고 회원국 대상 회람을 요청함"}, {"d": 1, "t": "당국은 해당 공격이 국제무역과 에너지 공급망의 안정성을 훼손하는 행위라고 주장하며, 공격의 즉각 중단과 항행의 자유 및 국제법 준수, 국제 운송 물류 에너지 수송망의 안전 보장을 촉구함"}, {"d": 1, "t": "* Caspian Pipeline Consortium: 카자흐스탄산 원유를 흑해 연안 터미널까지 수송하는 국제 송유관 운영 컨소시엄"}]}]}, {"section": "국제해사동향", "title": "eLoran, GNSS 교란 대응 대안으로 제시", "source": "The Maritime Executive, '26.7.22.", "category": "항해·안전", "relevance": "중", "brief": "중동 해역 GNSS 재밍·스푸핑 빈발(MSC ANTONIA 좌초 등). eLoran(100kHz, ~10m 정확도) 보완항법 제안, IMO 성능기준 미비 지적.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "최근 GNSS 교란이 빈발하는 해역에서 eLoran을 상용의 해운 보완 항법체계로 활용할 필요성을 제기함"}, {"d": 1, "t": "Overlook Systems Technologies의 수석 시스템 엔지니어 Victor Tasiemski는 최근 페르시아만, 호르무즈 해협, 홍해 및 오만만에서 GNSS 재밍과 스푸핑이 지속적으로 발생하면서 상선의 위치·항법·시각(PNT) 기능이 영향을 받고 있다고 설명함"}, {"d": 1, "t": "또한 2025년 홍해에서 발생한 MSC ANTONIA호 좌초와 2025년 오만만에서 발생한 FRONT EAGLE호와 ADALYNN호 충돌 사례를 GNSS 교란과 관련된 사례로 소개함"}, {"d": 1, "t": "JMIC도 2025년 11월부터 2026년 4월까지 해당 해역의 전자기 간섭(EMI)과 해상사고를 지속적으로 모니터링하고 있다고 설명함"}, {"d": 1, "t": "* Enhanced Loran: 지상 송신국의 저주파 신호를 이용해 위치·항법·시각(PNT) 정보를 제공하는 항법체계로, GNSS 장애 발생 시 대체 또는 보완 수단으로 활용되는 기술임 / ** Joint Maritime Information Center: 중동 해역의 상선 대상 위협과 해상보안 정보를 수집·분석·공유하는 다국적 해양정보공유센터로, 연합해군사령부 등 국제 해양안보 협력체계와 연계해 운영됨"}, {"d": 0, "t": "IMO의 성능기준과 관련해서는 eLoran을 PNT 센서로 인정하고 있으나, 최신 운항환경을 반영한 성능기준은 아직 마련되지 않았다고 지적함"}, {"d": 1, "t": "현재 IMO의 GNSS 성능기준은 재밍과 스푸핑이 일반화되기 이전에 제정된 기준이며, eLoran 수신기에 대한 최신 성능기준도 마련되지 않았다고 설명함"}, {"d": 1, "t": "이에 따라 GNSS와 eLoran 수신기 모두에 대해 전파교란 환경을 반영한 새로운 성능기준 개발이 필요하다고 주장함"}, {"d": 0, "t": "국가별 차원에서는 영국, 사우디아라비아 등의 eLoran 인프라가 상용 해운의 보완 항법체계 구축에 활용될 수 있다고 설명함"}, {"d": 1, "t": "영국은 Chain Odyssey와 Urgent Compass 사업을 추진하고 IMO NCSR 13에 관련 정보를 제출했다고 소개함"}, {"d": 1, "t": "사우디아라비아는 4개의 eLoran 송신소를 운영하며 페르시아만, 홍해 및 오만만을 포괄하는 신호 제공 기반을 구축했다고 소개함"}, {"d": 0, "t": "기술적 측면에서는 eLoran이 기존 기술과 상용 장비를 활용해 단기간 내 상용 해운에 적용 가능한 보완 항법체계로 평가됨"}, {"d": 1, "t": "eLoran은 약 10m 이하의 위치 정확도를 제공하고 100kHz 저주파 신호를 이용해 GNSS보다 재밍과 스푸핑에 대한 저항성이 높은 특성을 갖는다고 설명함"}, {"d": 1, "t": "또한 상용 수신기가 이미 공급되고 있어 정부, 산업계 및 국제표준기구 간 협력을 통해 수개월 내 해운 분야에 상용으로 적용할 수 있다고 주장함"}]}]}, {"section": "국제해사동향", "title": "영국 CCS 사업, 해저 임대계약 체결", "source": "Offshore Energy, '26.7.27.", "category": "에너지", "relevance": "하", "brief": "Liverpool Bay CCS, 기존 석유가스 인프라 재활용 영국 최초 CCS. 1단계 연 450만톤→2030년 이후 1,000만톤, 2028년 주입 개시.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "영국 리버풀베이 CCS(Liverpool Bay CCS) 사업이 기존 석유·가스 인프라를 재활용하는 영국 최초의 탄소포집·저장(CCS) 사업으로 해저 임대계약을 체결함"}, {"d": 1, "t": "리버풀베이 CCS는 영국 해저 관리기관인 크라운 에스테이트(The Crown Estate)와 CO₂ 수송·저장 사업을 위한 해저 임대계약을 체결했으며, 기존 인프라를 재활용하는 영국 최초의 CCS 사업으로 추진됨"}, {"d": 1, "t": "* 영국 왕실 소유의 해저와 해상 부지를 관리하며 해상풍력, CCS 등 해양 개발사업의 임대계약을 담당하는 공공기관"}, {"d": 0, "t": "리버풀베이 CCS 사업은 기존 해양 인프라를 활용해 잉글랜드 북서부와 북웨일스 산업단지의 CO₂를 해상 저장소로 수송·저장할 계획임"}, {"d": 1, "t": "HyNet 클러스터의 핵심 기반시설로 운영되며, 잉글랜드 북서부와 북웨일스의 CO₂ 포집시설에서 회수된 CO₂를 신규 및 기존 인프라를 통해 고갈된 해상 천연가스 저류층에 영구 저장할 예정임"}, {"d": 1, "t": "또한 기존 파이프라인 75마일 이상, 해양구조물 3기 및 육상 처리시설을 재활용하고, 산업시설과 수송망을 연결하기 위해 신규 파이프라인 21마일을 추가 건설할 계획임"}, {"d": 1, "t": "* 영국 잉글랜드 북서부와 북웨일스를 대상으로 산업부문의 CCS와 저탄소 수소 생산을 통합 추진하는 탄소포집·활용·저장(CCUS) 산업클러스터임"}, {"d": 0, "t": "사업 1단계는 연간 450만 톤의 CO₂ 저장능력을 확보하고 2030년 이후 연간 1,000만 톤까지 확대를 목표로 하며 최초 CO₂ 주입은 HyNet 클러스터 일정에 맞춰 2028년 시작될 예정임"}, {"d": 1, "t": "사업 운영기간 동안 총 1억900만 톤의 CO₂를 저장할 것으로 예상되며, 건설 과정에서 약 2,000개의 일자리를 창출하고 약 20억 파운드 규모의 공급망 투자를 유도할 것으로 전망됨"}, {"d": 0, "t": "HyNet 클러스터는 2021년 영국 정부의 Track-1 CCUS 클러스터로 선정된 이후 사업 추진 절차를 단계적으로 진행하고 있음"}, {"d": 1, "t": "리버풀베이 CCS 사업은 2024년 8월 크라운 에스테이트로부터 임대계약 예정통지를 받은 뒤 2025년 4월 금융종결(Financial Close)을 완료했으며, 현재 건설 단계가 진행 중임"}, {"d": 1, "t": "또한 Saipem은 CO₂ 압축설비 EPC, Rosetti Marino는 저장 플랫폼 4기의 EPC, Corinth Pipeworks는 강관 공급, JDR Cable Systems는 약 100km 규모의 33kV 해저케이블 공급을 각각 수행할 예정임"}]}]}]}, {"id": "26-30", "seq": 30, "issue_date": "2026-08-11", "posted": "2026-08-10", "board_no": 682, "url": "https://www.imokorea.org/board/board.asp?B_ID=Inter_Maritime&ty=view&page=1&bandstart=1&findtype=&findstr=&idx=5735&ii=682", "pdf": "(26-30호) IMO소식 및 국제해사동향.F.pdf", "pages": 7, "file": "2026/2026-08/IMO소식_26-30호_20260811.html", "items": [{"section": "IMO 소식", "title": "IMO, 회원국 감사제도 1차 감사주기 완료", "source": "IMO Media Centre, '26.7.29.", "category": "IMO 제도", "relevance": "하", "brief": "IMSAS 1차 주기 168개국(94%) 완료. 2027.7월부터 개정 IMSAS·상시모니터링(ICMM) 기반 2차 주기 시행.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "IMO는 2016년 의무화된 회원국 감사제도(IMSAS)에 따라 168개 회원국에 대한 첫 번째 글로벌 감사를 완료했다고 발표함"}, {"d": 1, "t": "이번 감사는 회원국의 IMO 협약 이행 및 집행 상태를 평가하기 위해 실시됐으며, 전체 IMO 회원국의 약 94%가 감사를 받아 글로벌 해사 거버넌스에 대한 가장 광범위한 공동 평가 가운데 하나를 구성했다고 설명함"}, {"d": 1, "t": "* IMO Member State Audit Scheme: 회원국이 IMO 협약과 의무를 효과적으로 이행·집행하고 있는지를 평가하기 위해 시행되는 IMO의 의무 감사제도로, 2016년부터 모든 회원국을 대상으로 의무 적용되고 있음"}, {"d": 0, "t": "1차 감사 결과는 회원국의 협약 이행 취약 분야를 파악하고 기술협력 지원 방향을 설정하는 근거로 활용됨"}, {"d": 1, "t": "감사 결과, 시정조치계획(CAP)과 통합감사보고서(CASR) 분석을 통해 반복적으로 나타나는 문제와 근본 원인이 확인됐으며, IMO는 이를 바탕으로 회원국의 제도적 공백 해소와 시정조치 이행을 지원하는 맞춤형 기술협력을 추진할 계획이라고 설명함"}, {"d": 1, "t": "또한 IMSAS 결과는 IMO 역량개발전략(Capacity-Development Strategy)에 따른 주제별 기술협력사업 수립에도 활용될 예정임"}, {"d": 0, "t": "IMO는 2027년부터 위험기반·데이터 기반 접근을 강화한 제2차 감사주기를 시행할 예정임"}, {"d": 1, "t": "제2차 감사는 2027년 7월 개정된 IMSAS 체계와 절차에 따라 시작되며, 새로운 지속 모니터링 메커니즘(ICMM)을 도입해 상시 모니터링, 감사 우선순위 설정 및 감사 결과와 역량개발·기술협력 간 연계를 강화할 계획이라고 설명함"}, {"d": 1, "t": "* IMSAS Continuous Monitoring Mechanism: 제2차 IMSAS 감사주기부터 도입되는 상시 모니터링 체계로, 위험기반·데이터 기반 접근을 통해 감사 우선순위 설정과 기술협력 연계를 지원하는 제도임"}, {"d": 0, "t": "IMO는 회원국과 정부 지명 감사원의 참여가 제도운영의 핵심이라고 평가하며 감사원 후보 추천을 지속 요청함"}, {"d": 1, "t": "IMO는 첫 번째 감사주기 완료가 회원국의 IMO 협약 이행에 대한 지속적인 의지를 보여주는 사례라고 평가했으며, 특히 여성과 청년 전문가를 포함한 자격을 갖춘 감사원 후보를 지속적으로 추천해 줄 것을 회원국에 요청함"}]}]}, {"section": "IMO 소식", "title": "IMO 공지", "source": "", "category": "IMO 공지", "relevance": "하", "brief": "ACT-BIOFOULING 참여국 모집(CL.5231)·2026 국제해사상 후보 추천(CL.5283)·WMU 석사과정 장학 추천(CL.5297), IMO 시상식 개최 안내(CL.5292), IMSAS 1주기 감사결과 공개(CL.5299)·MSW 실태조사 기한연장(CL.5243), 우크라이나·멕시코 항행제한 통보(CL.5304·5305), 런던협약·의정서 과학그룹 회의(LC/SG 50) 개최안내(CL.5298) 등 제26-40~43호 사무국·기타 공지.", "groups": [{"label": "", "bullets": []}, {"label": "회의 및 사무국 공지", "bullets": [{"d": 0, "t": "(사무국) 제112차 해사안전위원회(MSC 112) 개최 안내 (CL.5240, '26.7.20.)"}, {"d": 1, "t": "제112차 해사안전위원회(MSC 112)가 '26.12.14.~18. 영국 런던 IMO 본부에서 하이브리드 방식으로 개최될 예정이며, SOLAS 비당사국도 강제협약 개정안 채택 심의에 참여하도록 초청함"}, {"d": 1, "t": "주요 의제로 SOLAS 협약, IGC Code, IGF Code 및 검사용 접근수단 기술규정 개정안 채택, 자율운항선박(MASS), 대체연료·신기술 선박 안전규제, 해사보안, 해적행위, 전문위원회 보고서 검토 등이 포함되며, MASS, 대체연료 안전규제, GBS, LSA Code 및 강제협약 개정 관련 작업반 구성이 검토될 예정임"}, {"d": 1, "t": "* Goal-Based Standards: 선박의 설계·건조 시 충족해야 할 목표기반 안전기준 / ** Life-Saving Appliances Code: 선박 구명설비의 성능 및 설치기준을 규정한 국제기준"}, {"d": 0, "t": "(사무국) 제13차 선박시스템·설비 전문위원회(SSE 13) 개최 안내 (CL.5229, '26.7.22.)"}, {"d": 1, "t": "제13차 선박시스템·설비 전문위원회(SSE 13)가 '27.3.15.~19. 영국 런던 IMO 본부에서 하이브리드 방식으로 개최될 예정임"}, {"d": 1, "t": "주요 의제로 SOLAS 제II-2장 및 LSA Code 개정, 대체연료·신기술 선박의 GHG 안전규제 개발, 신에너지 차량 운반선 화재위험 저감, 컨테이너선 화재 대응기준, 불소계 소화약제 사용 제한 및 LSA Code 점수복 성능기준 개정 등이 포함되며, 구명설비·화재방호·GHG 안전 분야 작업반 구성이 검토될 예정임"}, {"d": 0, "t": "(사무국) 제33차 ICAO/IMO 항공·해상 수색구조 공동작업반 개최 안내 (CL.5241, '26.7.27.)"}, {"d": 1, "t": "제33차 ICAO/IMO 항공·해상 수색구조 공동작업반(JWG 33) 회의가 '26.11.9.~13. 스웨덴 말뫼에서 영어 단일언어 대면 방식으로 개최될 예정이며, IMO와 ICAO 회원국의 수색·구조 전문가가 참석할 예정임"}, {"d": 1, "t": "주요 의제로 IAMSAR Manual 개정, 해상·항공 SAR 계획 및 절차 조화, 대량구조(Mass Rescue Operations), LRIT·GMDSS·GADSS 운영, RCC/RSC 운영기준, SAR 통신체계, 인력 교육훈련 및 국제 기술협력 등이 논의될 예정임"}, {"d": 1, "t": "* IAMSAR Manual: IMO·ICAO 공동 「국제 항공·해상 수색구조 매뉴얼」 / ** Global Aeronautical Distress and Safety System: 항공기 조난 추적 및 구조 지원을 위한 글로벌 항공안전통신체계 / *** Rescue Coordination Centre / Rescue Sub-Centre: 수색·구조조정센터 / 지역 수색·구조조정센터"}]}, {"label": "기타 공지", "bullets": [{"d": 0, "t": "(우크라이나) 흑해 러시아 항만 입출항 선박 관련 입장 통보 (CL.5252, '26.7.29.)"}, {"d": 1, "t": "우크라이나 정부가 러시아 항만을 오가는 외국 선박에 대한 위험과 관련한 외교부 성명을 IMO에 제출하고 회원국 등에 회람을 요청함"}, {"d": 1, "t": "당국은 러시아가 흑해 민간 화물선과 우크라이나 항만 기반시설을 공격하고 있으며, 러시아의 흑해 배타적경제수역 항행위험 경고가 러시아 항만 입출항 선박을 겨냥한 추가 도발을 시사할 수 있다고 주장함"}, {"d": 1, "t": "해운회사들이 흑해 러시아 항만 운항을 일시 중단할 것을 촉구하는 한편, 우크라이나는 유엔헌장 제51조에 따른 자위권을 행사하여 항만과 해상교통로를 보호할 것이라고 밝힘"}]}]}, {"section": "국제해사동향", "title": "ABS, 암모니아 연료 안전관리 통합 접근법 제시", "source": "The Maritime Executive, '25.7.31.", "category": "대체연료·안전", "relevance": "하", "brief": "ABS: STCW 개정·재교육, HAZID/HAZOP+CFD+에이전트 기반 확률 위험분석을 결합한 통합 안전관리 제안.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "미국선급협회(ABS)는 암모니아 연료의 안전한 도입을 위해 위험성 평가부터 비상대응까지 포괄하는 통합 안전관리체계의 필요성을 제시함"}, {"d": 1, "t": "ABS는 암모니아가 탄소를 배출하지 않는 연소 특성과 확장 가능성을 바탕으로 탄소중립 달성을 위한 유력한 연료로 평가받고 있으나, 독성·가연성·부식성과 같은 안전 문제를 해결하는 것이 상용화의 핵심 과제라고 설명함"}, {"d": 0, "t": "선원 교육과 국제기준 측면에서는 암모니아의 특성을 반영한 STCW 개정과 전문 교육체계 마련이 필요하다고 설명함"}, {"d": 1, "t": "현재 STCW 협약의 대체연료 교육기준이 LNG 운용 경험을 기반으로 마련돼 있어 암모니아의 독성, 재료 적합성 및 비상대응 절차를 충분히 반영하지 못한다고 설명함"}, {"d": 1, "t": "또한 기존 선원 역량만으로는 암모니아 연료의 고유 위험에 대응하기 어려워 포괄적인 재교육이 필요하다고 강조함"}, {"d": 0, "t": "기술적 측면에서는 HAZID·HAZOP과 CFD 시뮬레이션을 연계한 위험성 평가가 암모니아 안전관리의 핵심 수단으로 제시됨"}, {"d": 1, "t": "HAZID와 HAZOP을 통해 벙커링부터 기관실 비상상황까지 잠재 위험을 식별하고, CFD(전산유체역학) 시뮬레이션으로 암모니아 누출 확산과 증기구름 거동을 분석해 안전설계와 비상대응체계 수립에 활용할 수 있다고 설명함"}, {"d": 1, "t": "또한 실제 훈련은 비용과 안전성 한계가 있는 만큼 시뮬레이션 기술이 이를 효과적으로 보완할 수 있다고 평가함"}, {"d": 1, "t": "* Hazard Identification: 설계·운영 과정에서 발생 가능한 위험요인을 체계적으로 식별하는 위험성 평가기법 / ** Hazard and Operability Study: 설계 의도에서 벗어나는 운전 상태를 분석해 잠재적 위험과 운전성 문제를 평가하는 체계적 위험성 분석기법 / *** Computational Fluid Dynamics: 유체의 흐름과 가스 확산 등을 수치적으로 해석하는 전산유체역학 기법으로, 암모니아 누출 확산 및 비상상황 시뮬레이션에 활용"}, {"d": 0, "t": "ABS는 CFD와 에이전트 기반 위험분석을 결합한 통합 안전관리 접근법이 암모니아 연료의 안전성을 높일 수 있다고 설명함"}, {"d": 1, "t": "CFD 분석 결과와 HAZID·HAZOP 결과, 사람의 행동 특성을 결합한 에이전트 기반 확률론적 위험분석을 통해 다양한 누출 시나리오와 대피 과정을 모의할 수 있다고 설명함"}, {"d": 1, "t": "또한 환경 변화, 자원 가용성, 대응시간 등을 반영한 동적 위험평가를 통해 위험지역 식별, 대피절차 검증 및 비상대응 협력체계 개선이 가능하다고 소개함"}]}]}, {"section": "국제해사동향", "title": "컨테이너선 리튬이온 배터리 운송 규제 공백 지적", "source": "Lloyd's List, '26.7.31.", "category": "컨테이너 안전", "relevance": "상", "brief": "IMDG SP188 면제로 대량 리튬배터리 미신고 문제(노트북 4,200대=전기차 3~4대분). X-Press Godavari 사례. SP936 유사 중량기준 신고 의무화 제안 → 9월 CCC 12 논의.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "다수 회원국과 해운업계는 현행 IMDG Code 특별규정(SP188)의 규제 공백을 해소하기 위한 공동제안서를 IMO 화물 및 컨테이너 운송 전문위원회(CCC)에 제출함"}, {"d": 1, "t": "일정 용량 이하의 리튬이온 배터리는 시험 및 포장요건을 충족할 경우 운송인에 대한 위험물 신고가 면제되는 현행 SP188 규정의 개선 필요성을 제기함"}, {"d": 1, "t": "* Special Provision 188: IMDG Code 특별규정으로, 일정 와트시(Wh) 이하의 리튬이온 배터리가 시험 및 포장요건을 충족할 경우 위험물 신고 의무를 면제하는 규정"}, {"d": 0, "t": "현행 SP188 규정은 대량의 리튬이온 배터리가 적재되더라도 운송인에게 신고되지 않아 화재위험을 사전에 관리하기 어렵다는 지적이 제기됨"}, {"d": 1, "t": "99Wh 배터리가 장착된 노트북 4,200대를 적재한 40피트 컨테이너를 사례로 제시하며, 개별 제품은 SP188 적용 대상이지만 컨테이너 전체 배터리 용량은 전기차 3~4대 수준에 해당함에도 위험물 신고 대상이 아니라고 설명함"}, {"d": 1, "t": "이에 선사는 화재위험 평가, 적재계획 수립 및 비상대응 준비에 필요한 정보를 확보하기 어렵다고 설명함"}, {"d": 0, "t": "또한 X-Press Godavari호 화재를 SP188 규제 공백이 실제 사고로 이어질 수 있는 사례로 제시함"}, {"d": 1, "t": "2020년 벵골만에서 발생한 X-Press Godavari호 화재는 7톤 이상의 리튬이온 배터리가 적재됐음에도 SP188 적용으로 신고되지 않아 선원들이 약 90분간 화재 원인을 파악하지 못하였다고 설명함"}, {"d": 1, "t": "또한 Wan Hai 503호와 Maersk Frankfurt호 화재 사례도 언급하며 리튬이온 배터리 화재의 위험성을 강조함"}, {"d": 0, "t": "해당 제안서는 SP936과 유사한 중량 기준을 적용해 일정 중량 이상의 SP188 적용 리튬이온 배터리 화물도 위험물 신고 대상에 포함하는 방안을 제안하였으며, 이는 2026년 9월 제12차 CCC 회의에서 논의될 예정임"}, {"d": 1, "t": "* Special Provision 936: IMDG Code 특별규정으로, 일정 중량을 초과하는 리튬 배터리 화물에 대해 운송인에게 추가 정보를 제공하도록 하는 중량 기반 정보 제공을 규정"}]}]}]}, {"id": "26-31", "seq": 31, "issue_date": "2026-08-18", "posted": "2026-08-26", "board_no": 683, "url": "https://www.imokorea.org/board/board.asp?B_ID=Inter_Maritime&ty=view&page=1&bandstart=1&findtype=&findstr=&idx=5743&ii=683", "pdf": "(26-31호) IMO소식 및 국제해사동향.F.pdf", "pages": 7, "file": "2026/2026-08/IMO소식_26-31호_20260818.html", "items": [{"section": "IMO 소식", "title": "IMO, 항만국통제 데이터 공유체계 확대", "source": "IMO Media Centre, '26.8.4.", "category": "PSC", "relevance": "중", "brief": "7.21 흑해·카리브해 MoU와 데이터 교환협정 체결(총 8개 MoU). GISIS PSC 모듈·통합 DB(ODB)로 거의 실시간 검사정보 공유 추진.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "IMO는 7월 21일 전 세계 항만국통제(PSC) 검사정보 교환을 강화하기 위해 흑해 및 카리브해 PSC 양해각서(MoU)와 개정 데이터 교환협정을 체결함"}, {"d": 1, "t": "런던 IMO 본부에서 아르세니오 도밍게스 IMO 사무총장과 Onur Turhan 흑해 MoU 사무장, Jodi Munn Barrow 카리브해 MoU 사무장이 협정에 서명했으며, 이 협정에 따라 PSC 검사정보 교환 확대와 IMO 글로벌통합해운정보시스템(GISIS) 내 PSC 모듈의 지속적인 개발을 지원할 예정임"}, {"d": 0, "t": "이번 협정으로 IMO와 개정 데이터 교환협정을 체결한 지역 PSC는 총 8개로 확대됐으며, 추가 협정 체결을 위한 논의도 진행 중임"}, {"d": 1, "t": "IMO는 앞서 Abuja, Indian Ocean, Tokyo, Mediterranean, Paris 및 Riyadh MoU와 유사한 협정을 체결했으며, 현재 Viña del Mar Agreement 및 미국 해안경비대(USCG)와도 협의를 지속하고 있음"}, {"d": 0, "t": "개정된 협정을 통해 전 세계 PSC 검사자료를 보다 포괄적이고 일관되게 공유하기 위한 PSC 통합 데이터베이스(ODB) 구축 기반을 강화할 예정임"}, {"d": 1, "t": "IMO가 주도하는 ODB 사업은 지역 PSC 체제 간 검사정보를 거의 실시간으로 공유하고 검증된 검사자료의 투명성·일관성·데이터 무결성을 높이는 한편, 회원국의 중복 보고를 줄이고 위험기반 검사계획 수립과 IMO 협약의 효과적인 이행을 지원하는 것을 목표로 함"}, {"d": 1, "t": "* PSC Overarching Database(ODB): 지역별 PSC 검사정보를 통합해 거의 실시간으로 공유하고 위험기반 검사계획 등을 지원하기 위해 IMO가 개발 중인 통합 데이터베이스"}, {"d": 0, "t": "IMO는 확대된 데이터 공유를 통해 지역별 PSC 활동의 조화를 높이고 회원국의 국제 해사기준 이행에 대한 모니터링을 강화할 계획임"}, {"d": 1, "t": "PSC 체제는 자국 항만에 입항하는 외국적 선박이 국제적으로 합의된 안전·보안·환경기준을 준수하는지 검사하는 데 있음. IMO는 이번 협정으로 PSC 활동의 투명성과 조화를 높여 보다 안전하고 보안이 강화된 친환경 해운에 기여할 것으로 기대함"}]}]}, {"section": "IMO 소식", "title": "IMO 공지", "source": "", "category": "IMO 공지", "relevance": "하", "brief": "ACT-BIOFOULING 참여국 모집(CL.5231)·2026 국제해사상 후보 추천(CL.5283)·WMU 석사과정 장학 추천(CL.5297), IMO 시상식 개최 안내(CL.5292), IMSAS 1주기 감사결과 공개(CL.5299)·MSW 실태조사 기한연장(CL.5243), 우크라이나·멕시코 항행제한 통보(CL.5304·5305), 런던협약·의정서 과학그룹 회의(LC/SG 50) 개최안내(CL.5298) 등 제26-40~43호 사무국·기타 공지.", "groups": [{"label": "", "bullets": []}, {"label": "회의 및 사무국 공지", "bullets": [{"d": 0, "t": "(사무국) 제114차 법률위원회(LEG 114) 개최 안내 (CL.5212, '26.7.29.)"}, {"d": 1, "t": "제114차 법률위원회(LEG 114)가 '27.2.8.~12. 영국 런던 IMO 본부에서 대면회의를 기본으로 하이브리드 방식을 병행하여 개최될 예정이며, 참가자는 OMRS 등록과 별도의 신임장 제출 절차를 거쳐야 함"}, {"d": 1, "t": "주요 의제는 HNS 의정서 발효 촉진, 선원의 공정한 대우, 흑해 아조프해 상황, 선박의 사기등록 방지, 해적·무장강도, MASS 관련 법적 검토, 대체연료 기술의 책임체계 및 해사보안 위협 등임"}, {"d": 0, "t": "(사무국) 해상 단일창구(MSW) 이행 활용 실태조사 안내 (CL.5243, '26.7.30.)"}, {"d": 1, "t": "IMO 사무국은 제50차 간소화위원회(FAL 50) 결정에 따라 '26년 말까지 회원국 등의 해상 단일창구(MSW) 이행 활용 수준을 파악하기 위한 설문조사를 실시하며, '28년 후속조사를 통해 이행 추이와 해사 이해관계자의 행정부담 변화를 평가할 예정임"}, {"d": 1, "t": "설문은 해사당국, 항만당국, 세관, 선사, 대리점, 포워더, 터미널 운영자 등 MSW의 구축·운영·사용 경험이 있는 공공·민간 이해관계자를 대상으로 '26.10.31.까지 진행되며, 결과는 국가·이해관계자별 공통 과제와 우수사례 등을 분석하여 FAL 51에 제출될 예정임"}, {"d": 1, "t": "* Maritime Single Window: 선박 입출항에 필요한 정보를 하나의 전자창구를 통해 제출·처리할 수 있도록 하는 시스템"}]}, {"label": "기타 공지", "bullets": [{"d": 0, "t": "(우크라이나) 이란의 통보문 관련 입장 통보 (CL.5253, '26.8.7.)"}, {"d": 1, "t": "우크라이나 정부가 CL.5251로 회람된 이란 정부의 통보에 대한 입장을 IMO에 제출하고, 자국의 모든 군사행동은 러시아의 침략에 대응한 유엔헌장 제51조상 자위권 행사 범위에서 러시아의 군사행동 지원을 차단하기 위한 것이라고 주장함"}, {"d": 1, "t": "우크라이나는 이란이 러시아의 우크라이나 공격에 사용되는 무기 지원을 중단해야 하며, '26.7.12. GFS GALAXY호 및 '26.7.14. Mombasa호가 이란군의 공격으로 피해를 입었다고 언급하고 이란 측 통보문의 공격 관련 주장과 법적 규정에 동의하지 않는다는 입장을 밝힘"}]}]}, {"section": "국제해사동향", "title": "IMarEST, 탄소가격 없는 IMO 대안도 해운비용 상승 전망", "source": "Lloyd's List, '26.8.10.", "category": "탈탄소", "relevance": "상", "brief": "IMarEST 분석: NZF 4개 대안 모두 2050년까지 비용집약도 70~80% 상승. 현행 NZF가 평균 감축비용 최저, 투발루안(RU $300) 감축효과 최대, 라이베리아안은 가격변동성 확대.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "영국 해양공학·해양기술학회(IMarEST)의 연구에 따르면, 의무적 탄소가격제를 제외한 IMO 온실가스 규제안으로도 2050년까지 해운비용이 70~80% 증가할 수 있는 것으로 나타남"}, {"d": 1, "t": "연구는 현재 IMO 해양환경보호위원회(MEPC)에서 검토 중인 4개 안을 IMO 종합영향평가 방법론에 따라 비교했으며, 일본이 최근 제출한 다섯 번째 방안은 연구 제출시점 이후 제안돼 분석에서 제외됨"}, {"d": 1, "t": "* Institute of Marine Engineering, Science and Technology: 해양공학·해양과학·해양기술 분야의 전문가를 대표하는 영국 기반 전문기관"}, {"d": 1, "t": "** ① 현행 Net-Zero Framework(NZF), ② 브라질의 '초기 완화·후기 강화' 방안, ③ 투발루의 'NZF as levy' 방안, ④ 탄소가격을 제외한 라이베리아 방안 등"}, {"d": 0, "t": "분석 결과 투발루안은 온실가스 감축효과가 가장 크지만 비용도 가장 높았으며, 현행 NZF는 4개 방안 가운데 평균 탄소감축 비용이 가장 낮은 것으로 나타남"}, {"d": 1, "t": "투발루안은 Tier 1 Remedial Unit(RU) 가격을 현행 NZF의 tCO₂e당 100달러에서 300달러로 높여 2030년대 연간 최대 1,000억 달러의 수입을 창출할 수 있는 반면, 현행 NZF는 연간 약 120억 달러로 추산됨"}, {"d": 1, "t": "다만 현행 NZF의 비용 우위는 2038년 이전 바이오연료 가격이 크게 상승하지 않는다는 조건을 전제로 함"}, {"d": 0, "t": "탄소가격과 Net-Zero Fund를 모두 제외한 라이베리아안도 바이오연료 가격과 Surplus Unit(SU) 시장 여건에 따라 장기적으로 유사한 수준의 비용 상승이 발생할 수 있다고 분석됨"}, {"d": 1, "t": "본 연구는 정책안과 관계없이 2050년까지 비용집약도가 약 70~80% 증가할 수 있으며, 라이베리아안은 RU의 고정가격이 없어 SU 가격의 상한이 형성되지 않는 만큼 바이오연료가 부족할 경우 선주들이 SU에 더욱 의존하면서 가격 변동성이 크게 확대될 수 있다고 설명함"}, {"d": 0, "t": "라이베리아안은 연료의 탄소함량이 아닌 가격·가용성·확장성을 기준으로 감축목표 경로를 설정해 향후 비용과 감축수준의 예측이 상대적으로 어려운 것으로 평가됨"}, {"d": 1, "t": "가장 저렴한 적격 연료가 화석 LNG일 경우 GFI 목표가 완화돼 2050년 운송비용 상승률이 5~30%에 그칠 수 있을 것으로 예상함"}, {"d": 1, "t": "또한 의무적 금전적 제재 대신 규정을 준수하지 못한 선박의 적합증서를 취소하도록 해 SU 공급 부족 시 선박의 비용 부담이 커질 수 있다고 분석함"}, {"d": 0, "t": "또한 높은 탄소가격과 초기 재분배를 결합하는 방안이 친환경 e-fuel 투자를 촉진할 수 있다고 제시함. 참고로 IMO는 오는 9월 회기간 작업반에서 각 규제 대안을 논의할 예정임"}, {"d": 1, "t": "본 연구에서는 미국과 사우디아라비아 등 산유국이 제기한 각 규제안의 세계무역 비용 관련 주장에 이의를 제기하면서 초기 재분배를 수반한 높은 탄소가격을 지지함"}]}]}, {"section": "국제해사동향", "title": "한국, 첫 북극항로 컨테이너 시범운항 추진", "source": "Lloyd's List, '26.8.10.", "category": "항로·물류", "relevance": "중", "brief": "Panstar Acro(2,758TEU, ex-HMM Mombasa) 8.22 부산 출항→약 18일 후 Felixstowe. 정부 실증사업, KR 극지선박 인증. 운임 FEU당 약 $9,000.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "대한민국은 홍해 사태 등 기존 해상물류 경로의 위험에 대응하기 위한 대안으로 정부 지원 아래 첫 북극항로 컨테이너선 시범운항을 추진함"}, {"d": 1, "t": "부산 소재 Panstar Group의 2,758TEU급 Panstar Acro호는 8월 22일 부산을 출항해 러시아 북극 연안을 거쳐 약 18일 후 영국 Felixstowe에 도착한 뒤 Rotterdam, Hamburg, Gdansk를 순차 기항할 예정이며, 자동차 부품·합성수지·K-뷰티 제품 등을 운송할 계획임"}, {"d": 1, "t": "일본 화물은 도쿄, 요코하마, 나고야, 오사카, 고베에서 피더선으로 집하해 부산에서 합적할 예정임"}, {"d": 0, "t": "이번 시범운항은 북극항로의 상업성과 운항 안전성을 검증하기 위한 정부 실증사업으로, Panstar가 지난 5월 입찰을 통해 사업자로 선정됨"}, {"d": 1, "t": "정부는 8~9월의 제한된 북극항로 운항 가능기간에 통항할 수 있는 3,000TEU급 선박과 극지선박 인증을 사업 요건으로 제시하였음"}, {"d": 1, "t": "Panstar는 사업 일정에 맞추기 위해 기존 HMM Mombasa호였던 Panstar Acro호를 인수해 북극 운항을 위한 개조와 한국선급의 극지선박 인증을 추진 중이며, 약 20명의 승무원 중 최소 1명은 극지항해 경험이 있는 사관으로 구성할 예정임"}, {"d": 0, "t": "북극항로는 아시아-유럽 간 운송기간을 단축할 수 있는 대안으로 주목받고 있으며, 중국 Sea Legend Shipping도 올해 북극항로 정기운항을 확대하고 있음"}, {"d": 1, "t": "북극항로 운송기간은 약 20일로 수에즈운하 경유 약 40일, 희망봉 우회 최대 50일보다 짧으며, 중국 Sea Legend는 지난해 시범운항 이후 올해 8~10월 7척을 투입해 8회의 고정 운항을 계획하고 있음"}, {"d": 1, "t": "다만 운임은 FEU당 약 9,000달러(한화 약 13백만원)로 벙커링 일반 해상운임의 약 2배 수준임"}, {"d": 0, "t": "Panstar는 북극항로 개발을 민간기업만의 사업이 아닌 국가 차원의 과제로 보고 부산을 북극항로 거점으로 육성할 수 있다는 입장을 제시함"}, {"d": 1, "t": "김현겸 Panstar Group 회장은 호르무즈 해협과 홍해·수에즈운하의 상황 악화가 해운뿐만 아니라 제조업 국가 물류망·에너지 안보에도 영향을 줄 수 있다며 수출 중심의 산업을 가진 한국의 경우 대체경로 확보가 시급하다고 시사함"}, {"d": 1, "t": "또한 부산·울산·경남의 조선·항만·해운 역량을 활용해 부산이 선박 정비, 친환경 연료 공급, 해운금융 및 해사법률 서비스를 제공하는 북극항로 허브가 될 수 있다고 설명함"}, {"d": 0, "t": "다만 북극항로는 러시아 연안을 따라 운항하며 러시아의 쇄빙선·도선·항만 지원이 필요해 우크라이나 전쟁과 국제제재에 따른 지정학적 문제가 남아 있음"}, {"d": 1, "t": "이와 함께 현재 북극항로 투입선박은 남방항로의 2만TEU 이상 대형 컨테이너선보다 훨씬 작아 계절적으로 제한된 틈새항로에 머물고 있다고 평가함"}]}]}]}, {"id": "26-32", "seq": 32, "issue_date": "2026-08-24", "posted": "2026-08-26", "board_no": 684, "url": "https://www.imokorea.org/board/board.asp?B_ID=Inter_Maritime&ty=view&page=1&bandstart=1&findtype=&findstr=&idx=5744&ii=684", "pdf": "(26-32호) IMO소식 및 국제해사동향.F.pdf", "pages": 5, "file": "2026/2026-08/IMO소식_26-32호_20260824.html", "items": [{"section": "IMO 소식", "title": "IMO, 카리브해 선원 대상 대체연료 교육역량 강화", "source": "IMO Media Centre, '26.8.14.", "category": "대체연료·안전", "relevance": "하", "brief": "8.3~7 트리니다드토바고 세미나. MSC 111 승인 메탄올(STCW.7/Circ.26)·암모니아(Circ.27) 선원교육 임시지침 반영.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "IMO는 대체연료 및 신기술 사용 선박의 안전운항에 필요한 선원 교육역량 강화를 위해 8월 3~7일 트리니다드토바고 포트오브스페인에서 카리브해 지역 세미나를 개최함"}, {"d": 1, "t": "MTCC Caribbean과 트리니다드토바고 대학교(UTT)가 주최한 이번 세미나에는 정책담당자, 해사교육·훈련기관 및 업계 관계자 등이 참여해 암모니아·메탄올 수소의 특성, 위험요소, 취급·벙커링 및 비상대응 등에 대한 교육과 실습을 진행함"}, {"d": 0, "t": "IMO는 메탄올·암모니아 연료 선박의 선원교육 임시지침을 실제 역량기반 교육과정에 반영할 수 있도록 해사 교육자와 훈련교관의 전문성 강화를 지원함"}, {"d": 1, "t": "참가자들은 시나리오 기반 훈련과 마이크로 티칭(micro-teaching)을 수행하고, Yara TRINGEN Complex를 방문해 개인보호장비(PPE) 사용과 암모니아 비상대응을 실습하는 한편 Proman으로부터 메탄올 생산·선박연료 활용 사례를 공유받음"}, {"d": 1, "t": "* 2026년 5월 MSC 111에서 승인된 메틸·에틸알코올 연료 선박(STCW.7/Circ.26) 및 암모니아 연료 선박(STCW.7/Circ.27)의 선원교육에 관한 임시지침"}, {"d": 0, "t": "IMO는 세계해사대학교(WMU)와 공동으로 추진 중인 대체연료·신기술 선박 선원교육 프로젝트를 통해 회원국의 해사 에너지 전환 대응역량 강화를 지속 지원할 계획임"}]}]}, {"section": "IMO 소식", "title": "IMO 공지", "source": "", "category": "IMO 공지", "relevance": "하", "brief": "ACT-BIOFOULING 참여국 모집(CL.5231)·2026 국제해사상 후보 추천(CL.5283)·WMU 석사과정 장학 추천(CL.5297), IMO 시상식 개최 안내(CL.5292), IMSAS 1주기 감사결과 공개(CL.5299)·MSW 실태조사 기한연장(CL.5243), 우크라이나·멕시코 항행제한 통보(CL.5304·5305), 런던협약·의정서 과학그룹 회의(LC/SG 50) 개최안내(CL.5298) 등 제26-40~43호 사무국·기타 공지.", "groups": [{"label": "", "bullets": []}, {"label": "회의 및 사무국 공지", "bullets": [{"d": 0, "t": "(사무국) 암모니아 해상연료 기술세미나 프로그램 안내 (CL.5189/Add.1, '26.8.12.)"}, {"d": 1, "t": "사무국이 '26.9.17. IMO 본부에서 Future Fuels and Technologies Project 주관으로 개최되는 암모니아 해상연료 기술세미나의 세부 프로그램을 확정 회람함"}, {"d": 1, "t": "세미나는 암모니아 생산·공급 및 벙커링 인프라, 암모니아 추진 선박 엔진 기술과 인증, 운항 환경 안전 등 3개 세션으로 구성되며, 한국선급(KR)은 암모니아 연료 선박에서 발생하는 암모니아 유출수 처리 관련 규제 및 기술적 고려사항을 발표할 예정임"}]}, {"label": "기타 공지", "bullets": [{"d": 0, "t": "(러시아) 우크라이나의 자국 컨테이너선 공격 관련 입장 통보 (CL.5258, '26.8.18.)"}, {"d": 1, "t": "러시아 정부는 '26.8.1. 밤 흑해 노보로시스크에서 약 130해리 떨어진 해상에서 인도발 노보로시스크행 러시아 국적 컨테이너선 YANINA호가 우크라이나군의 무인수상정(USV) 2척의 공격을 받아 치명적인 손상을 입고 침몰했다고 주장하는 문서를 IMO에 제출하고 회원국 대상 회람을 요청함"}, {"d": 1, "t": "러시아는 동 선박이 FESCO 소속으로 냉동식품·건설자재 등 민간 화물만을 운송하고 있었다고 주장함. 이와 함께 사고 이후 이집트 국적 선장이 지휘한 DELPHINUS호와 러시아 흑해함대 해군항공대의 구조로 선원 17명 전원이 구조되었다고 알림"}, {"d": 1, "t": "당국은 IMO와 회원국에 민간선박에 대한 무력공격이 국제항행 안전을 저해하는 행위라는 점을 고려해 적절한 법적 평가를 내려줄 것을 촉구함"}]}]}, {"section": "국제해사동향", "title": "FuelEU 풀링 활성화, 친환경 연료 투자유인 약화 우려", "source": "Lloyd's List, '26.8.14.", "category": "탈탄소", "relevance": "상", "brief": "FuelEU 첫해 90% 이상 풀링으로 준수, 잉여 크레딧 가격 하락(~200유로/tCO₂e 이하). 2030년 6%·2035년 14.5% 강화 시 크레딧 소진·바이오연료 부족 전망.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "FuelEU Maritime 시행 첫해에 선박의 90% 이상이 풀링(pooling)을 통해 규제 의무를 충족한 가운데, 규제준수 자문업계는 저탄소 LNG 선박의 잉여 크레딧 공급으로 가격이 낮게 형성되면서 친환경 연료 생산투자를 촉진하기 어려울 수 있다고 지적함"}, {"d": 1, "t": "Maersk Mc-Kinney Moller Center for Zero-Carbon Shipping에 따르면 잉여 크레딧 가격은 2025년 CO₂ 환산톤당 약 200유로 수준에서 최근 더 하락했으며, 첫해 선박의 2%는 차입(borrowing), 7%는 연료 전환 또는 벌금 납부 방식으로 규제를 준수함"}, {"d": 1, "t": "* 2025년 1월부터 시행된 EU 기항 선박이 사용하는 에너지의 온실가스 집약도 단계적 감축을 위한 EU 규제"}, {"d": 1, "t": "** FuelEU Maritime 목표를 초과 달성한 선박의 잉여 규제준수 실적을 다른 선박과 합산하여 하나의 풀 단위로 규제 의무를 충족할 수 있도록 하는 유연성 제도"}, {"d": 0, "t": "규제준수 자문업계는 풀링이 선박의 FuelEU 의무 이행에는 효과적으로 작동하고 있으나, 낮은 크레딧 가격이 향후 e-메탄올 등 친환경 연료 생산 확대에 필요한 투자 유인을 충분히 제공하지 못할 수 있다고 지적함"}, {"d": 1, "t": "톤당 1,300달러 수준의 e-메탄올 생산투자를 뒷받침하려면 FuelEU Maritime 규제준수 가격이 현재의 약 2배 수준이어야 하며, e-연료 생산시설 건설을 위해 통상 10~15년의 장기 구매계약(offtake agreement)을 필요로 해 현재 가격 수준에서는 신규 생산능력 확보가 어려울 수 있다는 의견이 제기됨"}, {"d": 1, "t": "* 생산시설 건설에 앞서 향후 생산될 연료를 일정 기간 구매하기로 체결하는 계약으로, 본 기사에서는 e-연료 생산시설에 통상 10~15년의 계약이 필요하다고 설명함"}, {"d": 0, "t": "FuelEU Maritime의 온실가스 집약도 감축목표가 2030년부터 강화될 경우 현재 시장에 공급되는 잉여 크레딧이 줄어들면서 바이오연료 및 e-연료 확보가 어려워질 수 있다는 전망도 제기됨"}, {"d": 1, "t": "FuelEU Maritime은 선박연료의 온실가스 집약도를 2029년까지 2%, 2030년부터 6%, 2035년부터 14.5%, 2050년까지 80% 감축하도록 하고 있어, 2031년경부터 바이오연료 수요가 급증하고 2035년에는 현재와 같은 풀링 시장이 사라질 수 있다고 전망함"}, {"d": 1, "t": "특히 항공·도로 부문과 해운이 동시에 바이오연료를 필요로 할 경우 공급이 선박 수요를 충족하기 어려울 수 있으며, 이후 e-연료 수요가 증가하더라도 앞선 투자 부족으로 충분한 생산능력이 확보되지 않을 가능성이 제기됨"}, {"d": 0, "t": "현재 풀링을 통한 규제준수가 원활하게 이뤄지고 있는 것과 별개로, 향후 강화되는 FuelEU Maritime 목표에 대비한 친환경 연료 조달 및 생산투자가 필요하다는 자문업계의 우려가 제시됨"}, {"d": 1, "t": "해운 배출규제 자문사인 Hecla Emissions Management는 현 단계에서 상당한 잉여 크레딧이 존재하는 만큼 향후 바이오연료 규제준수를 위해 보다 발전된 조달·위험관리 전략이 필요하다고 설명했으며, 공급 부족 시 지속가능하지 않은 바이오연료가 친환경 연료로 판매되는 부정행위 가능성도 제기됨"}, {"d": 1, "t": "다만 일부 e-연료 프로젝트는 이미 해운 분야의 장기 구매계약을 확보하고 있으며, e-연료 생산업체들은 FuelEU Maritime이 사업 추진의 주요 사항 중 하나라고 평가하고 있음"}]}]}, {"section": "국제해사동향", "title": "BV, 드론·AI 활용 선박검사 확대", "source": "Lloyd's List, '26.7.17.", "category": "디지털·검사", "relevance": "중", "brief": "BV 드론+LiDAR+AI 검사 확대. 밀폐공간 진입 60~70% 감소, AGS 3D로 검사기간 42%·비용 50% 절감. SMARTship 검증계약 300건 초과.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "프랑스 선급 Bureau Veritas(BV)는 기존 선박검사의 안전성과 효율성을 높이기 위해 드론과 인공지능(AI)을 활용한 새로운 검사방식을 확대하고 있음"}, {"d": 1, "t": "기존에는 검사원이 선박 평형수 탱크, 화물창 등 위험한 밀폐공간에 직접 진입해 검사했으나, BV는 고해상도 카메라와 LiDAR 센서를 장착한 드론으로 검사하고 AI 분석 후 검사원이 최종 검증하는 방식을 적용함"}, {"d": 0, "t": "BV는 드론 기반 검사를 통해 검사원의 위험구역 진입을 줄이는 동시에 검사 준비와 선박 운항 중단에 필요한 시간·비용도 절감할 수 있다고 설명함"}, {"d": 1, "t": "해당 방식은 밀폐공간에 사람이 직접 진입하는 횟수를 60~70% 줄이고, 로프 등을 이용한 접근 필요성도 낮출 수 있음"}, {"d": 1, "t": "또한 검사자료를 신속하고 표준화된 형태로 확보해 선박 정비계획을 조기에 수립하고, 검사에 따른 운항중단 기간을 줄일 수 있다고 설명함"}, {"d": 0, "t": "BV는 드론 검사자료를 3차원 선박모델과 결합해 부식·균열 등 선체 상태를 지속적으로 확인·관리하는 디지털 검사기술도 적용하고 있음"}, {"d": 1, "t": "'AGS 3D'는 AI가 드론 영상과 LiDAR 자료에서 구조적 이상을 찾아내고 이를 3차원 모델에 표시해 검사 시기별 선체 상태를 비교·추적할 수 있도록 함"}, {"d": 1, "t": "초기 적용 결과 기존 로프 비계 방식보다 검사 소요기간은 42%, 검사비용은 50%, 현장 자원인력은 90% 감소한 것으로 나타남"}, {"d": 1, "t": "* Augmented Surveyor 3D: 드론으로 수집한 검사자료를 AI로 분석하고 3차원 선박모델에 표시해 선체 상태를 비교·관리하는 BV의 디지털 검사기술"}, {"d": 0, "t": "BV는 선박검사뿐 아니라 실제 운항에 사용되는 디지털 시스템과 데이터의 신뢰성을 확인하는 검증서비스도 운영하고 있음"}, {"d": 1, "t": "'SMARTship'은 기관 유지보수, 선체 상태, 에너지효율 및 항해지원 등에 활용되는 디지털 시스템을 검증하는 서비스로, 관련 계약은 최근 2년간 3배 증가해 300건을 넘어섬"}]}]}]}, {"id": "26-33", "seq": 33, "issue_date": "2026-09-01", "posted": "2026-09-01", "board_no": 685, "url": "https://www.imokorea.org/board/board.asp?B_ID=Inter_Maritime&ty=view&page=1&bandstart=1&findtype=&findstr=&idx=5745&ii=685", "pdf": "(26-33호) IMO소식 및 국제해사동향.F.pdf", "pages": 4, "file": "2026/2026-09/IMO소식_26-33호_20260901.html", "items": [{"section": "IMO 소식", "title": "IMO, 아덴만 해적행위 재확산에 긴급 대응 촉구", "source": "IMO Media Centre, '26.8.24.", "category": "해사보안", "relevance": "중", "brief": "8.20 SEAMULL호 추가 피랍, 현재 6척·90명 이상 억류. 기국·연안국에 BMP 및 IMO 지침 이행 강조.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "국제해사기구(IMO)는 최근 아덴만에서 해적사건이 증가하는 가운데 8월 20일 SEAMULL호가 추가 피랍되면서, 현재 6척의 선박과 90명 이상의 선원이 해적 및 무장강도에 억류돼 있다고 밝힘"}, {"d": 1, "t": "아르세니오 도밍게스 IMO 사무총장은 억류 선원들이 식량·식수·의료지원 등 필수 서비스가 제한된 상황에서 지속적인 불확실성과 위협에 노출돼 있다며, 모든 선원의 즉각적이고 조건 없는 석방을 촉구함"}, {"d": 0, "t": "IMO 사무총장은 아덴만 및 인근 해역의 해적행위 재확산에 대한 국제사회의 긴급한 대응과 선박 및 선원의 보안 강화를 요청함"}, {"d": 1, "t": "특히 기국과 연안국에 선박이 보안위협에 충분히 대비하고 선원이 피랍 수 있는 위험에 노출되지 않도록 조치할 것을 요청했으며, 업계 모범관리지침 및 관련 IMO 지침의 이행을 강조함"}, {"d": 0, "t": "IMO는 연안국이 주도하는 역내 해적 대응을 지원하는 한편, 상선과 선원 보호를 위한 국제 해군 간 협력이 지속돼야 한다고 강조함"}, {"d": 1, "t": "IMO는 지부티 행동규약(Djibouti Code of Conduct)과 제다 개정서(Jeddah Amendment)를 통한 역내 대응을 계속 지원하고, UN 체계와 각국 정부 및 이해관계자들과 해사보안 강화 방안을 협의할 계획이라고 밝힘"}]}]}, {"section": "IMO 소식", "title": "IMO 공지", "source": "", "category": "IMO 공지", "relevance": "하", "brief": "ACT-BIOFOULING 참여국 모집(CL.5231)·2026 국제해사상 후보 추천(CL.5283)·WMU 석사과정 장학 추천(CL.5297), IMO 시상식 개최 안내(CL.5292), IMSAS 1주기 감사결과 공개(CL.5299)·MSW 실태조사 기한연장(CL.5243), 우크라이나·멕시코 항행제한 통보(CL.5304·5305), 런던협약·의정서 과학그룹 회의(LC/SG 50) 개최안내(CL.5298) 등 제26-40~43호 사무국·기타 공지.", "groups": [{"label": "", "bullets": []}, {"label": "기타 공지", "bullets": [{"d": 0, "t": "(키르기스스탄) 자국 국기 무단 사용 관련 통보 (CL.5259, '26.8.18.)"}, {"d": 1, "t": "키르기스스탄 정부는 국내외 개인 법인에 자국 국기를 사용하는 선박의 등록·운항 권한을 부여한 사실이 없으며, 관계 당국의 공식 승인 없는 선박 등록·운항 및 국기 게양은 무단 사용에 해당한다고 IMO에 통보함"}, {"d": 1, "t": "키르기스스탄은 자국 국기의 불법 사용 방지를 위해 동 사실을 회원국 등에 회람해 줄 것을 요청하고, Maritime Register LLC의 자국 내 법인 등록 및 대표자 권한을 확인하는 관련 자료를 함께 제출함"}, {"d": 0, "t": "(우크라이나) 러시아의 흑해 상선·항만 공격 관련 입장 통보 (CL.5260, '26.8.19.)"}, {"d": 1, "t": "우크라이나 정부는 '26.7월~8월 초 러시아가 우크라이나 항만을 입출항하는 선박 52척을 공격했으며, 이 중 라이베리아·마셜제도·파나마·싱가포르 등 외국 국적 상선 39척과 수색·구조선 2척이 포함됐다고 주장함"}, {"d": 1, "t": "우크라이나는 동 공격으로 선원 항만근로자 사상 및 선박 피해가 발생했으며, '22.2.24. 이후 항만시설 1,090개소와 상선 262척이 손상 또는 일부 파괴되고 민간인 329명이 사상했다고 주장함"}, {"d": 1, "t": "우크라이나는 러시아의 공격이 임시 해상회랑(Temporary Maritime Corridor) 운영과 흑해 항행안전 및 국제 식량공급을 위협한다고 주장하며, 회원국에 러시아의 국제해사법 위반에 대한 책임 추궁과 IMO 의사결정기구 선출 방지를 요청함"}]}]}, {"section": "국제해사동향", "title": "영국, 가스 공급 안정 위해 FSRU 도입 재검토", "source": "TradeWinds, '26.8.24.", "category": "에너지", "relevance": "하", "brief": "영국 정부, 2030~2050 가스 수급 안정 위해 FSRU·전략 저장시설 도입 검토(민간주도 vs 정부직접 모델 추가 검토).", "groups": [{"label": "", "bullets": [{"d": 0, "t": "영국 정부는 천연가스 저장능력과 공급 안정성을 강화하기 위한 방안으로 부유식 LNG 저장·재기화설비(FSRU) 도입과 전략적 가스저장시설 확충을 검토하고 있음"}, {"d": 1, "t": "영국 에너지안보·넷제로부는 중간 검토결과를 알리면서 영국 가스 공급망에 추가 공급능력을 확보하는 방안으로 FSRU와 전략적 가스저장시설을 검토했다고 밝힘"}, {"d": 1, "t": "정부는 두 방안 모두 향후 25년 동안 수십억 파운드 규모의 비용이 발생할 가능성이 있다며, 민간이 관련 자산을 시장에 도입하도록 정부가 지원할지 또는 정부가 직접 사업을 추진할 필요가 있는지를 검토 중이라고 설명함"}, {"d": 1, "t": "* FSRU(Floating Storage and Regasification Unit): LNG를 선박 형태의 설비에 저장한 후, 다시 기체 상태의 천연가스로 변환해 육상 가스망으로 공급하는 시설"}, {"d": 0, "t": "영국은 FSRU가 가스 공급경로를 다양화하고 비상상황에서 추가적인 공급 유연성을 제공해 가스 시스템의 회복력을 높일 수 있다고 평가함"}, {"d": 1, "t": "다만 정부 협의에 참여한 응답자들은 FSRU의 효과가 설치 위치와 영국 가스망(National Transmission System)과의 연결성, 실제 운영모델 등에 따라 크게 달라질 수 있다고 지적함"}, {"d": 1, "t": "이에 따라 정부는 FSRU 또는 전략적 가스저장시설을 어떤 방식으로 도입할지와 관련해, 정부 인센티브를 통한 민간 주도 방식과 정부 직접 추진 방식 가운데 적절한 사업모델을 추가 검토할 예정임"}, {"d": 0, "t": "영국은 과거에도 FSRU 도입을 추진한 바 있으며, 최근에도 민간기업을 중심으로 스코틀랜드 지역의 FSRU 터미널 개발계획이 제시된 바 있음"}, {"d": 1, "t": "2009년 당시 Höegh LNG는 영국 서부 Barrow-in-Furness 인근 Morecambe Bay에 FSRU를 설치하는 'Port Meridian' 프로젝트의 인허가를 추진했으나, 이후 사업권이 매각되면서 실제 사업으로 이어지지는 못함"}, {"d": 1, "t": "2024년에는 미국 상장기업 Crown LNG가 스코틀랜드 Grangemouth 인근 Firth of Forth에 FSRU 터미널을 설치하는 계획을 추진한다고 밝힌 바 있어, 영국 내 부유식 LNG 수입설비 도입 논의가 반복적으로 제기돼 왔음"}, {"d": 0, "t": "이번 검토는 북해 가스 생산 감소와 낮은 국내 저장능력 속에서 2030~2050년 영국의 중장기 천연가스 수급 안정성을 점검하기 위한 정부 협의절차의 일환으로 진행됨"}, {"d": 1, "t": "영국 정부는 2025년 11월 26일부터 2026년 2월 18일까지 가스 공급안보에 관한 의견수렴을 진행했으며, 인프라 운영자·업계 전문가·기관 및 일반 국민 등으로부터 총 115건의 의견을 접수해 향후 가스 수요·공급 시나리오를 검토함"}, {"d": 1, "t": "영국은 북해 가스 매장량 감소로 2004년부터 천연가스 순수입국으로 전환했으며, 다른 국가들과 비교해 가스 저장능력이 상대적으로 부족한 것으로 알려져 있음"}]}]}]}, {"id": "26-34", "seq": 34, "issue_date": "2026-09-07", "posted": "2026-09-07", "board_no": 686, "url": "https://www.imokorea.org/board/board.asp?B_ID=Inter_Maritime&ty=view&page=1&bandstart=1&findtype=&findstr=&idx=5747&ii=686", "pdf": "(26-34호) IMO소식 및 국제해사동향.F.pdf", "pages": 6, "file": "2026/2026-09/IMO소식_26-34호_20260907.html", "items": [{"section": "IMO 소식", "title": "IMO 사무총장, 호르무즈 해협 항행 자유 회복 위한 협력 촉구", "source": "IMO Media Centre, '26.8.28.", "category": "해사보안", "relevance": "중", "brief": "호르무즈 사태 6개월 경과, 공격 70건·선원 19명 사망, 최대 400척·6,000명 미출항. IMO 이사회 결의(7월) 상기하며 회원국·업계 협력 촉구.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "2월 28일 중동 분쟁 발생 이후 6개월이 지났음에도 호르무즈 해협 상황이 해결되지 않고 있으며, 항행의 자유를 회복하기 위한 회원국과 해운업계의 실질적인 해결책 마련과 협력을 촉구"}, {"d": 1, "t": "IMO가 현재까지 확인한 국제해운 대상 공격은 최소 70건이며 이로 인해 선원 19명이 사망했으며, 일부 선박은 페르시아만을 빠져나왔으나 최대 400척의 선박과 약 6,000명의 선원이 안전하게 출항하지 못한 채 높은 위험과 불확실성에 놓여 있다고 밝힘"}, {"d": 0, "t": "호르무즈 해협 사태로 연료, 비료 등 주요 물자의 공급망이 차질을 빚으면서 단기·장기적으로 전 세계 지역사회와 경제에 심각한 영향을 미치고 있다고 지적"}, {"d": 1, "t": "특히 이번 사태가 선박과 선원에 국한되지 않고 연료·비료 및 기타 상품의 핵심 공급망을 교란하고 있으며, 호르무즈 해협의 원활한 항행을 회복할 필요성을 강조"}, {"d": 0, "t": "지난 7월 IMO 이사회가 주요 해상교통로 보호 관련 결의서를 채택한 점을 상기하며, 호르무즈 해협의 방해받지 않는 항행을 회복하기 위한 정치적 의지와 협력이 필요하다고 강조"}, {"d": 1, "t": "해당 결의서는 국제항행에 이용되는 해협의 통항권이 위협·방해·거부·저해되거나 정지돼서는 안 된다는 점을 재확인하고, 호르무즈 해협에서 제한 없는 항행을 지속가능한 방식으로 회복할 것을 촉구"}, {"d": 0, "t": "회원국과 해운업계가 IMO 및 UN 체계와 협력해 호르무즈 해협의 항행 자유를 회복할 수 있는 실질적인 방안을 마련할 것을 요청"}, {"d": 1, "t": "아울러 흑해에서 홍해와 아덴만에 이르기까지 전 세계적으로 해사안보 상황이 악화되고 있으며, 이러한 상황이 수천 명의 선원에게 심각한 영향을 미치고 있다고 밝힘"}]}]}, {"section": "국제해사동향", "title": "ISWG-GHG 22, IMO 넷제로 프레임워크 주요 쟁점 논의", "source": "Lloyd's List, '26.8.28.", "category": "탈탄소", "relevance": "상", "brief": "9.1~4 ISWG-GHG 22에서 MEPC 85(11월) 앞두고 NZF 5개 대안(호주·투발루·브라질=탄소가격 유지 / 라이베리아·일본=탄소가격 제외) 입장 점검. 일본안 절충 가능성, 미국 반대·중국 입장이 변수.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "2026년 9월 1일~4일 개최되는 IMO 온실가스감축 회기간작업반(ISWG-GHG 22)에서는 11월 말 개최되는 제85차 해양환경보호위원회(MEPC 85)를 앞두고, 탄소가격제 유지 여부를 포함한 주요 온실가스 감축정책에 대한 입장과 합의 가능성을 점검할 예정"}, {"d": 1, "t": "이번 회의는 5개 넷제로 프레임워크(NZF) 정책안을 직접 협상하기보다 배출량 모니터링·보고, 온실가스 감축규제, 규제준수 방식 등 5개 주요 주제를 논의하며, 이를 통해 탄소가격제와 IMO 넷제로 기금 등 핵심 정책요소에 대한 회원국들의 입장이 드러날 것으로 예상"}, {"d": 0, "t": "현재 검토되는 5개 정책안은 탄소가격제 유지 여부를 중심으로 나뉘며, 호주·투발루·브라질 안은 기존 NZF의 기본 구조를 유지하는 반면 라이베리아·일본 안은 탄소가격제를 포함하지 않음"}, {"d": 1, "t": "라이베리아 안은 넷제로 목표와 탄소가격제 기금을 제외하고 대체연료의 가격과 가용성을 엄격히 고려하는 방안이며, 일본 안도 탄소가격제와 넷제로 기금을 제외하고 친환경 목표를 완화하는 내용을 담고 있음"}, {"d": 1, "t": "특히 일본 안이 분열된 회원국 간 절충안으로 부상할 수 있는지에 주목하며, EU 등 주요 그룹의 일본 안 지지 여부와 기존 NZF 지지국들이 넷제로 기금 등 핵심 요소를 어느 수준까지 고수할지가 주요 관전 포인트라고 설명"}, {"d": 0, "t": "기존 NZF에 대해서는 호주·캐나다·남아프리카공화국·영국과 EU 27개국이 지지 입장을 보이는 가운데, 미국의 반대와 중국의 입장이 향후 논의의 향방을 미칠 주요 변수로 거론됨"}, {"d": 1, "t": "미국은 NZF 찬성국을 대상으로 한 제재 및 비자 제한 위협을 유지하고 있어 일부 국가의 지지를 어렵게 하는 요인으로 지목됐으나, 직전 회의에서는 다수 회원국이 IMO의 「2023 온실가스 감축전략」을 지지한 것으로 나타남"}, {"d": 1, "t": "기존에 유보적이었던 그리스와 키프로스도 EU 공동 협상입장에 참여했으며, 중국은 NZF 형태의 규제에 제한적인 지지를 시사하는 세부 기술수정안을 제출해 향후 입장이 주목되고 있음"}, {"d": 0, "t": "ISWG-GHG 22에서 큰 정치적 합의가 도출되기보다는 각 정책요소에 대한 회원국의 입장을 확인하면서 MEPC 85의 NZF 논의를 위한 공통분모를 모색할 것으로 전망"}, {"d": 1, "t": "관계자들은 MEPC 85까지 추가 논의의회가 남아 있어 이번 기술회의에서 직접적인 정치적 충돌은 크지 않을 것으로 예상했으나, 개별 대안을 직접 다루지 않더라도 탄소가격제와 넷제로 기금 등 핵심 요소에 대한 지지 수준에 따라 향후 협상의 방향이 보다 구체화될 수 있다고 설명"}, {"d": 1, "t": "세계해운협의회(WSC)는 연료 인증 등 글로벌 규제체계의 기술적 요소에서 올해 진전이 있었며, 이번 회의에서도 회원국들이 공통분모의 실행 가능한 방안을 중심으로 논의를 이어갈 필요가 있다고 밝힘"}]}]}, {"section": "국제해사동향", "title": "브라질, 싱가포르의 10번째 녹색·디지털 해운항로 파트너로 참여", "source": "TradeWinds, '26.8.29.", "category": "탈탄소", "relevance": "하", "brief": "8.28 싱가포르-브라질 GDSC MOU. 브라질 재생에너지 기반 대체연료 공급망 개발, 바이오메탄·Mass Balance 인정 협력.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "싱가포르와 브라질은 8월 28일 녹색·디지털 해운항로(Green and Digital Shipping Corridor) 구축을 위한 양해각서(MOU)를 체결하고, 대체 선박연료 공급망 등 해운 탈탄소·디지털화를 위한 협력을 추진하기로 함"}, {"d": 1, "t": "제프리 시우(Jeffrey Siow) 싱가포르 교통부 장관과 토미 프랑카(Tome Franca) 브라질 항만·공항부 장관이 협약에 서명했으며, 이번 협력으로 브라질은 싱가포르의 10번째 녹색 디지털 해운항로 파트너가 됨"}, {"d": 1, "t": "싱가포르는 2026년 초까지 로테르담, 로스앤젤레스·롱비치, 일본, 호주, 중국, 인도, 한국 등과 9개의 녹색 디지털 해운항로를 구축한 바 있음"}, {"d": 1, "t": "* Green and Digital Shipping Corridor: 국가 항만 간 협력을 통해 대체연료 사용과 관련 공급망, 디지털 기술 등을 공동으로 시험 개발하는 협력체계로, 해운 탈탄소 디지털화와 국제운송 효율성 향상을 목적으로 함"}, {"d": 0, "t": "양국은 브라질의 재생에너지 자원 생산능력과 세계 최대 벙커링항이자 주요 해사혁신 거점인 싱가포르의 강점을 결합해 대체 선박연료 공급망을 개발할 계획"}, {"d": 1, "t": "싱가포르 해사항만청(MPA)은 브라질의 재생에너지 자원을 활용해 온실가스 배출이 제로 또는 제로에 가까운 선박연료를 생산할 수 있으며, 이번 협력을 통해 이러한 연료의 생산·공급에 필요한 공급망 구축을 지원할 계획이라고 밝힘"}, {"d": 1, "t": "싱가포르는 국제규제의 불확실성이 해소되기를 기다리기보다 국제 파트너와 대체연료 인프라 구축을 지속한다는 입장으로, 바이오메탄 활용과 싱가포르에서 벙커링 질량수지(Mass Balance) 방식으로 관리되는 연료의 국제사회 인정에도 이러한 협력체계를 활용하는 방안을 검토하고 있음"}, {"d": 1, "t": "* Mass Balance: 물리적으로 혼합된 연료의 공급·사용 과정에서 지속가능한 연료의 투입량과 그에 따른 환경적 속성을 장부상 추적 관리하는 방식"}, {"d": 0, "t": "싱가포르와 브라질은 대체연료뿐만 아니라 항만·해운 운영의 효율성을 높이기 위한 디지털 정보교환과 새로운 해사기술의 연구·개발 및 도입도 공동 추진할 예정"}, {"d": 1, "t": "양국은 항만과 해운 운영 개선을 위한 디지털 정보교환 방안을 모색하고, 업계와 함께 새로운 해사기술 솔루션의 연구·개발 및 실제 적용을 추진하기로 함"}, {"d": 0, "t": "이번 협력은 싱가포르와 브라질 간 기존 해사분야 협력관계를 기반으로 체결됐으며, 양국의 조선·해양산업 분야에서도 장기간의 사업관계가 이어지고 있음"}, {"d": 1, "t": "협약 전날 싱가포르 Tuas 조선소에서 브라질 Petrobras의 FPSO 2척 명명식이 개최됐다고 소개했으며, 싱가포르 해양플랜트 기업 Seatrium은 1999년부터 브라질에서 사업을 수행해 약 20억 싱가포르 달러(15억7천만 달러)를 투자하고 현지 인력 약 1만 2,000~1만 3,000명을 고용하고 있다고 밝힘"}, {"d": 1, "t": "* FPSO(Floating Production Storage and Offloading): 해상에서 원유·가스를 생산 처리한 뒤 저장하고 운반선에 하역하는 부유식 생산·저장·하역설비"}]}]}]}, {"id": "26-35", "seq": 35, "issue_date": "2026-09-14", "posted": "2026-09-14", "board_no": 687, "url": "https://www.imokorea.org/board/board.asp?B_ID=Inter_Maritime&ty=view&page=1&bandstart=1&findtype=&findstr=&idx=5749&ii=687", "pdf": "(26-35호) IMO소식 및 국제해사동향.r1.pdf", "pages": 6, "file": "2026/2026-09/IMO소식_26-35호_20260914.html", "items": [{"section": "IMO 소식", "title": "IMO, IAEA 해상 원자력 기술 ATLAS 이니셔티브 참여", "source": "IMO Media Centre, '26.9.3.", "category": "IMO 제도", "relevance": "중", "brief": "IMO, IAEA가 8.26~27 워싱턴 D.C. 고위급 포럼에서 출범한 해상 원자력 기술 국제협력 이니셔티브 ATLAS에 참여.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "IMO는 해상 원자력 기술의 안전·보안 및 안전조치 강화를 위한 국제협력 확대를 위해 국제원자력기구(IAEA)가 출범한 ATLAS 이니셔티브에 참여하기로 함"}, {"d": 1, "t": "IAEA는 '26.8.26.~27. 미국 워싱턴 D.C.에서 고위급 포럼을 개최해 안전·보안 및 안전조치가 확보된 해상 원자력 기술의 활용을 위한 국제협력 이니셔티브인 ATLAS를 출범함"}, {"d": 1, "t": "* International Atomic Energy Agency: 원자력의 평화적 이용을 촉진하고 원자력 안전 및 안전조치 분야를 수행하는 국제기구"}, {"d": 1, "t": "* Atomic Technologies Licensed for Applications at Sea: 첨단 해상 원자력 기술에 대한 국제적 관심 증가와 함께 안전·보안 및 안전조치 분야 원자력 기술의 해상 활용을 위한 국제협력 이니셔티브"}, {"d": 0, "t": "IMO는 원자력 추진선박 등 해상 원자력 기술 도입에 필요한 법률·규제·안전·보안조치 및 책임체계를 논의했으며, 원자력 안전·보안·안전조치 분야에서 IAEA와의 상호보완적 역할을 강조함"}, {"d": 0, "t": "ATLAS는 정부·규제기관·국제기구·산업계 등 이해관계자가 해상 원자력 기술의 제도적 기반을 논의할 수 있는 체계적인 협의 플랫폼을 제공할 것으로 기대됨"}, {"d": 0, "t": "IMO는 ATLAS 참여를 통해 IAEA 및 회원국과의 협업을 지속하고, 해상 원자력 기술이 국제기준에 따라 높은 수준의 안전·보안 및 환경보호를 유지할 수 있도록 지원할 방침임"}]}]}, {"section": "IMO 소식", "title": "IMO 공지", "source": "", "category": "IMO 공지", "relevance": "하", "brief": "ACT-BIOFOULING 참여국 모집(CL.5231)·2026 국제해사상 후보 추천(CL.5283)·WMU 석사과정 장학 추천(CL.5297), IMO 시상식 개최 안내(CL.5292), IMSAS 1주기 감사결과 공개(CL.5299)·MSW 실태조사 기한연장(CL.5243), 우크라이나·멕시코 항행제한 통보(CL.5304·5305), 런던협약·의정서 과학그룹 회의(LC/SG 50) 개최안내(CL.5298) 등 제26-40~43호 사무국·기타 공지.", "groups": [{"label": "", "bullets": []}, {"label": "회원국 공지", "bullets": [{"d": 0, "t": "(가봉) 국제선박등록부 연락처 정정 통보 (CL.5242/Add.1, '26.9.1.)"}, {"d": 1, "t": "가봉 정부는 국제선박등록부 관리가 해운총국(Direction Générale de la Marine Marchande)과 리브르빌 선박등록사무소(Bureau d'Immatriculation des Navires)에서 수행되고 있음을 재확인하고, 기존 통보문에 기재된 해운총국 이메일 주소에 오류가 있었다고 IMO에 통보함"}, {"d": 1, "t": "가봉은 해운총국 선박등록사무소의 수정된 이메일 및 전화번호를 IMO에 제출하고, 해당 연락처 정보를 정정해 줄 것을 요청함"}]}]}, {"section": "국제해사동향", "title": "이중연료선 확대에도 친환경 연료 가격 격차 여전", "source": "Seatrade Maritime News, '26.9.8.", "category": "대체연료·안전", "relevance": "상", "brief": "이중연료선 발주 확대에도 친환경 연료 고가·불확실한 수요로 실사용 확대 한계. 대체연료 장기·단기 계약 격차, 화주 수요 결집 필요성 지적.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "최근 글로벌 해양환경위원회(GMEC)에서 해운업계 전문가들은 이중연료선 발주가 확대되고 있으나, 높은 친환경 연료 가격과 불확실한 장기 수요로 실제 사용 확대에는 한계가 있다고 지적함"}, {"d": 1, "t": "영국 선급협회(LR)는 최근 이중연료선 발주가 크게 늘면서 연료를 사용할 선박은 확보되고 있으나, 해당 선박들이 인도 직후부터 지속가능한 연료를 사용할 것이라는 보장은 없다고 설명함"}, {"d": 1, "t": "기존에는 대체연료를 사용할 선박이 모두 부족했다면, 현재는 상대적으로 대체연료의 생산·사용에 따른 비용과 위험을 누가 부담할지가 주요 과제로 전환됐다고 평가함"}, {"d": 1, "t": "* Global Maritime Environmental Congress: 독일 함부르크에서 격년으로 개최되는 국제해운업계 기간 중 열리는 해양환경 전문 콘퍼런스로서 해당 업계의 친환경 연료 전환 관련 논의 등을 진행함"}, {"d": 1, "t": "** 영국에 본사를 둔 국제 선급기관으로, 선박·해양설비의 기술기준 제정, 검사·인증 등을 수행함"}, {"d": 0, "t": "대체연료 공급 확대를 위해서는 연료 생산자가 요구하는 장기 구매계약과 선사가 통상 체결하는 단기 공급계약 간 격차를 해소할 필요가 있는 것으로 지적됨"}, {"d": 1, "t": "Hapag-Lloyd는 화주가 장기적이고 예측 가능한 수요 신호를 제공하지 않으면 선사가 위험을 전적으로 부담하면서 대체연료 공급계약을 체결하기 어렵다고 설명함. 이와 함께 내년부터 15년간 메탄올을 공급받는 계약을 체결했으나, 이는 회사 전체 연료 사용량에서 차지하는 비중이 상대적으로 작은데도 상당한 재무적 위험을 수반한다고 밝힘"}, {"d": 0, "t": "화주의 친환경 해운 수요를 결집하는 방식이 대체연료 시장 형성에 기여하고 있으나, 비용 부담과 경영으로 인해 자발적 수요 확대에는 한계가 있는 것으로 나타남"}, {"d": 1, "t": "ZEMBA는 온실가스 저감을 해운서비스를 원하는 화주의 수요를 모아 선사의 대체연료 사용을 지원하고 있으나, 화주들은 공급당 배출 감축 시 해운보다 항공·육상 운송을 우선하는 경우가 많다고 설명함"}]}]}, {"section": "국제해사동향", "title": "영국·미국, 원자력 추진 컨테이너선 운항을 위한 'Pink Corridor' 추진", "source": "TradeWinds, '26.9.3.", "category": "대체연료·안전", "relevance": "중", "brief": "LR·Maersk·Felixstowe항·Charleston항, 영-미 'Pink Corridor' 프로젝트로 원자력 추진 컨테이너선 상업운항 규제·보안·운영체계 검토(개념 검토 단계).", "groups": [{"label": "", "bullets": [{"d": 0, "t": "영국 선급협회(LR), Maersk, 영국 Felixstowe항 및 미국 Charleston항은 향후 원자력 추진 컨테이너선의 상업운항에 필요한 규제·보안·운영체계를 검토하기 위해 영국-미국 간 'Pink Corridor' 프로젝트를 출범함"}, {"d": 1, "t": "동 프로젝트를 통해 Felixstowe-Charleston 간 가상 항로를 대상으로 항만 접근, 보안, 보험, 비상대응 등 원자력 추진선의 상용운항 요건을 검토할 예정으로, 현재 선박 건조·배치 계획은 없는 개념 검토임"}, {"d": 0, "t": "Pink Corridor는 미·영 정부의 'Technology Prosperity Deal'의 일환으로 추진되며, 양국 간 민간 해상 원자력 기술의 적용과 원자력 추진 해운항로 구축 가능성을 검토하는 데 목적을 두고 있음"}, {"d": 1, "t": "* 미국과 영국 정부가 민간 해상 원자력 기술 적용 및 양국 간 원자력 추진 해운항로 개발 가능성 등을 검토하는 기술협력체계임"}, {"d": 0, "t": "원자력 추진은 최근 녹색수소 기반 탈탄소화에 대한 기대가 약화되면서 관심이 확대됐으며, 첨단 원자로는 연료 재공급이나 감속운항 필요성이 적으면서 거의 무배출에 가까운 추진력을 제공할 수 있는 것으로 주장이 제기되고 있음"}, {"d": 1, "t": "다만 소형모듈원자로(SMR) 기술은 아직 초기 단계로 여러 원자로 설계 가운데 표준화된 방식이 확립되지 않았으며, 첨단 SMR도 아직 상업운전 단계에 진입하지 못함"}, {"d": 0, "t": "원자력 추진선의 상용화를 위해서는 원자로 기술뿐만 아니라 규제, 책임체계, 사회적 수용성 및 항만 준비태세 등 실제 운항을 위한 제도적·운영적 정책을 해결해야 한다고 지적됨"}, {"d": 1, "t": "LR의 원자력기술 담당 Jez Sims 이사는 현재 논의가 원자력 추진 상선의 기술적 건조 가능성에서 글로벌 해운체계 내 실제 취항·운영 가능성으로 이동하고 있다고 설명함"}, {"d": 1, "t": "특히 원자력 추진선박 안전에 필요한 체계 구축이 필요하며, IMO의 원자력 선박 규정 검토와 IAEA의 최근 ATLAS 프로젝트 출범도 관련 논의가 진전되고 있음을 보여준다고 언급함"}, {"d": 0, "t": "Felixstowe항과 Charleston항은 원자력 추진선 수용에 필요한 보안절차, 비상대응 및 규제준수 요건을 검토하는 역할을 수행함"}, {"d": 1, "t": "LR은 두 항만을 연결하는 실제 항로를 가정함으로써 관련 문제를 현실적인 운항환경에서 검증할 수 있다고 설명했으며, 향후 원자력 추진 상선이 운항하려면 이를 수용할 의사와 역량을 갖춘 항만이 필요하다고 지적함"}, {"d": 1, "t": "특히 Felixstowe항은 영국 최대·최다 이용 컨테이너항으로서 프로젝트 초기 단계에 실무적 정보를 제공할 예정임"}, {"d": 0, "t": "동 프로젝트의 초기 단계에서는 원자력 추진 해운을 위한 인프라·거버넌스 운영환경을 검토하고, 그 결과를 토대로 향후 공학적 요건과 법·규제체계 등에 대한 추가 검토 가능성을 모색할 예정임"}, {"d": 1, "t": "LR은 2024년 영국 원자력 스타트업 Core Power와 컨테이너선 첨단 원자력 추진에 필요한 규제체계를 평가했으며, 이후 Maersk가 참여해 안전·규제 운영상 영향을 검토해 왔음"}, {"d": 1, "t": "Pink Corridor는 이러한 선박 단위 검토를 인프라와 운항환경으로 확대하는 단계로, 초기 결과는 향후 공학적 요건, 법률 개정, 규제 정합성 및 안전조치 체계 등을 다루는 2단계 작업의 참고사항으로 활용될 수 있음"}]}]}]}, {"id": "26-36", "seq": 36, "issue_date": "2026-09-21", "posted": "2026-09-21", "board_no": 688, "url": "https://www.imokorea.org/board/board.asp?B_ID=Inter_Maritime&ty=view&page=1&bandstart=1&findtype=&findstr=&idx=5750&ii=688", "pdf": "(26-36호) IMO소식 및 국제해사동향.F.pdf", "pages": 8, "file": "2026/2026-09/IMO소식_26-36호_20260921.html", "items": [{"section": "IMO 소식", "title": "흑해·카스피해 연안국, 해사싱글윈도우 이행 위한 역내 협력 강화", "source": "IMO Media Centre, '26.9.11.", "category": "디지털·검사", "relevance": "중", "brief": "IMO는 '26.9.9~11. 바레인에서 흑해·카스피해 연안국 대상 해사싱글윈도우(MSW) 지역 워크숍 개최. IMO Compendium 활용한 MSW 데이터 상호운용성·표준화 방안 논의.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "국제해사기구(IMO)는 '26.9.9~11. 바레인에서 흑해·카스피해 연안국의 해사싱글윈도우(MSW)* 이행을 지원하기 위한 지역 워크숍을 개최함"}, {"d": 1, "t": "동 워크숍에는 조지아, 카자흐스탄, 투르크메니스탄의 해사당국, 항만당국 및 세계기관 관계자 19명(여성 7명 포함)이 참석해 MSW 구축 경험과 진행상황 및 과제를 공유함"}, {"d": 2, "t": "* Maritime Single Window: 선박의 항만 입·출항 시 선박과 공공당국 간 정보를 단일 창구에서 교환하는 종합입출항 디지털 플랫폼"}, {"d": 0, "t": "IMO 회원국은 '24년부터 항만에서 MSW를 의무적으로 운영하고 있으며, 이를 통해 선박의 신고절차 간소화 및 입출항 처리 효율화를 추진하고 있음"}, {"d": 1, "t": "참가국들은 MSW와 항만커뮤니티시스템(PCS)* 구축에 관한 국가별 접근방식을 비교하고, 각국 여건에 적용할 수 있는 실질적인 해결방안을 논의해, 아울러 해사·세관 항만당국 간 협력과 디지털 해양정보 교환방식의 초점 필요성을 확인함"}, {"d": 2, "t": "* Port Community System: 항만 이용 주체 간 물류·행정정보를 전자적으로 교환하기 위한 디지털 정보시스템"}, {"d": 0, "t": "참가국들은 IMO 간소화·전자업무 컴펜디엄(IMO Compendium)*을 활용한 MSW 데이터의 상호운용성과 표준화 방안을 검토함"}, {"d": 1, "t": "워크숍에서는 MSW 도입을 통한 신고절차 간소화, 국경 관련 기관과 항만 이해관계자 간 협력 개선, 운영 효율성 향상 및 무역 원활화 등의 효과도 논의됨"}, {"d": 2, "t": "* IMO Compendium on Facilitation and Electronic Business: 선박 항만 전자정보 교환에 사용되는 데이터의 의미와 형식을 조화시키기 위한 IMO의 참조체계"}, {"d": 0, "t": "IMO는 이번 워크숍을 통해 흑해·카스피해 연안국의 해사 디지털화를 위한 지역협력과 제도적 역량 강화를 지원함"}, {"d": 1, "t": "이번 활동은 IMO 통합기술협력프로그램(TCP)을 통해 조지아 해양운송청(Maritime Transport Agency of Georgia)과 긴밀히 협력해 시행함"}]}]}, {"section": "IMO 소식", "title": "IMO 공지", "source": "", "category": "IMO 공지", "relevance": "하", "brief": "ACT-BIOFOULING 참여국 모집(CL.5231)·2026 국제해사상 후보 추천(CL.5283)·WMU 석사과정 장학 추천(CL.5297), IMO 시상식 개최 안내(CL.5292), IMSAS 1주기 감사결과 공개(CL.5299)·MSW 실태조사 기한연장(CL.5243), 우크라이나·멕시코 항행제한 통보(CL.5304·5305), 런던협약·의정서 과학그룹 회의(LC/SG 50) 개최안내(CL.5298) 등 제26-40~43호 사무국·기타 공지.", "groups": [{"label": "", "bullets": []}, {"label": "회의 및 사무국 공지", "bullets": [{"d": 0, "t": "(사무국) IMO 국제해사법대학원(IMLI) 정관 개정 안내 (CL.5262, '26.9.10.)"}, {"d": 1, "t": "IMO는 '13년 이후 13년 만에 국제해사법대학원(IMLI) 정관을 개정하고, 제137차 이사회에서 승인된 개정 정관을 '26.9.1.부터 시행함. 이번 개정은 세계해사대학교(WMU) 헌장과의 합치를 높이고 국제해사법 및 해양 거버넌스 전반에 대한 IMLI의 역량강화 기능을 반영하기 위해 추진됨"}, {"d": 1, "t": "개정 정관은 이사회, 학술위원회 및 재원인사위원회의 역할·구성·임기의 재임명 기준을 강조하고, IMLI 원장의 근무조건과 인력 구성, 재원 예산 관리 관련 사항 등을 정비함"}, {"d": 2, "t": "* IMO International Maritime Law Institute: IMO가 '88년 몰타 정부와의 협정에 따라 설립한 국제해사법 전문 대학원"}, {"d": 0, "t": "(사무국) 2026 세계 해사의 날 기념행사 안내 (CL.5267, '26.9.10.)"}, {"d": 1, "t": "IMO는 '26.9.24. 세계 해사의 날을 맞아 2026-2027년 주제인 'From Policy to Practice: Powering Maritime Excellence'를 중심으로 기념행사를 개최하고, 사무총장 기념 메시지를 공개함"}, {"d": 1, "t": "사무총장은 IMO 규정이 전 세계적으로 이행돼야 보다 안전하고 회복력 있으며 청정한 해운으로 이어질 수 있다고 강조하고, 디지털화·에너지 전환·여성 참여 확대 등에서 모든 회원국의 이행을 지원하겠다고 밝힘"}, {"d": 1, "t": "IMO는 당일 본부 건물을 파란색으로 점등하고, 회원국과 국제기구에도 주요 건물의 파란색 점등 및 관련 행사 개최와 소셜미디어 참여를 권고함"}]}, {"label": "기타 공지", "bullets": [{"d": 0, "t": "(몰타) 자국 MMSI 번호 무단 사용 관련 통보 (CL.5264, '26.9.7.)"}, {"d": 1, "t": "몰타 정부는 '26.8.1. 기준 자국 선박으로 등록되지 않은 선박들이 몰타에 할당된 MMSI* 번호를 무단 송신하고 있음을 확인하고, 해당 번호 목록을 IMO에 통보함"}, {"d": 1, "t": "몰타는 무단 MMSI 사용이 선박 식별 오류와 항행안전 관련 통신 장애를 초래할 수 있다며, 해당 번호는 등록 말소 이후 사용이 중단됐어야 한다고 밝히고, 관련 사례를 지속적으로 모니터링할 예정임을 알림"}, {"d": 2, "t": "* Maritime Mobile Service Identity: 선박의 무선통신 및 식별을 위해 부여되는 9자리 고유번호"}, {"d": 0, "t": "(우크라이나) 러시아의 수색구조 공격 관련 입장 통보 (CL.5270, '26.9.14.)"}, {"d": 1, "t": "우크라이나 정부는 '26.9.10. 초르노모르스크항에서 자국 최대 수색구조선 'Sapphire'호가 러시아의 공격으로 손상됐다고 주장함. 동 선박은 민간 선박과 조난자에 대한 수색 구조 임무를 수행하는 6,651톤급 선박이라고 밝힘"}, {"d": 1, "t": "또한 '22.2.24. 이후 러시아 공격으로 항만시설 1,200개소가 상선 276척이 손상 또는 일부 파괴되고 민간인 340명이 피해를 입었다고 주장함"}, {"d": 1, "t": "우크라이나는 수색구조선이 국제 인도법 등에 따라 특별한 보호를 받는다며 이번 공격을 규탄하고, IMO 회원국에 수색 구조선 및 상선 공격에 대한 책임 규명과 국제법 준수를 촉구함"}, {"d": 0, "t": "(네덜란드) 선박 허위 등록 및 국기 부정 사용 관련 입장 통보 (CL.5265, '26.9.8.)"}, {"d": 1, "t": "네덜란드는 아루바, 퀴라소, 신트마르턴, 네덜란드 4개 구성국이 선박의 허위 등록과 국기 안전보험·선원증서 부정 사용에 공동 대응하기로 하고, 현재 국제선박등록부를 운영하는 구성국은 퀴라소와 네덜란드본이라고 밝힘"}, {"d": 1, "t": "네덜란드는 '26.4.14. 기준 아루바, 퀴라소, 신트마르턴의 국기를 허위로 사용하는 선박이 총 65척이며 대부분 유조선이고 97%가 선령 15년 이상이라고 밝히며, 정보공유와 국제협력을 통해 허위 등록 및 증서 발급에 대응하겠다고 밝힘"}, {"d": 0, "t": "(가봉) 국제선박등록부 신규 관리기관 지정 통보 (CL.5266, '26.9.9.)"}, {"d": 1, "t": "가봉 정부는 자국 해운당국이 약 1개월간 수행해 온 국제선박등록부의 임시 관리를 종료하고, Gabon International Ship Registry(GISR)를 새로운 관리기관으로 지정했다고 IMO에 통보함"}, {"d": 1, "t": "가봉은 GISR이 앞으로 선박 등록과 관련 행정업무를 전담한다며, 그리스 파레우스 소재 GISR의 연락처와 회사 등록정보를 IMO에 제출하고 관련 정보의 갱신을 요청함"}]}]}, {"section": "국제해사동향", "title": "에탄올, 친환경 선박연료 가능성에 지속가능성 기준 마련 필요", "source": "Lloyd's List, '26.9.11.", "category": "대체연료·안전", "relevance": "중", "brief": "에탄올 온실가스 배출강도가 생산방식·지역별로 5~50gCO2e/MJ까지 편차. IMO 배출계수 기준 정립이 과제이며, WinGD는 NZF 미채택 이후 배출가격 규제 여부가 수요를 좌우한다고 평가.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "에탄올이 해운 탈탄소화를 위한 유망한 대체연료로 주목받고 있으나, 생산방식과 원료 종에 따라 환경성이 크게 달라 IMO의 관련 기준 마련이 주요 과제로 부상함"}, {"d": 1, "t": "IMO에서는 각 대체연료에 적용될 배출계수를 논의하고 있으나, 바이오연료의 경우 원료 추적성·정제과정에서 사용되는 연료와 엔진 연소 배출량 등이 평가에 반영됨"}, {"d": 1, "t": "에탄올의 온실가스 생산주기 배출강도는 생산지역, 방식 및 적용 분류체계에 따라 5-6gCO2e/MJ에서 45-50gCO2e/MJ까지 차이가 발생함"}, {"d": 0, "t": "브라질산 에탄올은 낮은 배출강도로 해운연료 시장에서 상대적으로 유리한 위치를 확보하고 있으나, 추가적인 지속가능성 요건도 충족해야 함"}, {"d": 1, "t": "IMO의 GESAMP LCA는 올해 브라질산 중간작물 에탄올의 배출강도를 20.8gCO2e/MJ로 승인했으며, 이는 무·저배출(ZNZ)* 연료 기준인 19gCO2e/MJ에 소폭 상회함"}, {"d": 1, "t": "미국산은 평균 30-40gCO2e/MJ 수준으로, 브라질산은 정제과정에서 재생에너지를 더 많이 사용하는 점이 유리하게 작용함. 다만 브라질 측은 에탄올이 시장에서 대체 노지경작지로 인한 간접토지이용변화(ILUC)** 요건도 충족해야 한다고 설명함"}, {"d": 2, "t": "* Zero or Near-Zero emission: IMO 기준상 탄배출 또는 배출량이 매우 낮은 연료를 의미"}, {"d": 2, "t": "* Indirect Land-Use Change: 바이오연료용 작물 생산이 사료작물을 대체하거나 추가적인 토지개간을 유발하는 간접적 토지이용 변화를 의미"}, {"d": 0, "t": "에탄올 생산업계는 국가별·시장별로 상이한 연료 특성과 지속가능성 기준이 글로벌 시장 확대를 어렵게 한다며 기준에 대한 표준화 필요성을 제기함"}, {"d": 1, "t": "Global Centre for Green Fuels은 다양한 바이오연료 원료를 동일하게 비교하기 어려운 인증 검증 절차와 지속가능성 기준의 표준화가 중요하다고 설명함"}, {"d": 1, "t": "Marquis Energy도 국가나 용도별로 서로 다른 에탄올 규격이 유동성을 분산시키고 저장·운송을 복잡하게 해 비용을 높인다고 지적함"}, {"d": 0, "t": "바이오연료의 지속가능성 기준을 둘러싸고 국가별 입장이 엇갈리면서 IMO의 세부 기준 설정도 복잡한 양상을 보이고 있음"}, {"d": 1, "t": "EU 회원국과 환경단체는 산림훼손 방지를 위해 보다 엄격한 생애주기평가(LCA)* 기준을 요구하며 e-fuel을 지지하는 반면, Chattertton은 대체연료 공급이 부족한 상황에서 자사처럼 엄격한 기준을 적용하는 데 우려를 제기함"}, {"d": 1, "t": "사우디아라비아, 카타르, UAE도 대체연료와 실제 Well-to-Tank 배출자료 등에 대한 보다 엄격한 검토를 요구함"}, {"d": 2, "t": "* Life-cycle Assessment: 연료의 생산부터 사용까지 전 과정에서 발생하는 온실가스 배출량을 평가하는 방식"}, {"d": 0, "t": "WinGD는 에탄올의 기술적·정책적 세부 결정보다 배출가격 규제 여부가 대체연료 수요를 좌우하는 핵심 요인이라고 강조함"}, {"d": 1, "t": "WinGD는 '25.10월 MEPC에서 NZF가 채택되지 않은 이후 에탄올 이용연료 엔진 발주가 감소했으며, 자사의 일반연료와 이용연료 엔진 발주 비중도 약 50:50에서 75:25로 변화했다고 설명함. 아울러 에탄올을 포함한 대체연료 수요는 결국 배출가격에 달려 있으며, 관련 규제가 없으면 큰 변화가 나타나기 어렵다고 밝힘"}, {"d": 2, "t": "* Winterthur Gas & Diesel: 선박용 대형 저속엔진을 개발·생산하는 스위스 엔진기업"}]}]}, {"section": "국제해사동향", "title": "해운업의 AI 과제는 더 이상 인공지능이 아니라 데이터", "source": "Lloyd's List, '26.9.3.", "category": "디지털·검사", "relevance": "하", "brief": "SMM 2026(함부르크) 참석 업계는 AI가 이미 성과를 내지만 데이터 품질·시스템 통합 부족이 과제라고 지적. HD Hyundai는 AI 용접로봇으로 생산성 15~20% 향상 사례 소개.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "독일 함부르크 SMM에 참석한 해운업계 관계자들은 AI 기술이 이미 실질적인 성과를 내고 있으나, 데이터 품질과 시스템 통합 부족이 활용 확대를 제약하고 있다고 지적함"}, {"d": 1, "t": "선주·조선소·선급 기업 7개 관계자들은 AI가 선박 유지·보수, 상선, 데이터 분석 및 행정업무의 효율성을 높이고 있다고 평가함"}, {"d": 1, "t": "반면 분산된 시스템, 낮은 데이터 품질과 기업별 디지털화 수준의 차이가 AI를 광범위하게 적용하는 데 주요 장애물로 남아 있다고 설명함"}, {"d": 2, "t": "* Shipbuilding, Machinery & Marine Technology: 독일 함부르크에서 개최되는 국제 조선해양산업 박람회"}, {"d": 0, "t": "해운기업들은 AI 도입을 확대하기에 앞서 데이터 표준화와 접근성을 확보하는 디지털 기반 구축이 필요하다고 강조함"}, {"d": 1, "t": "Oldendorff Carriers는 기업들이 AI 기반 의사결정에 앞서 데이터를 정제·표준화하는 데 상당한 자원을 투입하고 있다고 설명함"}, {"d": 1, "t": "ABS Group도 AI의 주요 활용 분야로 분석, 자산관리 및 자동화를 제시하면서도 많은 기업이 데이터 품질이나 데이터 접근을 위한 기술적 기반을 충분히 갖추지 못했다고 지적함"}, {"d": 1, "t": "HD Hyundai 역시 디지털 전환을 완료하기 전에 AI 도입을 서두르는 기업이 많으며, 데이터의 업무절차가 여전히 분산돼 있다고 설명함"}, {"d": 0, "t": "AI는 조선 생산과 선박 유지보수·상업업무 등에서 이미 측정 가능한 생산성 향상 효과를 나타내고 있음"}, {"d": 1, "t": "HD Hyundai는 한 조선소에서 약 100대의 AI 용접로봇을 운영해 생산성을 15-20% 높이고 블록 생산기간을 60일에서 5일로 단축했으며, 용접 결함도 90% 줄였다고 밝힘"}, {"d": 1, "t": "Everllence는 상태 모니터링과 예측정비에서 AI 활용이 확대되고 있다고 설명했으며, Complexio는 청구 처리, 도착예정시간(ETA) 취합, 체선기간 계산 및 관련 행정업무에서도 자동화가 진행되고 있다고 소개함"}, {"d": 0, "t": "해운업계의 AI 논의는 완전자율운항 중심에서 현재 적용 가능한 디지털 기술과 조직적 활용체계 구축으로 이동하고 있음"}, {"d": 1, "t": "SMM에서는 과거 해양 AI 논의를 주도했던 자율운항선보다 디지털 트윈, 예측정비, 사이버보안 및 의사결정 지원시스템이 주요 활용 분야로 제시됨"}, {"d": 1, "t": "HD Hyundai는 AI가 설계 생산성, 제조 효율 및 품질관리 개선에 이미 활용되고 있으나, 안전이 중요한 해운산업에서 책임과 신뢰가 요구되는 완전자율운항은 여전히 장기적인 과제라고 설명함"}, {"d": 0, "t": "해운업계는 향후 AI 확산을 위해 알고리즘 고도화보다 데이터 품질·시스템 통합과 조직 내 신뢰 확보가 중요하다고 평가함"}, {"d": 1, "t": "ABS Group은 AI 도입을 단순한 기술 적용이 아닌 업무절차를 재설계하는 장기적인 조직 변화로 보고, 핵심 의사결정에서는 인간이 책임을 유지해야 한다고 설명함"}, {"d": 1, "t": "또한 AI가 이미 조선·선박운항·상업관리 분야에서 가치를 창출하고 있어, 향후 과제는 이를 실제 업무에 활용할 수 있는 데이터와 조직 기반을 갖추는 것이라고 분석함"}]}]}]}, {"id": "26-37", "seq": 37, "issue_date": "2026-10-06", "posted": "2026-10-06", "board_no": 689, "url": "https://www.imokorea.org/board/board.asp?B_ID=Inter_Maritime&ty=view&page=1&bandstart=1&findtype=&findstr=&idx=6754&ii=689", "pdf": "(26-37호) IMO소식 및 국제해사동향.F.pdf", "pages": 7, "file": "2026/2026-10/IMO소식_26-37호_20261006.html", "items": [{"section": "IMO 소식", "title": "IMO 사무총장, 회원국에 상선·선원 대상 공격 중단 촉구", "source": "IMO Media Centre, '26.9.16.", "category": "해사보안", "relevance": "중", "brief": "호르무즈 해협 등에서 상선 공격 80건·선원 22명 사망('26.2.28 중동 분쟁 이후). 흑해·아조프해·홍해에서도 공격 지속되어 IMO 사무총장이 상선·선원 공격 중단과 회원국·국제사회 대응을 촉구.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "IMO 사무총장은 지정학적 분쟁을 이유로 상선과 선원을 공격해서는 안 된다며 회원국에 해운 안전을 위협하는 행위의 중단을 촉구함"}, {"d": 1, "t": "도밍게스 사무총장은 '26.9월 IMO 화물·컨테이너운송 전문위원회(CCC)에서 최근 지정학적 긴장이 해운업계에 심각한 영향을 미치고 있으며, 무고한 선원을 공격해서는 안 된다고 강조함"}, {"d": 0, "t": "IMO는 '26.2.28. 중동 분쟁 발생 이후 호르무즈 해협과 인근 해역에서 국제해운을 대상으로 한 공격 80건을 확인했으며, 최소 22명의 선원이 사망했다고 밝힘"}, {"d": 1, "t": "흑해와 아조프해에서도 최근 수 개월간 국제해운 대상 공격으로 수십 명이 사망한 것으로 보고됐으나 정확한 수치는 확인이 어려우며, 홍해에서는 '26.8.11. 후티의 상선 공격으로 4명의 사망자가 발생함"}, {"d": 0, "t": "도밍게스 사무총장은 각 분쟁지역의 상선 공격이 단일 행위자에 의한 것이 아니라고 밝히며, 분쟁이 국제해운에 미치는 영향을 각국 정부와 국제사회에 전달할 것을 회원국에 요청함"}, {"d": 1, "t": "지정학적 분쟁의 근본 원인 해결은 IMO의 권한 범위를 벗어나지만, 해운 차질이 글로벌 경제 및 공급망과 일상생활까지 영향을 미치는 만큼 회원국과 유엔 관련 기구가 해결방안을 모색해야 한다고 강조함"}]}]}, {"section": "IMO 소식", "title": "제12차 화물·컨테이너 운송 전문위원회(CCC) 회의 주요 논의결과", "source": "", "category": "컨테이너 안전", "relevance": "상", "brief": "9.14~18 IMO CCC 12 개최, 13개 의제 논의. IGF 코드 메틸알코올 연료 임시지침 확정(제113차 MSC 승인 예정), OCCS·연료전지 등 신기술 안전규제체계 개발, IMSBC·IMDG 코드 개정, 컨테이너 래싱 소프트웨어 임시 성능기준 확정.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "2026년 9월 14일부터 18일까지 IMO 본부에서 제12차 화물·컨테이너 운송 전문위원회(CCC)가 개최되었으며, 의제 목록과 주요 논의사항 및 결과는 아래와 같음"}, {"d": 0, "t": "의제: 1 의제의 채택 / 2 IMO 타 기구의 결정사항 / 3 국제가스연료(IGF) 코드 개정 및 대체연료 관련 기술 지침 개발 / 4 신기술·대체연료 선박의 온실가스(GHG) 감축 지원을 위한 안전 규제체계 개발 / 5 국제해상고체산적화물(IMSBC) 코드 및 보충서 개정 / 6 국제해상위험물(IMDG) 코드 및 보충서 개정 / 7 화물고박지침서 작성지침 개정 및 래싱 소프트웨어 임시 성능기준 개발 / 8 선박 또는 항만구역에서 발생한 포장위험물 해양오염물질 관련 사고 보고서 검토 / 9 IMO 안전, 보안, 환경, 통항간소화, 책임 및 보상 관련 협약 규정의 통일해석 / 10 2개년 현황보고 및 제13차 CCC 잠정의제 / 11 2027년 의장 및 부의장 선출 / 12 기타 의제 / 13 해사안전위원회(MSC)·해양환경보호위원회(MEPC) 제출 보고서 채택"}, {"d": 0, "t": "〈의제 3. 국제가스연료(IGF) 코드 개정 및 대체연료 관련 기술 지침 개발〉 메틸 에틸 알코올을 연료로 추진하는 선박의 임시 안전지침(MSC.1/Circ.1621) 개정안이 최종 확정되어 제113차 MSC('27.6.)에서 승인될 예정임"}, {"d": 1, "t": "코퍼댐 기능요건 및 정의, 벙커링 스테이션 규정을 신설하고, 연료준비구역 환기를 2단계 방식(평시 시간당 10회, 누출 감지 시 30회)으로 전환하여 메틸알코올 독성 감시 경보를 신설함"}, {"d": 1, "t": "발라스트탱크를 보호 코퍼댐으로 인정하는 제안은 정보 부족을 이유로 반영되지 않았으나, 관련하여 우리나라는 선박설계·건조 관행에 미칠 영향에 대해 우려를 표명함"}, {"d": 0, "t": "저인화점 연료유* 임시 안전지침은 '연료안전 기관구역(fuel-safe machinery space)' 개념을 기본 안전철학으로 채택하고, 제13차 CCC('27.9.)에서 최종화 하기로 함"}, {"d": 1, "t": "* 인화점이 52-60℃인 연료유로서, 현행 SOLAS상 최저 인화점 기준(60℃) 미만인 연료"}, {"d": 0, "t": "연료전지 사용 선박 임시 안전지침(MSC.1/Circ.1647) 개정은 ZESTAs* 제안(CCC 12/3/1)을 기초문서로 사용하기로 하고, 제4차 대체연료 회기간 작업반(ISWG-AF 4) 개최 승인을 제112차 MSC('26.12.)에 요청하기로 함"}, {"d": 1, "t": "* Zero Emissions Ship Technology Association: 무탄소 선박기술 개발·보급을 위한 국제 비정부기구"}, {"d": 0, "t": "〈의제 4. 신기술·대체연료 선박의 온실가스 감축 지원을 위한 안전 규제체계 개발〉 선상탄소포집설비(OCCS)* 임시 안전지침 개발에 착수하였으며, 우리나라 제안(CCC 12/4/1)을 기초문서로 채택하고 IACS 제안(CCC 12/4)의 세부 요소를 반영하기로 결정함"}, {"d": 1, "t": "* Onboard Carbon Capture and Storage: 선박 배기가스 중 이산화탄소를 선상에서 포집·저장하는 설비"}, {"d": 1, "t": "목표기반·위험도기반 기술중립 체계로, 공통 요건은 본문에, 화학흡수·막분리 등 기술별 안전요건은 부속서에 두는 구조에 합의함"}, {"d": 1, "t": "우리나라 주도로 회기간 실무작업반(CG)을 신설하여 제13차 CCC('27.9.)에 결과를 보고하기로 함"}, {"d": 0, "t": "선박에서 포장·저장된 CO2는 상업용 화물이 아닌 운항 부산물로 보아 IGC 코드를 적용하지 않으며, 이에 따라 IMDG 코드 개정도 필요하지 않은 것으로 결정함"}, {"d": 0, "t": "〈의제 5. 국제해상고체산적화물(IMSBC) 코드 및 보충서 개정〉 제45차 편집·기술작업반(E&T 45)*이 IMSBC 코드 개정안(09-27)을 최종화하여 제113차 MSC('27.6.)에 채택을 요청하기로 함"}, {"d": 1, "t": "* Editorial and Technical Group: 코드 개정안의 편집·기술적 검토를 담당하는 작업반"}, {"d": 1, "t": "새롭게 제안된 개별화물일람표는 대부분 원칙적으로 합의되었으나, 일부 화물은 운송가능수분한계(TML) 시험방법에 대한 우려로 개정안에서 제외되어 추가 검토하기로 함"}, {"d": 1, "t": "산적화물번호 체계 도입은 적용범위 등 미해결 쟁점을 E&T 45에서 추가 검토하기로 하고, 플라스틱 펠릿의 산적운송 금지 제안은 IMSBC 코드에 반영하지 않고 PPR 전문위원회*에 검토를 요청함"}, {"d": 1, "t": "* Sub-Committee on Pollution Prevention and Response: 해양오염방지 대응 전문위원회"}, {"d": 0, "t": "〈의제 6. 국제해상위험물(IMDG) 코드 및 보충서 개정〉 우리나라가 제안한 소듐이온배터리 운송서류 기재사항 개정안(CCC 12/6/1)이 일반적 지지를 받아, 제46차 편집·기술작업반(E&T 46)에서 검토 후 제13차 CCC에 보고하기로 함"}, {"d": 1, "t": "UN 위험물운송전문가소위원회(SCETDG 69)에도 논의결과를 보고하여 UN 모델규정 차원의 검토를 병행하기로 함"}, {"d": 0, "t": "특별규정 188에 따라 개별로 면제된 배터리가 동일 화물운송단위(CTU)에 다량 적재될 경우 위험정보가 전달되지 않는 안전 공백 문제는 IMDG 코드 개정안 준비 시 검토하기로 함"}, {"d": 1, "t": "* 특별규정 376(손상·결함)·377(폐기물)에 따른 운송과 동일하게 소듐이온배터리의 운송서류에 리튬이온배터리와 동일하게 'SODIUM ION BATTERIES FOR DISPOSAL/RECYCLING' 등을 기재하도록 하는 개정안"}, {"d": 0, "t": "〈의제 7. 화물고박지침서 작성지침 개정 및 래싱 소프트웨어 임시 성능기준 개발〉 래싱 소프트웨어를 화물고박지침서의 보완수단으로 허용하는 조화된 임시 성능기준을 포함한 개정 지침(MSC.1/Circ.1353/Rev.2) 추가 개정안이 확정되어 제113차 MSC('27.6.)에서 승인될 예정임"}, {"d": 1, "t": "컨테이너 적재 배치에 따라 고박장치에 작용하는 하중을 계산하여 고박 적정성을 확인하는 프로그램임"}, {"d": 1, "t": "독립형 소프트웨어와 전체계산기 확장 형태를 모두 허용하고, 계산결과 오차는 허용값의 1.0% 미만으로 제한함"}, {"d": 1, "t": "'27.7.1. 이후 건조되는 컨테이너선에 적용하되, 현존선도 주관청 승인 시 자발적으로 적용할 수 있도록 함"}, {"d": 0, "t": "컨테이너 고박장치의 개산방법을 CSS 코드* 신규 부속서로 도입하기 위해 작업범위를 확대하고 목표연도를 2030년으로 연장하는 방안을 제113차 MSC에 상정하기로 함"}, {"d": 1, "t": "* Code of Safe Practice for Cargo Stowage and Securing: 화물 적재 및 고박에 관한 안전실무 코드"}]}]}, {"section": "IMO 소식", "title": "IMO 공지", "source": "", "category": "IMO 공지", "relevance": "하", "brief": "ACT-BIOFOULING 참여국 모집(CL.5231)·2026 국제해사상 후보 추천(CL.5283)·WMU 석사과정 장학 추천(CL.5297), IMO 시상식 개최 안내(CL.5292), IMSAS 1주기 감사결과 공개(CL.5299)·MSW 실태조사 기한연장(CL.5243), 우크라이나·멕시코 항행제한 통보(CL.5304·5305), 런던협약·의정서 과학그룹 회의(LC/SG 50) 개최안내(CL.5298) 등 제26-40~43호 사무국·기타 공지.", "groups": [{"label": "", "bullets": []}, {"label": "회의 및 사무국 공지", "bullets": [{"d": 0, "t": "(사무국) 제13차 선박설계·건조 전문위원회(SDC 13) 개최 안내 (CL.5228, '26.8.28.)"}, {"d": 1, "t": "IMO는 제13차 선박설계·건조 전문위원회(SDC 13)를 '27.5.24.~28. 런던 IMO 본부에서 대면·원격 병행 방식으로 개최하며, 잠정의제와 회의 등록·문서 제출 절차를 안내함"}, {"d": 1, "t": "주요 의제로 SOLAS의 조타 추진 요건 개정, 기관실 경보관리(ECRAM) 성능기준 개발, 신기술·대체연료 사용 선박의 온실가스 감축을 위한 안전규제체계 개발, 선박 수중방사소음 저감 경험축적단계(EBP) 등을 논의할 예정임"}, {"d": 0, "t": "(사무국) IMO 대표단 오리엔테이션 개최 안내 (CL.5269, '26.9.21.)"}, {"d": 1, "t": "IMO는 신규 대표단과 기술전문가 등을 대상으로 '27.1.20. 런던 IMO 본부에서 대면·원격 병행 방식의 오리엔테이션을 개최하며, 참가자는 '27.1.19.까지 OMRS를 통해 등록해야 함"}, {"d": 1, "t": "오리엔테이션은 IMO 조직·위원회 체계, 협약 재개정 절차, 회의 운영, 문서 작성·제출, 대표단 등록·비자, GISIS·IMODOCS 등 IMO 업무 참여에 필요한 기본 절차를 중심으로 진행됨"}, {"d": 0, "t": "(사무국) IMO-WCO 해상여객 사전정보 지침 마련을 위한 소그룹 구성 안내 (CL.5273, '26.9.17.)"}, {"d": 1, "t": "IMO는 '26.4.27.~28. 개최된 제22차 API*·BRI**/PNR 데이터 연락위원회 결과에 따라, 해상운송의 여객 사전정보(API) 및 예약정보(BRI)에 관한 IMO-WCO 공동지침 마련을 위한 소그룹(Mini-Group)을 구성했다고 안내함"}, {"d": 1, "t": "소그룹은 FAL 50에서 승인된 FAL 협약 개정안과 연계해 '26.12월 중순까지 지침 초안을 마련하고, WCO가 '27.1.8.까지 FAL 51에 제출할 수 있도록 작업을 진행할 예정임. 이후 '27.1.18.~19. 연락위원회 검토를 거쳐 그 결과를 '27.2.5.까지 FAL 51에 보고할 계획임"}, {"d": 1, "t": "* Advance Passenger Information: 선박 운항 전 당국에 제공되는 여객의 사전 신원정보"}, {"d": 1, "t": "* Booking and Reservation Information: 여객의 선박 예약·예약변경 등과 관련된 정보"}]}, {"label": "기타 공지", "bullets": [{"d": 0, "t": "(쿡제도) 자국 국적선 MV VOLGA 4007 피격 관련 동보 (CL.5271, '26.9.16.)"}, {"d": 1, "t": "쿡제도 정부는 자국 국적선 MV VOLGA 4007이 '26.8.19. 흑해에서 운항 중 공격을 받아 손상됐으며, 승선원 12명 전원이 대피했다고 IMO에 동보함. 다만 승무원 3명이 경미한 부상을 입어 치료를 받았다는 정보는 현재 확인 중이라고 밝힘"}, {"d": 1, "t": "쿡제도는 선주·선박관리자 및 관계 당국과 사고 경위와 선박 상태를 확인 중이며, 분쟁과 안보위협이 높은 해역을 운항하는 선박과 선원의 안전에 우려를 표명하고 추가 확인사항이 확보되는 대로 관련 정보를 제공하겠다고 밝힘"}, {"d": 0, "t": "(러시아) 우크라이나의 상선·해상시설 공격 관련 입장 동보 (CL.5274, '26.9.18.)"}, {"d": 1, "t": "러시아 정부는 '24.12월 이후 지중해·발트해 등에서 유조선 등 상선과 관련 인프라에 대한 공격이 이어졌으며, '25.4월~'26.4월에는 자국 선박·항만 및 항만 인프라를 대상으로 무인기, 무인수상정을 이용한 공격이 50건 이상 발생했다고 주장함"}, {"d": 1, "t": "러시아는 이러한 공격이 우크라이나와 이를 지원하는 서방국가들에 의해 이뤄지고 있다고 주장하며, IMO 회원국에 아조프해와 흑해 러시아 해역에서 민간 상선을 대상으로 한 공격을 규탄할 것을 촉구함"}]}]}, {"section": "국제해사동향", "title": "미국 방산 스타트업, 일본 조선소와 자율운항 상륙정 개발 추진", "source": "The Maritime Executive, '26.9.21.", "category": "기타", "relevance": "하", "brief": "미 방산 스타트업 Bulwark Dynamics, 일본 Onomichi Dockyard와 무인 자율운항 상륙정 'Caravel' 개발. 분산해양작전(DMO) 개념의 군수수송·해안 보급용, 우크라이나전 무인상륙정 실전사례 참고.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "미국 방산기술 스타트업 Bulwark Dynamics는 일본 Onomichi Dockyard와 함께 전투지역에 인명 투입 없이 화물을 수송할 수 있는 자율운항 상륙정 'Caravel'을 개발하고 있음"}, {"d": 1, "t": "Onomichi Dockyard는 일본 혼슈 서부 오카야마 인근의 중소 조선소로, Bulwark의 초기 680만 달러 규모의 투자에도 참여했으며, 투자금은 Caravel 시제품 제작과 시험에 사용될 예정임"}, {"d": 0, "t": "Bulwark는 Caravel을 미 해군의 분산해양작전(DMO)*에 필요한 군수물자 수송수단으로 제시하고 있음"}, {"d": 1, "t": "서태평양 연안에서 병력과 군수체계를 분산해 공격 위험을 낮추는 작전 개념에 맞춰, 다수의 소형 자율운항 상륙정을 활용함으로써 보급선과 물자기지에 대한 공격 위험을 분산한다는 구상임"}, {"d": 1, "t": "* Distributed Maritime Operations: 함정과 전력을 여러 지역에 분산 배치해 적의 공격에 대한 취약성을 낮추는 미 해군의 작전 개념"}, {"d": 0, "t": "Caravel은 항만시설이 없는 해안까지 화물을 자율적으로 운송·하역하도록 설계되며, 병력의 상륙작전 투입을 목적으로 하지 않음"}, {"d": 1, "t": "선박이 스스로 항해해 해안에 접안한 뒤 선수 램프를 내려 화물을 하역하고 다시 이안하는 전 과정을 현장 인력 없이 수행하는 방식임"}, {"d": 1, "t": "Bulwark는 저비용의 선박 여러 척으로 보급을 분산해 일부 선박 손실이 전체 보급 중단으로 이어지는 위험을 줄인다는 구상임"}, {"d": 0, "t": "해안 접안이 가능한 무인 상륙정은 우크라이나 전쟁에서도 소규모로 실제 운용된 사례가 있음"}, {"d": 1, "t": "지난 7월 우크라이나 제123영토방위여단은 Kinburn Spit의 러시아 진지를 공격하는 과정에서 선수 램프와 자폭공격 로봇 1대를 탑재한 원격조종 상륙정을 투입했으며, 해당 선박의 해안 상륙 작전 초기 과정이 영상으로 확인됨"}]}]}]}, {"id": "26-38", "seq": 38, "issue_date": "2026-10-12", "posted": "2026-10-12", "board_no": 690, "url": "https://www.imokorea.org/board/board.asp?B_ID=Inter_Maritime&ty=view&page=1&bandstart=1&findtype=&findstr=&idx=6756&ii=690", "pdf": "(26-38호) IMO소식 및 국제해사동향.F.pdf", "pages": 7, "file": "2026/2026-10/IMO소식_26-38호_20261012.html", "items": [{"section": "IMO 소식", "title": "IMO 사무총장, 해적 피랍선 구조 중 선원 사망에 대응 촉구", "source": "IMO Media Centre, '26.10.2.", "category": "해사보안", "relevance": "중", "brief": "소말리아 해역 HONOUR 25호 구조작전 중 선원 5명 사망, IMO 사무총장 애도. 피랍선 3척(HONOUR 25·SEAMULL/SIBU 1·MT EUREKA) 44명 구조, ASANA호 선원 22명 여전히 억류. 아덴만 해적 대응 국제협력 촉구.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "아르세니오 도밍게스 IMO 사무총장은 '26.9.29. 소말리아 해역에서 피랍된 HONOUR 25호에 대한 구조작전 중 선원 5명이 사망한 데 애도를 표하고, 국제사회에 선원 보호 강화를 촉구함"}, {"d": 1, "t": "도밍게스 사무총장은 구조 과정에서 다수의 선원도 중상을 입어 부상자들이 필요한 치료와 지원을 받을 수 있도록 관계자들에게 지속적으로 요청하겠다고 밝힘"}, {"d": 0, "t": "HONOUR 25호를 비롯해 해적과 무장강도에 피랍됐던 선박 3척에서 총 44명의 선원이 구조됐으며, 각국 정부가 이들의 송환을 추진하고 있음"}, {"d": 1, "t": "HONOUR 25호와 함께 SEAMULL(SIBU 1)호 및 MT EUREKA호의 선원들도 유사한 조치를 통해 석방됐으며, 도밍게스 사무총장은 이들의 석방을 위한 소말리아 정부의 노력에 감사를 표함. 다만 올해 피랍된 ASANA호에는 선원 22명이 여전히 억류돼 있음"}, {"d": 0, "t": "사무총장은 서인도양 아덴만 지역에서의 해적 행위를 억제하기 위해 국제사회의 협력과 자원 투입이 필요하다고 강조함"}, {"d": 1, "t": "그는 유엔안보리 및 EU에서도 해사안보와 관련된 사항을 논의했다고 밝히면서, 과거 국제사회의 공동 대응 경험을 언급하며 기존 조치와 모범관행의 이행을 강조함"}]}]}, {"section": "IMO 소식", "title": "IMO 공지", "source": "", "category": "IMO 공지", "relevance": "하", "brief": "ACT-BIOFOULING 참여국 모집(CL.5231)·2026 국제해사상 후보 추천(CL.5283)·WMU 석사과정 장학 추천(CL.5297), IMO 시상식 개최 안내(CL.5292), IMSAS 1주기 감사결과 공개(CL.5299)·MSW 실태조사 기한연장(CL.5243), 우크라이나·멕시코 항행제한 통보(CL.5304·5305), 런던협약·의정서 과학그룹 회의(LC/SG 50) 개최안내(CL.5298) 등 제26-40~43호 사무국·기타 공지.", "groups": [{"label": "", "bullets": []}, {"label": "사무국 공지", "bullets": [{"d": 0, "t": "(사무국) 2027 극지해사 세미나 개최 안내 (CL.5287, '26.10.1.)"}, {"d": 1, "t": "IMO는 북극이사회 의장국인 덴마크와 공동으로 2027 극지해사세미나(PAME, Polar Maritime Seminar)를 '27.2.1.~2. 런던 IMO 본부에서 대면으로 개최하며, 참가자는 '27.1.26.까지 등록해야 함을 안내함"}, {"d": 1, "t": "세미나는 극지항해의 현안, 국제 법 정책 동향, 시장 교역 변화, 북극 원주민 지역사회에 대한 사회·경제·문화·환경적 고려사항, 북극 항만, 최근 최초사고 사례, 연구선 운항 경험 및 극지 수역 어선 안전 등을 논의할 예정임"}]}, {"label": "기타 공지", "bullets": [{"d": 0, "t": "(탄자니아) 자국 국적선 M/V MARIAM M 피격 관련 통보 (CL.5284, '26.9.29.)"}, {"d": 1, "t": "탄자니아 정부는 자국 국적 화물선 M/V MARIAM M이 '26.9.17. 우크라이나 항만으로 향하던 중 러시아 무인항공기(UAV)의 공격을 받아 선장이 사망하고 선원 3명이 부상했다는 정보를 우크라이나 당국으로부터 전달받았다고 IMO에 통보함. 다만 선박 피해 규모와 정확한 사고 위치 경위 등은 아직 확인 중이라고 밝힘"}, {"d": 1, "t": "탄자니아는 민간 상선과 선원에 대한 공격을 규탄하고, 잔지바르 해사청 등 관계기관이 선사·연안국·수색구조 당국 및 관련국과 사고 사실을 확인 중이며, IMO에도 해당 사건과 관련 모니터링 보고 체계에 반영해 줄 것을 요청함"}, {"d": 0, "t": "(방글라데시) 해기사 생도 장학 프로그램 안내 (CL.5285, '26.9.29.)"}, {"d": 1, "t": "방글라데시 정부는 아프리카·카리브해 태평양 지역 군소도서개도국(SIDS)과 아프리카 최빈개도국(LDCs)을 대상으로 '26~'27학년도 해기사 생도 교육 전액 장학금 10명을 지원하며, 항해·기관 분야에 각각 5명을 배정한다고 안내함. 여성 지원자를 우대하며 최대 5명을 선발할 수 있음"}, {"d": 1, "t": "교육은 방글라데시 해양대학(Bangladesh Marine Academy, Chattogram)에서 '27.1.15.부터 2년간 진행되며, 학비·숙식·항공료·의료지원과 월 50달러의 생활비 등을 지원함. 각 국가는 후보자를 선정해 '26.12.31.까지 IMO 업무 담당 부처를 통해 제출해야 함"}, {"d": 0, "t": "(앤티가바부다) 레드엔사인그룹 요트 코드 동등협정 적용 통보 (CL.5277, '26.9.25.)"}, {"d": 1, "t": "앤티가바부다 정부는 길이 24m 이상, 총톤수 3,000톤 미만의 상업운항 요트에 대해 영국 레드엔사인그룹 요트 코드(REG Code)를 SOLAS·LL·STCW 협약상 요건과 동등한 기준으로 인정·적용한다고 IMO에 통보함"}, {"d": 1, "t": "이에 따라 앤티가바부다 국적의 적격 레저요트는 레저선 등록을 유지하면서 연간 최대 84일까지 상업적 용선에 투입할 수 있으며, 최대 승객 수는 12명으로 제한됨. 관련 증서는 앤티가바부다 해사당국 또는 승인기관이 발급함"}, {"d": 1, "t": "* Red Ensign Group Yacht Code: 영국 및 레드엔사인그룹 회원 관할지역이 대형 상업용 요트에 적용하는 안전·설계 운항 기준"}]}]}, {"section": "국제해사동향", "title": "IMO NOx Tier III 규제 시행 10년에도 대기질 개선 효과 미흡", "source": "Lloyd's List, '26.9.29.", "category": "탈탄소", "relevance": "상", "brief": "Tier III 규제('16년 이후 건조선박 적용, SCR 설치 확대) 10년에도 ECA 내 NOx 감축 효과 미흡(IACCSEA). 저부하(25% 미만) 시험기준 사각지대로 SCR 미가동 관행 지적, Tier III 적용 선박 5%대. ICCT는 저부하 시험점 도입 등 시험기준 개선 제안.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "IMO의 질소산화물(NOx) Tier III 규제가 시행된 지 10년이 지났으나, 배출통제구역(ECA) 내 NOx 감축과 대기질 개선 효과는 제한적인 것으로 지적됨"}, {"d": 1, "t": "Tier III 기준은 '16.1.1. 이후 건조 선박에 적용되며, 이에 따라 선택적촉매환원장치(SCR)* 설치가 확대됐음. 그러나 국제선박촉매배출협회(IACCSEA)는 규제 시행 이후 ECA 내 NOx가 유의미하게 감소하지 않았으며 오히려 증가했다고 주장함"}, {"d": 1, "t": "* IMO MARPOL Annex VI에 따른 선박용 디젤엔진의 질소산화물 배출기준 중 가장 엄격한 단계임"}, {"d": 1, "t": "** Selective Catalytic Reduction: 요소수 등을 이용해 선박 엔진 배기가스의 질소산화물을 저감하는 장치임"}, {"d": 0, "t": "저부하 운항 시 적용되는 현행 시험기준과 SCR 운용 방식이 Tier III 규제의 실효성을 낮추는 주요 문제로 제기됨"}, {"d": 1, "t": "선박은 항만·연안에서 저속 운항하면서 엔진 부하가 낮아지지만, 다수 선사는 부하 25% 미만에서 SCR 가동을 중단하고 있음"}, {"d": 1, "t": "적절한 열관리를 적용하면 10% 수준에서도 SCR 운용이 가능하지만, 현행 규정은 25% 미만에서 NOx 배출량을 측정하도록 요구하지 않는다고 IACCSEA는 설명함"}, {"d": 0, "t": "Tier III 적용을 피할 수 있었던 건조시점 기준과 운항비용 부담도 규제 효과를 제약하는 요인으로 지적됨"}, {"d": 1, "t": "일부 선주는 '16년 적용 시점 직전 용골을 거치한 뒤 수년 후 선박을 완공해 완화된 Tier II 기준을 적용받았으며, SCR 설치 선박도 요소수 비용과 높은 엔진부하에서의 연료소모 증가 때문에 장치를 적극적으로 사용하지 않는 것으로 알려짐"}, {"d": 1, "t": "IACCSEA는 국제항해 선박 중 Tier III 기술을 탑재한 선박이 5%를 조금 넘는 수준으로 추산함"}, {"d": 0, "t": "국제청정교통위원회(ICCT)는 실제 저부하 운항 사항을 반영하도록 IMO의 엔진 시험기준을 조정할 필요가 있다고 주장함"}, {"d": 1, "t": "ICCT는 ECA 운항 선박이 시간의 약 3분의 1을 25% 미만 엔진부하에서 운항하며, Tier III 인증 선대는 실제 운항시간의 90% 이상을 75% 미만 부하에서 운항하는 것으로 분석함. 이에 10% 저부하 시험점도 도입하고, 10% 이상 부하부터 NOx 상한기준을 적용하는 방안을 제안함"}, {"d": 0, "t": "NOx 규제 개선 논의는 향후 IMO 오염방지 대응 전문위원회(PPR)에서 다시 다뤄질 가능성이 있으나 단기간 내 해결은 어려울 것으로 전망됨"}, {"d": 1, "t": "ICCT는 기존 IMO 시험기준이 선박이 운항시간의 70%를 75% 미만 엔진부하에서 운항한다는 30년 전 ISO 기준에 기반해 실제 운항과 괴리가 있다고 지적함"}, {"d": 1, "t": "Lloyd's List는 신속한 해결책이 마련되지 않을 경우, 항만 지역의 NOx 배출이 계속 증가할 것으로 전망함"}]}]}, {"section": "국제해사동향", "title": "글로벌 공급망, 비용 최적화에서 회복탄력성 중심으로 전환", "source": "Lloyd's List, '26.10.6.", "category": "항로·물류", "relevance": "중", "brief": "지정학적 불확실성·관세 변동으로 화주들이 비용절감보다 회복탄력성·선택권 우선. 공급업체 다변화·니어쇼어링·프렌드쇼어링 확대, 대체항로·복합운송망이 경쟁력 요소로 부상. DP World 설문: 공급망 관리가 성장전략 핵심요소로 격상.", "groups": [{"label": "", "bullets": [{"d": 0, "t": "지정학적 불확실성과 관세 변동, 지속적인 무역 차질로 글로벌 화주들이 비용 절감보다 회복탄력성과 공급망 선택권을 우선하는 방향으로 전략을 전환하고 있음"}, {"d": 1, "t": "DP World가 고위급 공급망책임자 103명을 조사한 결과, 84%는 회복탄력성과 선택권이 비용 절감을 넘어 공급망 전략의 주요 동인이 됐다고 응답함. 기업들은 홍해 우회, 관세 분쟁 등에 대응해 조달·생산·재고·운송망에 유연성을 확대하고 있음"}, {"d": 0, "t": "관세 불확실성이 장기화되면서 기업들은 공급처 다변화와 재고 확대, 니어쇼어링·프렌드쇼어링 등을 통해 공급망을 재편하고 있음"}, {"d": 1, "t": "응답자의 90%는 최근 관세 변화가 투자·조달·공급망 결정에 이미 영향을 미치고 있다고 답했으며, 83%는 관세 불확실성이 향후에도 전략에 상당한 영향을 미칠 것으로 전망함"}, {"d": 1, "t": "향후 12개월간 71%는 공급업체 다변화, 59%는 재고 확대, 57%는 니어쇼어링, 48%는 공급망 일부의 프렌드쇼어링을 검토하고 있음"}, {"d": 1, "t": "* Nearshoring: 생산·조달 거점을 최종시장과 가까운 국가나 지역으로 이전하는 공급망 전략"}, {"d": 1, "t": "** Friend-shoring: 공급망을 정치·경제적으로 우호적인 국가 중심으로 재편하는 전략"}, {"d": 0, "t": "대체항로와 복합운송망 확보가 단순한 비상대응 수단을 넘어 해운·물류 분야의 경쟁력 요소로 부상하고 있음"}, {"d": 1, "t": "응답자의 86%는 대체·복합운송 항로에 대한 접근성이 경쟁우위가 되고 있다고 답했으며, DP World는 기업들이 항로 선택권을 공급망 차별화뿐 아니라 비용·속도·시장 접근성을 조율하며 성장을 지원하는 수단으로 활용하고 있다고 설명함"}, {"d": 0, "t": "공급망 관리가 기업의 운영지원 기능에서 성장투자 및 위험관리를 좌우하는 전략적 역할로 확대되고 있음"}, {"d": 1, "t": "응답자의 93%는 지난 3년간 기업 성장에서 자신의 역할이 더욱 중요해졌다고 답했으며, 87%는 공급망 관리가 경영진의 의사결정에서 핵심 요소가 됐다고 평가함. 또한 절반은 디지털 통합과 공급망 전 과정의 가시성을 향후 성장에 가장 중요한 역량으로 꼽았으며, 70%는 수요예측에 AI를 활용하고 있음"}, {"d": 0, "t": "DP World는 기업들이 불확실성 속에서도 성장을 지속하기 위해 효율성과 유연성을 함께 갖춘 공급망 구축에 나서고 있다고 평가함"}, {"d": 1, "t": "DP World의 Yuvraj Narayan 그룹 최고경영자는 기업들이 성장을 축소하기보다 조달지역, 운송방식 및 고객 접근방식의 선택지를 확대하고 있다며, 선택권·가시성·연결성을 확보한 네트워크 구축이 중요해지고 있다고 설명함"}]}]}]}, {"id": "26-39", "seq": 39, "issue_date": "2026-10-20", "posted": "2026-10-21", "board_no": 691, "url": "https://www.imokorea.org/board/board.asp?B_ID=Inter_Maritime&ty=view&page=1&bandstart=1&findtype=&findstr=&idx=6757&ii=691", "pdf": "(26-39호) IMO소식 및 국제해사동향.F.pdf", "pages": 7, "file": "2026/2026-10/IMO소식_26-39호_20261020.html", "items": [{"section": "IMO 소식", "title": "LC/LP 당사국, 해양지구공학 연구활동 평가체계 채택", "source": "IMO Media Centre, '26.10.9.", "category": "탈탄소", "relevance": "하", "brief": "런던협약·의정서 당사국이 해양지구공학(해양 비옥화·해양 알칼리도 증진·바이오매스 해양 침강) 연구활동 평가체계 3종을 결의서로 채택. FRP 선박 폐기관리 지침도 승인.", "groups": [{"label": "", "bullets": [{"d": 1, "t": "런던협약 및 런던의정서 당사국들은 해양지구공학 연구의 환경위험을 평가하기 위한 3가지 평가체계를 채택함"}, {"d": 2, "t": "당사국들은 '26.10.5~9. 영국 런던 IMO 본부에서 개최된 제48차 런던협약 협의당사국회의 및 제21차 런던의정서 당사국회의(LC 48/LP 21)에서 해양 비옥화, 해양 알칼리도 증진 및 바이오매스 해양 침강에 관한 평가체계를 결의서로 채택함"}, {"d": 1, "t": "당사국들은 해양의 이산화탄소 흡수·저장 능력을 높이는 해양지구공학 기술의 생태계 영향이 충분히 규명되지 않은 점을 고려해 연구활동에 3가지 평가체계를 적용하기로 함"}, {"d": 2, "t": "① 해양 비옥화(Ocean fertilization): 해수에 영양분을 공급해 식물플랑크톤의 성장을 촉진하고 대기 중 이산화탄소를 흡수하는 방식임"}, {"d": 2, "t": "② 해양 알칼리도 증진(Ocean alkalinity enhancement): 해수에 알칼리성 물질을 첨가해 이산화탄소 흡수능력을 높이고 해양 산성화를 완화하는 방식임"}, {"d": 2, "t": "③ 바이오매스 해양 침강(Ocean sinking of biomass): 해양·육상 식물 등 생물학적 물질을 의도적으로 해양에 투입해 탄소를 저장하는 방식임"}, {"d": 1, "t": "새로운 평가체계는 각국 정부가 연구의 과학적 타당성과 해양환경 위험을 개별적으로 심사하도록 규정함"}, {"d": 2, "t": "평가절차는 초기 심사, 환경영향 평가, 위험관리, 의사결정 및 사업 종료 후 검토로 구성되며, 새로운 정보가 확보되면 평가를 재검토할 수 있음"}, {"d": 2, "t": "모든 연구 제안은 정당한 과학적 목적, 환경위험에 대한 충분한 평가, 이해관계자 협의, 동료평가, 엄격한 모니터링 및 투명한 보고체계를 갖추어야 함"}, {"d": 1, "t": "당사국들은 해양환경 보호를 최우선으로 연구를 신중하게 추진하고, 연구단계를 넘어서는 활동에는 추가적인 과학적 검토가 필요하다고 강조함"}, {"d": 2, "t": "IMO 아르세니오 도밍게스 사무총장은 해양지구공학에 대한 과학계·산업계·대중의 관심이 증가하는 상황에서 이번 평가체계가 규제기관과 연구자에게 엄격하고 투명한 심사수단을 제공한다고 평가함"}, {"d": 1, "t": "당사국들은 유리섬유강화플라스틱 선박의 폐기관리 지침을 승인하고 해양생물다양성 협정(BBNJ 협정)과의 연계 검토를 추진하기로 함"}, {"d": 2, "t": "유엔환경계획(UNEP)과 협력해 개발한 유리섬유강화플라스틱(FRP) 선박의 수명 종료 후 관리 및 해상 폐기 대안에 관한 지침을 승인함"}, {"d": 2, "t": "아울러 런던협약·의정서와 국가관할권 이원지역에 대한 BBNJ 협정의 관계를 검토하기 위한 회기간 작업에 합의함"}]}]}, {"section": "IMO 소식", "title": "IMO 공지", "source": "", "category": "IMO 공지", "relevance": "하", "brief": "ACT-BIOFOULING 참여국 모집(CL.5231)·2026 국제해사상 후보 추천(CL.5283)·WMU 석사과정 장학 추천(CL.5297), IMO 시상식 개최 안내(CL.5292), IMSAS 1주기 감사결과 공개(CL.5299)·MSW 실태조사 기한연장(CL.5243), 우크라이나·멕시코 항행제한 통보(CL.5304·5305), 런던협약·의정서 과학그룹 회의(LC/SG 50) 개최안내(CL.5298) 등 제26-40~43호 사무국·기타 공지.", "groups": [{"label": "", "bullets": []}, {"label": "회의 및 사무국 공지", "bullets": [{"d": 1, "t": "(사무국) IMO 제35차 총회 이사국 선거 관련 후보국 제출자료 안내 (CL.5272, '26.10.7.)"}, {"d": 2, "t": "IMO는 제35차 총회에서 '28~'29년 임기 이사국 선거를 실시할 예정이며, 후보국에 선거 출마 서한은 1쪽, 첨부 설명자료는 2쪽 이내로 작성하고 사진은 포함하지 말도록 요청함. 이는 대량의 선거자료 번역 부담을 줄이기 위한 조치임"}, {"d": 2, "t": "IMO는 후보국의 추가 홍보자료 공유를 위해 IMODOCS 총회 문서 항목에 가상 정보공유 포털(Virtual Portal)을 개설할 예정이며, 자료를 게시하려는 회원국은 문서제출포털에서 'Assembly 35' 및 'Virtual Portal'을 선택해 제출하도록 안내함"}, {"d": 1, "t": "(사무국) IMO NextWave Seafarers 2단계 승선실습 프로그램 후보자 추천 안내 (CL.5286, '26.10.12.)"}, {"d": 2, "t": "IMO는 사우디아라비아 정부 및 국영선사 Bahri와 협력해 NextWave Seafarers(NWS)* 2단계 승선실습 프로그램을 추진하며, 군소도서개도국(SIDS)·최빈개도국(LDCs)·내륙개도국(LLDCs)** 출신 해기사 생도 최소 30명에게 최대 6개월간 승선실습 기회를 제공할 계획이며, 여성 참여율을 50%를 목표로 함"}, {"d": 2, "t": "IMO는 대상국의 해사당국에 국가별 최대 2명의 후보자를 '26.12.31.까지 추천하도록 요청함. 선발자는 Bahri 운항 선박에서 실습하며, 사우디아라비아와 Bahri가 실습비 월별 수당·항공료·비자비용을 지원하고 IMO가 승하선 이동 중 체재비를 부담함"}, {"d": 2, "t": "** Landlocked Developing Countries: 바다에 직접 접하지 않은 내륙개도국"}, {"d": 1, "t": "(사무국) IMO NextWave Seafarers 2단계 글로벌 워크숍 개최 안내 (CL.5290, '26.10.12.)"}, {"d": 2, "t": "IMO는 NextWave Seafarers(NWS)* 프로그램의 글로벌 확대를 위해 '26.11.20. 런던 IMO 본부에서 글로벌 워크숍을 개최하며, 시범사업 성과와 운영 경험을 공유하고 추가 선사·회원국 참여를 위한 협력방안을 논의할 예정임"}, {"d": 2, "t": "IMO는 회원국과 선사에 개발도상국 해기사 생도의 승선실습 기회 확대를 위한 참여를 요청하고, 각국 선주협회와 선사에 관련 내용을 전파하도록 권고함. 참석 희망자는 '26.11.10.까지 이메일로 등록해야 하며, 워크숍 기간 중 양자회의도 신청할 수 있음"}, {"d": 2, "t": "* NextWave Seafarers(NWS): IMO와 사우디아라비아가 협력해 개발도상국 해기사 생도에게 승선실습 기회를 제공하는 선원 양성 사업"}]}]}, {"section": "국제해사동향", "title": "미국 Bluecore, 해상 원자력발전 사업 본격 추진", "source": "Splash247, '26.10.13.", "category": "에너지", "relevance": "중", "brief": "미국 Bluecore Energy가 저농축우라늄 확보 및 핵연료 제조를 병행하며 10MW급 부유식 원자력발전설비 개발 추진. NRC·USCG 인허가 협의 개시, ABS로부터 개념설계 기본승인(AiP) 획득.", "groups": [{"label": "", "bullets": [{"d": 1, "t": "미국 해상 원자력 기술기업 Bluecore Energy는 최초의 부유식 원자력발전설비 개발을 위해 저농축우라늄을 확보하고, 핵연료 제조와 규제 승인 및 선급 인증 절차를 병행하고 있음"}, {"d": 2, "t": "캘리포니아주 롱비치에 본사를 둔 Bluecore는 핵연료 중개업체 WMC를 통해 우라늄-235 농축도 4.95%의 육불화우라늄(UF6)을 구매했으며, 해당 물질은 현재 캘리포니아주 외부의 미국 핵연료 시설에 보관 중임"}, {"d": 2, "t": "확보된 우라늄은 향후 이산화우라늄으로 변환한 뒤 핵연료 펠릿으로 가공될 예정이며, Bluecore는 핵연료 제작에 필요한 시험과 검증을 준비하고 있음"}, {"d": 2, "t": "* 육불화우라늄(UF6): 우라늄 농축 과정에 사용되는 핵분열성 화합물로, 핵연료를 제작하기 위해 이산화우라늄으로 변환됨"}, {"d": 1, "t": "Bluecore는 항만 데이터센터 연안 기반시설에 전력을 공급하기 위해 10MW급 원자로를 바지선에 탑재하는 부유식 원자력발전설비를 개발하고 있음"}, {"d": 2, "t": "해당 설비는 해상 설치형으로 설계된 소형 수냉식 원자로를 활용하며, 초기에는 육상 시설에 전력을 공급하고 장기적으로는 선박 추진동력으로 활용하는 방안도 검토하고 있음"}, {"d": 2, "t": "Bluecore는 올해 7월 사업을 공개한 이후 9월 투자유치를 통해 5,000만 달러를 확보했으며, 앞서 조달한 1,000만 달러를 포함한 자금을 설계·장비개발·시험·규제 대응 및 제조 등에 투입할 계획임"}, {"d": 1, "t": "Bluecore는 미국 원자력규제위원회(NRC) 및 해안경비대(USCG)와 인허가 협의를 시작했으며, 미국선급(ABS)으로부터 부유식 원자력발전설비 개념설계에 대한 기본승인(AiP)을 획득함"}, {"d": 2, "t": "Bluecore는 올해 8월 NRC와 첫 사전협의를 진행해 원자로 설계와 인허가 절차를 논의했으며, USCG도 참여해 원자력 규제와 해사 관련 요건의 적용 문제를 검토함"}, {"d": 2, "t": "ABS는 지난 6월 해당 설비에 기본승인을 부여하고 향후 설계 구체화 과정에서 충족해야 할 기술·선급 요건을 제시함. Bluecore는 이를 미국에서 설계된 부유식 원자력발전소에 대한 최초의 승인이라고 설명함"}, {"d": 1, "t": "Bluecore는 롱비치항에서 비핵연료 원자로 시제품의 조립 시험을 진행하는 한편, 실제 설비 가동에 필요한 연방정부 인허가와 안전승인 절차를 추진하고 있음"}, {"d": 2, "t": "Bluecore는 롱비치항 Pier D에 연구시설과 바지선 시험공간을 확보했으며, 현재 항만시설에는 가동 중인 원자로나 핵연료를 보관하지 않고 원자력 관련 시험은 별도 장소에서 실시할 계획임"}, {"d": 2, "t": "미국 해사청(MARAD)과 롱비치항은 지난 7월 선박·항만터미널 등에 소형모듈원자로를 적용하기 위한 협약을 체결했으며, Bluecore는 최초 원자로의 가동일을 아직 발표하지 않은 상태로 항만 설치 장소는 연방 인허가, 선급, 환경 및 현장별 안전승인에 따라 결정될 예정임"}]}]}, {"section": "국제해사동향", "title": "중국, 서방 의존도 낮추기 위한 해상보험 역량 강화 추진", "source": "Lloyd's List, '26.10.12.", "category": "기타", "relevance": "하", "brief": "중국이 러시아 원유 제재·호르무즈 사태를 계기로 런던 중심 해상보험 의존도를 낮추기 위해 자국 보험·재보험 역량 강화 추진. 2024년 재보험 침투율 4.6%(세계평균 12.5%)로 국제위험 자체인수 역량은 아직 제한적.", "groups": [{"label": "", "bullets": [{"d": 1, "t": "중국은 서방의 경제제재와 지정학적 갈등으로 해상보험의 전략적 중요성이 커짐에 따라, 런던 중심의 보험시장에 대한 의존도를 줄이고 자국의 해상보험·재보험 역량 강화를 추진하고 있음"}, {"d": 2, "t": "중국은 세계 최대 화물보험 시장이자 두 번째로 큰 선박보험 시장을 보유하고 있으나, 중국 교통운수부는 자국 보험사의 인수능력이 부족해 상당수 원양선박이 여전히 런던 보험시장에 의존하고 있다고 인정함"}, {"d": 2, "t": "특히 중국은 서방 보험사가 보험료와 위험 인수 여부를 결정하는 구조가 자국 해운에 대한 제재 수단으로 활용될 수 있다고 우려하며, 2024년 중국 공산당 제20기 중앙위원회 제3차 전체회의에서 처음으로 해상보험 역량 강화와 국제시장 진출 확대를 주요 개혁과제에 포함함"}, {"d": 1, "t": "2022년 러시아의 우크라이나 침공 이후 시행된 서방의 원유 가격 상한제와 2026년 호르무즈 해협 사태는 중국이 해상보험의 해외 의존도를 줄이려는 주요 배경으로 작용함"}, {"d": 2, "
