  svg{display:block;max-width:100%}
  .axis{stroke:var(--line)} .gridline{stroke:var(--line);stroke-dasharray:3 3}
  .tick{fill:var(--muted);font-size:10px}

/* Column sorting. A header with data-k is clickable: first click sorts
   descending (newest date / biggest gap on top, which is what is looked for),
   second click flips. Only the body is redrawn so the header state survives */
function sortRows(list, state, getters) {
  if (!state.key) return list;
  const get = getters[state.key];
  return [...list].sort((a, b) => {
    const x = get(a), y = get(b);
    if (x == null && y == null) return 0;
    if (x == null) return 1;
    if (y == null) return -1;
    return (x < y ? -1 : x > y ? 1 : 0) * state.dir;
  });
}

function bindSort(root, state, draw) {
  const ths = root.querySelectorAll("th[data-k]");
  const mark = () => ths.forEach((th) => {
    th.classList.toggle("asc", state.key === th.dataset.k && state.dir === 1);
    th.classList.toggle("desc", state.key === th.dataset.k && state.dir === -1);
  });
  ths.forEach((th) => {
    th.onclick = () => {
      if (state.key === th.dataset.k) state.dir = -state.dir;
      else { state.key = th.dataset.k; state.dir = -1; }
      mark();
      draw();
    };
  });
  mark();
}

  ["summary", "요약"], ["matrix", "매트릭스"], ["alerts", "알림"],
  ["reporting", "보고이력"], ["vessel", "선박 상세"], ["review", "검수"],
];

function initTabs() {
  const nav = $("tabs");
  TABS.forEach(([key, label], i) => {
    const b = document.createElement("button");
    b.textContent = label;
    b.className = i === 0 ? "on" : "";
    b.onclick = () => {
      [...nav.children].forEach((c) => c.classList.remove("on"));
      b.classList.add("on");
      TABS.forEach(([k]) => $("tab-" + k).classList.remove("on"));
      $("tab-" + key).classList.add("on");
    };
    nav.appendChild(b);
  });
}

/* deviation colour: pocket (surplus) green, short red, scaled by size */
function devColor(pct) {
  if (pct === null || isNaN(pct)) return "transparent";
  const a = Math.min(Math.abs(pct) / 4, 1) * 0.75 + 0.08;
  return pct >= 0 ? `rgba(63,178,127,${a})` : `rgba(226,84,74,${a})`;
}

function renderSummary() {
  const s = DATA.stats, T = DATA.thresholds;
  const rep = {};
  DATA.reporting.vessels.forEach((v) => { rep[v.code] = v; });
  const latest = {};
  DATA.rows.forEach((r) => {
    if (!latest[r.code] || r.date > latest[r.code].date) latest[r.code] = r;
  });
  const rows = Object.values(latest);

  /* Counts are "as of now": only alerts on each vessel's newest report.
     FO is what gets judged; DO/MGO parcels are small so a few MT swings the
     percentage - those stay reference only */
  const RANK = { high: 2, warn: 1 };
  const cur = {};   // code -> { FO: "high"|"warn"|null, DO: ... }
  rows.forEach((r) => { cur[r.code] = { FO: null, DO: null }; });
  DATA.alerts.forEach((a) => {
    const v = latest[a.code];
    if (!v || a.date !== v.date || !cur[a.code]) return;
    const now = cur[a.code][a.section];
    if (!now || RANK[a.sev] > RANK[now]) cur[a.code][a.section] = a.sev;
  });
  const n = (sec, sev) => rows.filter((r) => cur[r.code][sec] === sev).length;
  const gap = DATA.reporting.vessels.filter((v) => v.sev !== "ok").length;
  const kpis = [
    [s.vessels, "선박"],
    [n("FO", "high"), "FO 심각"], [n("FO", "warn"), "FO 주의"],
    [n("DO", "high") + n("DO", "warn"), "DO 참고"],
    [gap, "보고 지연"], [s.review, "검수 필요"],
  ];
  const sort = { key: "code", dir: 1 };
  $("tab-summary").innerHTML = `
    <div class="toprow">
      <div>
        <div class="kpis">${kpis.map(([v, l]) =>
          `<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join("")}</div>
        <div class="legend">각 선박의 <b>최신 보고서 1건</b> 기준 척수.
          누적 보고서 ${s.files}건은 알림·선박 상세 탭에서.</div>
      </div>
      <div class="rules">
        <div><span class="t">판정 대상</span><b>FO (HSFO+LSFO)</b>만.
          DO(MGO)는 잔량이 작아 %가 튀므로 참고.</div>
        <div><span class="t">편차 %</span>(실측 − 장부) ÷ 그 섹션(FO/DO) <b>전체 장부량</b>.
          ${T.min_mt} MT 미만 탱크, DIFF 불일치·장부 누락 행은 제외.</div>
        <div><span class="t">심각</span>|z| ≥ ${T.high_z} 또는 |편차| ≥ ${T.high_pct}%
          &nbsp;·&nbsp; <span class="t">주의</span>|z| ≥ ${T.warn_z} 또는 |편차| ≥ ${T.warn_pct}%</div>
        <div><span class="t">z</span>자선 평소 편차 대비 로버스트 z-score
          (선박 × 섹션 × 규모순위). 절대 %만으로는 판정하지 않음.</div>
        <div><span class="t">장부반복</span>같은 장부값 3회 이상 = 미갱신 의심.
          기준선 계산에서 제외.</div>
        <div><span class="t">보고 지연</span>오늘 기준 ${T.gap_warn}일 이상 지연,
          ${T.gap_high}일 이상 미수신 (주간 보고 기준).</div>
      </div>
    </div>
    <h3 style="margin:6px 0 10px;font-size:14px">선박별 최신 보고</h3>
    <div class="wrap"><table><thead><tr>
      <th data-k="code">선박</th><th data-k="date">최신 보고일</th>
      <th data-k="gap">경과일</th><th data-k="fo">FO 판정</th><th>DO 참고</th>
      <th>항구</th><th>항차</th>
      <th>상태</th></tr></thead><tbody id="sumBody"></tbody></table></div>`;
  const SEV_KO = { high: "심각", warn: "주의" };
  const sevPill = (sev) => sev
    ? `<span class="pill ${sev}">${SEV_KO[sev]}</span>`
    : `<span class="pill none">정상</span>`;
  const draw = () => {
    const list = sortRows(rows, sort, {
      code: (r) => r.code, date: (r) => r.date,
      gap: (r) => (rep[r.code] || {}).gap,
      fo: (r) => RANK[cur[r.code].FO] || 0,
    });
    $("sumBody").innerHTML = list.map((r) => { const v = rep[r.code] || {}; return `<tr>
      <td>${esc(r.code)}</td>
      <td>${esc(r.date)}</td>
      <td><span class="pill ${v.sev || "ok"}">${v.gap == null ? "-" : v.gap + "일"}</span></td>
      <td>${sevPill(cur[r.code].FO)}</td>
      <td style="opacity:.7">${sevPill(cur[r.code].DO)}</td>
      <td>${esc(r.port)}</td><td>${esc(r.voy)}</td>
      <td><span class="pill ${r.status === "OK" ? "ok" : "warn"}">${r.status}</span></td>
    </tr>`; }).join("");
  };
  bindSort($("tab-summary"), sort, draw);
  draw();
}

/* FO and DO are read separately: they are different tanks with different
   handling, and averaging them hides which one is drifting */
function renderMatrix() {
  const { months, grids, sections } = DATA.matrix;
  let sec = sections[0].key;
  const host = $("tab-matrix");

  const draw = () => {
    const grid = grids[sec] || {};
    const codes = DATA.vessels.map((v) => v.code).filter((c) => grid[c]);
    const head = months.map((m) => `<th>${m.slice(2)}</th>`).join("");
    const body = codes.map((code) => {
      const tds = months.map((m) => {
        const cell = grid[code][m];
        if (!cell) return `<td></td>`;
        return `<td><span class="cell" style="background:${devColor(cell.pct)}"
          data-tip="${escAttr(JSON.stringify({ ...cell, code, sec }))}"
          >${fmt(cell.pct, 1)}%</span></td>`;
      }).join("");
      return `<tr><th class="v">${code}</th>${tds}</tr>`;
    }).join("");
    const picker = sections.map((x) =>
      `<button class="chip${x.key === sec ? " on" : ""}"
        data-s="${esc(x.key)}">${esc(x.label)}</button>`).join("");
    host.innerHTML = `
      <div class="pickrow">구분 <span id="mPick">${picker}</span></div>
      <div class="matrix"><table><thead><tr><th class="v">선박</th>${head}</tr>
        </thead><tbody>${body || ""}</tbody></table></div>
      <p class="legend">셀에 마우스를 올리면 그 달 보고서의 실측·장부 원값이 뜬다.
        월별 ${esc(sec)} 최대 편차 = (실측 − 장부) ÷ <b>${esc(sec)} 전체 장부량</b>.
        유종을 합산한 뒤 계산하므로 잔량이 적은 유종 때문에 %가 부풀지 않는다.
        <span class="pos">초록 = 포켓(실측이 더 많음)</span> ·
        <span class="neg">빨강 = 쇼트(실측이 모자람)</span>.
        전체 장부량 20 MT 미만은 제외.</p>`;
    $("mPick").querySelectorAll("button").forEach((b) => {
      b.onclick = () => { sec = b.dataset.s; draw(); };
    });
  };
  draw();
}

/* hover card on matrix cells: shows the raw figures behind the percentage
   so a suspicious number can be traced back to its source file */
function bindMatrixTips() {
  const tip = $("tip");
  const host = $("tab-matrix");
  host.addEventListener("mouseover", (e) => {
    const el = e.target.closest("[data-tip]");
    if (!el) return;
    const c = JSON.parse(el.dataset.tip);
    tip.innerHTML = `
      <div><b>${esc(c.code)}</b> ${esc(c.date)} · ${esc(c.sec)}
        (${esc(c.grades)})</div>
      <div><span class="k">실측 합</span>${fmt(c.sounding, 1)} MT</div>
      <div><span class="k">장부 합</span>${fmt(c.log, 1)} MT</div>
      <div><span class="k">차이</span>${fmt(c.diff, 1)} MT
        (${fmt(c.pct, 2)}%)</div>
      <div style="color:var(--muted);margin-top:4px">${esc(c.file)}${
        c.n > 1 ? ` · 이 달 ${c.n}건 중 최대` : ""}</div>`;
    tip.style.display = "block";
    place(e);
  });
  const place = (e) => {
    const pad = 14;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let x = e.clientX + pad, y = e.clientY + pad;
    if (x + w > innerWidth) x = e.clientX - w - pad;
    if (y + h > innerHeight) y = e.clientY - h - pad;
    tip.style.left = x + "px";
    tip.style.top = y + "px";
  };
  host.addEventListener("mousemove", (e) => {
    if (tip.style.display === "block") place(e);
  });
  host.addEventListener("mouseout", (e) => {
    if (e.target.closest("[data-tip]")) tip.style.display = "none";
  });
}

const KIND_LABEL = { deviation: "편차", density: "비중", stale: "장부반복" };
const SECTION_NOTE = {
  FO: "HSFO + LSFO. 판정 대상.",
  DO: "MGO. 잔량이 작아 몇 MT 차이도 %가 크게 튐 - 참고용, 판정에 쓰지 않음.",
};

function renderAlerts() {
  let section = "FO";
  const sort = { key: null, dir: -1 };
  $("tab-alerts").innerHTML = `
    <div class="pickrow">구분
      <button class="chip on" data-sec="FO">FO 중유 (HSFO+LSFO)</button>
      <button class="chip" data-sec="DO">DO 경유 (MGO · 참고)</button>
      <span id="alertNote"></span></div>
    <div class="controls">
      심각도 <select id="alertSev">
        <option value="all">전체</option><option value="high">심각</option>
        <option value="warn">주의</option></select>
      유형 <select id="alertKind">
        <option value="all">전체</option>
        ${Object.entries(KIND_LABEL).map(([k, v]) =>
          `<option value="${k}">${v}</option>`).join("")}</select>
      <input id="alertQ" placeholder="선박코드 검색" size="12">
      <label><input type="checkbox" id="alertHabit"> 평소 수준·장부반복 숨기기</label>
      <span id="alertCount" style="color:var(--muted)"></span>
    </div>
    <div class="wrap"><table><thead><tr>
      <th data-k="sev">등급</th><th data-k="code">선박</th>
      <th data-k="date">일자</th><th>유형</th>
      <th data-k="pct">내용 (편차 % 기준 정렬)</th>
      <th>파일</th></tr></thead><tbody id="alertBody"></tbody></table></div>`;
  const draw = () => {
    const sev = $("alertSev").value;
    const kind = $("alertKind").value;
    const hide = $("alertHabit").checked;
    const q = $("alertQ").value.trim().toUpperCase();
    const pool = DATA.alerts.filter((a) => a.section === section);
    $("alertNote").textContent = SECTION_NOTE[section];
    const list = sortRows(pool.filter((a) =>
      (sev === "all" || a.sev === sev)
      && (kind === "all" || a.kind === kind)
      && (!q || a.code.includes(q))
      && !(hide && (a.tags || []).length)), sort, {
        sev: (a) => SEV_RANK[a.sev], code: (a) => a.code,
        date: (a) => a.date,
        pct: (a) => a.pct == null ? null : Math.abs(a.pct),
      });
    $("alertCount").textContent = `${list.length} / ${pool.length}건`;
    $("alertBody").innerHTML = list.map((a) => `<tr>
      <td><span class="pill ${a.sev}">${a.sev === "high" ? "심각" : "주의"}</span></td>
      <td>${esc(a.code)}</td><td>${esc(a.date)}</td>
      <td>${KIND_LABEL[a.kind] || a.kind}</td>
      <td>${esc(a.text)}${(a.tags || []).map((t) =>
        ` <span class="tag">${esc(t)}</span>`).join("")}</td>
      <td style="color:var(--muted)">${esc(a.file)}</td></tr>`).join("")
      || `<tr><td colspan="6" style="color:var(--muted)">해당 없음</td></tr>`;
  };
  ["alertSev", "alertKind", "alertHabit"].forEach((id) => {
    $(id).onchange = draw;
  });
  $("alertQ").oninput = draw;
  bindSort($("tab-alerts"), sort, draw);
  $("tab-alerts").querySelectorAll(".chip").forEach((b) => {
    b.onclick = () => {
      $("tab-alerts").querySelectorAll(".chip").forEach((c) =>
        c.classList.remove("on"));
      b.classList.add("on");
      section = b.dataset.sec;
      draw();
    };
  });
  draw();
}

/* reporting history: who sent what and when, so the ships that went quiet
   can be chased. Gap is measured against today, not the newest report */
const GAP_LABEL = { ok: "정상", warn: "지연", high: "미수신" };

function chaseText(late) {
  const head = `BSR 미수신 선박 (${DATA.today} 기준)\n`;
  const body = late.map((v) => v.last
    ? `- ${v.code}: 최근 ${v.last} (${v.gap}일 경과)`
    : `- ${v.code}: 보고 이력 없음`).join("\n");
  return head + (body || "- 없음");
}

  const late = R.vessels.filter((v) => v.sev !== "ok")

    <p class="legend" style="margin-top:0">주간 보고 기준. 오늘(${esc(DATA.today)})로부터
      ${GAP_WARN}일 이상 = 지연, ${GAP_HIGH}일 이상 = 미수신.

      <th data-k="code">선박</th><th data-k="sev">상태</th>

      <th data-k="interval" class="num">평소 간격</th>
      <th data-k="recent90" class="num">90일 내</th>

  const draw = () => {
    const rows = sortRows(R.vessels, sort, {

const SERIES_COLORS = ["#4da3ff", "#e0a33e", "#3fb27f", "#c07de0", "#e2544a"];

/* dependency-free line chart: one line per fuel grade, shared date axis so
   grades can be compared against each other for the same vessel */
function lineChart(series, width, height) {
  const dates = [...new Set(series.flatMap((s) =>
    s.points.map((p) => p.date)))].sort();
  if (!dates.length) return `<p style="color:var(--muted)">데이터 없음</p>`;
  const pad = { l: 46, r: 14, t: 12, b: 26 };
  const all = series.flatMap((s) => s.points.map((p) => p.pct));
  const yMax = Math.max(2, ...all.map(Math.abs));
  const px = (d) => pad.l + (width - pad.l - pad.r) *
    (dates.length === 1 ? 0.5 : dates.indexOf(d) / (dates.length - 1));
  const py = (v) => pad.t + (height - pad.t - pad.b) *
    (1 - (v + yMax) / (2 * yMax));
  const ticks = [yMax, yMax / 2, 0, -yMax / 2, -yMax].map((v) =>
    `<line class="gridline" x1="${pad.l}" x2="${width - pad.r}"
       y1="${py(v)}" y2="${py(v)}"></line>
     <text class="tick" x="6" y="${py(v) + 3}">${v.toFixed(1)}%</text>`).join("");
  const body = series.map((s, si) => {
    const color = SERIES_COLORS[si % SERIES_COLORS.length];
    const pts = s.points.slice().sort((a, b) => a.date < b.date ? -1 : 1);
    const path = pts.map((p, i) =>
      `${i ? "L" : "M"}${px(p.date).toFixed(1)},${py(p.pct).toFixed(1)}`).join("");
    const dots = pts.map((p) =>
      `<circle cx="${px(p.date)}" cy="${py(p.pct)}" r="3" fill="${color}">
        <title>${esc(s.name)} ${p.date} ${fmt(p.pct)}% (실측 ${fmt(p.sounding, 1)} / 장부 ${fmt(p.log, 1)} MT · ${esc(p.section)} 전체 ${fmt(p.sec_log, 1)} MT 대비)</title>
       </circle>`).join("");
    return `<path d="${path}" fill="none" stroke="${color}"
      stroke-width="1.6"/>${dots}`;
  }).join("");
  const step = Math.ceil(dates.length / 8);
  const labels = dates.map((d, i) => (i % step === 0)
    ? `<text class="tick" x="${px(d)}" y="${height - 8}"
        text-anchor="middle">${d.slice(5)}</text>` : "").join("");
  const legend = series.map((s, si) =>
    `<span class="lg"><i style="background:${
      SERIES_COLORS[si % SERIES_COLORS.length]}"></i>${esc(s.name)}</span>`
  ).join("");
  return `<svg viewBox="0 0 ${width} ${height}" width="100%"
    height="${height}">${ticks}${body}${labels}</svg>
    <div class="legendrow">${legend}</div>`;
}

function renderVessel() {
  const opts = DATA.vessels.map((v) =>
    `<option value="${v.code}">${v.code}</option>`).join("");
  $("tab-vessel").innerHTML = `
    <div class="pickrow">선박 <select id="vSel">${opts}</select></div>
    <div class="pickrow">유종 <span id="gPick"></span></div>
    <div id="vChart"></div>
    <div class="wrap" style="margin-top:14px"><table><thead><tr>
      <th data-k="date">일자</th><th data-k="grade">유종</th><th>항구</th>
      <th data-k="sounding" class="num">실측 MT</th>
      <th data-k="log" class="num">장부 MT</th>
      <th data-k="diff" class="num">차이 MT</th>
      <th data-k="pct" class="num">편차 %</th>
      <th class="num">비중</th>
      </tr></thead><tbody id="vBody"></tbody></table></div>
    <p class="legend">편차 % = 차이 ÷ 그 섹션(FO/DO) 전체 장부량.
      표는 최신 보고 순, 헤더 클릭으로 정렬.</p>`;

  let picked = null;   // null = every grade this vessel reports
  const sort = { key: "date", dir: -1 };

  /* the grade list is rebuilt per vessel because ships carry different
     parcels, and TOTAL only exists where the ship prints a combined line */
  const gradesOf = (code) => [...new Set(DATA.rows
    .filter((r) => r.code === code).map((r) => r.grade))].sort();

  const drawPicker = (code) => {
    const grades = gradesOf(code);
    if (picked && !grades.includes(picked)) picked = null;
    $("gPick").innerHTML = ["전체", ...grades].map((g) => {
      const val = g === "전체" ? "" : g;
      const on = (picked || "") === val ? " on" : "";
      return `<button class="chip${on}" data-g="${esc(val)}">${esc(g)}</button>`;
    }).join("");
    $("gPick").querySelectorAll("button").forEach((b) => {
      b.onclick = () => { picked = b.dataset.g || null; draw(); };
    });
  };

  const draw = () => {
    const code = $("vSel").value;
    drawPicker(code);
    const rows = DATA.rows
      .filter((r) => r.code === code && (!picked || r.grade === picked))
      .sort((a, b) => a.date < b.date ? -1 : 1);
    const byGrade = {};
    rows.filter((r) => r.pct !== null).forEach((r) => {
      (byGrade[r.grade] = byGrade[r.grade] || []).push(r);
    });
    const series = Object.keys(byGrade).sort().map((g) => ({
      name: g, points: byGrade[g],
    }));
    $("vChart").innerHTML = lineChart(series, 900, 260);
    const table = sortRows(rows, sort, {
      date: (r) => r.date, grade: (r) => r.grade,
      sounding: (r) => r.sounding, log: (r) => r.log, diff: (r) => r.diff,
      pct: (r) => r.pct,
    });
    $("vBody").innerHTML = table.map((r) => `<tr>
      <td>${esc(r.date)}</td><td>${esc(r.grade)}</td><td>${esc(r.port)}</td>
      <td class="num">${fmt(r.sounding, 1)}</td>
      <td class="num">${fmt(r.log, 1)}</td>
      <td class="num ${r.diff >= 0 ? "pos" : "neg"}">${fmt(r.diff, 2)}</td>
      <td class="num ${r.pct >= 0 ? "pos" : "neg"}">${fmt(r.pct)}</td>
      <td class="num">${fmt(r.sg, 4)}</td></tr>`).join("");
  };
  $("vSel").onchange = draw;
  bindSort($("tab-vessel"), sort, draw);
  draw();
}

function renderReview() {
  const list = DATA.review;
  $("tab-review").innerHTML = `
    <p class="legend" style="margin-top:0">파싱이 완전하지 않은 보고서.
      원본을 열어 확인 후 파서 보완 또는 본선 양식 교정 대상.</p>
    <div class="wrap"><table><thead><tr>
      <th>파일</th><th>선박</th><th>일자</th><th>상태</th><th>사유</th>
      </tr></thead><tbody>
    ${list.map((r) => `<tr><td>${esc(r.file)}</td><td>${esc(r.code)}</td>
      <td>${esc(r.date)}</td>
      <td><span class="pill ${r.status === "FAIL" ? "high" : "warn"}">${r.status}</span></td>
      <td>${esc(r.reasons)}</td></tr>`).join("")
      || `<tr><td colspan="5" style="color:var(--muted)">전부 정상</td></tr>`}
    </tbody></table></div>`;
}

initTabs();
$("meta").textContent = `${DATA.stats.from} ~ ${DATA.stats.to} · `
  + `보고서 ${DATA.stats.files}건 · 생성 ${DATA.generated}`;
renderSummary();
renderMatrix();
bindMatrixTips();
renderAlerts();
renderReporting();
renderVessel();
renderReview();
</script>
</body>
</html>
